function _bmnRenderDetailHapus(detail) {
  var master = detail.master || {};
  var items = detail.items || [];
  var currentTahap = String(master.tahap || 'DRAFT_USULAN').toUpperCase();

  var elBadge = document.getElementById('bmn-detail-hps-badge');
  if (elBadge) elBadge.innerHTML = _bmnGetTahapBadge(currentTahap);

  var stepOrder = ['DRAFT_USULAN', 'SURAT_USULAN', 'PERSETUJUAN_KEMENKEU', 'SK_PENGHAPUSAN', 'BAST_SELESAI'];
  var currentIdx = stepOrder.indexOf(currentTahap);

  var elStepper = document.getElementById('bmn-detail-hps-stepper');
  if (elStepper) {
    elStepper.querySelectorAll('.n-step-item').forEach(function (stepEl) {
      var stepName = stepEl.getAttribute('data-step');
      var stepIdx = stepOrder.indexOf(stepName);
      stepEl.classList.remove('active', 'completed', 'rejected');

      if (currentTahap === 'DITOLAK') {
        if (stepIdx <= 2) stepEl.classList.add('completed');
        if (stepIdx === 2) stepEl.classList.add('rejected');
      } else if (currentTahap === 'VOID') {
        stepEl.classList.add('rejected');
      } else {
        if (stepIdx < currentIdx) {
          stepEl.classList.add('completed');
        } else if (stepIdx === currentIdx) {
          stepEl.classList.add('active');
        }
      }
    });
  }

  var elAlert = document.getElementById('bmn-detail-hps-alert');
  if (elAlert) {
    if (currentTahap === 'DITOLAK') {
      elAlert.className = 'n-msg n-msg-error';
      elAlert.classList.remove('n-hidden');
      elAlert.innerHTML = '<strong>Usulan Ditolak</strong><br>' + _esc(master.keteranganAlasan || '');
    } else if (currentTahap === 'VOID') {
      elAlert.className = 'n-msg n-msg-error';
      elAlert.classList.remove('n-hidden');
      elAlert.innerHTML = '<strong>Berkas Usulan Telah Dianulir</strong><br>' + _esc(master.voidReason || 'Usulan dibatalkan internal.');
    } else {
      elAlert.classList.add('n-hidden');
    }
  }

  var elAlasan = document.getElementById('bmn-detail-hps-alasan');
  var elKet = document.getElementById('bmn-detail-hps-keterangan');
  var elUnit = document.getElementById('bmn-detail-hps-total-unit');
  var elPerolehan = document.getElementById('bmn-detail-hps-total-perolehan');
  var elBuku = document.getElementById('bmn-detail-hps-total-buku');

  var elNomor = document.getElementById('bmn-detail-hps-nomor');
  var elTgl = document.getElementById('bmn-detail-hps-tanggal');
  var elPeruntukan = document.getElementById('bmn-detail-hps-peruntukan');
  var elSubmitter = document.getElementById('bmn-detail-hps-submitter');

  if (elNomor) elNomor.textContent = master.penghapusanId || master.nomorSuratUsulan || '—';
  if (elTgl) elTgl.textContent = _formatDate(master.tanggalUsulan || master.timestamp);
  if (elPeruntukan) elPeruntukan.textContent = _bmnGetAlasanLabel(master.alasanPenghapusan);
  if (elSubmitter) elSubmitter.textContent = master.submittedBy || '—';

  if (elAlasan) elAlasan.textContent = _bmnGetAlasanLabel(master.alasanPenghapusan);
  if (elKet) elKet.textContent = master.keteranganAlasan || '-';
  if (elUnit) elUnit.textContent = (master.totalUnit || items.length) + ' Unit';
  if (elPerolehan) elPerolehan.textContent = _rupiah(master.totalNilaiPerolehan);
  if (elBuku) elBuku.textContent = _rupiah(master.totalNilaiBuku);

  var elDocs = document.getElementById('bmn-detail-docs-summary');
  if (elDocs) {
    var docHtml = '';
    if (master.nomorSuratUsulan) {
      docHtml += '<div style="margin-bottom:4px;"><strong>Surat Usulan:</strong> ' + _esc(master.nomorSuratUsulan);
      if (master.evidenceSuratUsulan) {
        docHtml += ' <a href="' + _esc(master.evidenceSuratUsulan) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
      }
      docHtml += '</div>';
    } else {
      docHtml += '<div style="color:var(--n-text-muted); margin-bottom:4px;">Surat Usulan: Belum diterbitkan</div>';
    }

    if (master.nomorSuratPersetujuan) {
      docHtml += '<div style="margin-bottom:4px;"><strong>Persetujuan DJKN:</strong> ' + _esc(master.nomorSuratPersetujuan) + ' (' + _esc(master.instansiKemenkeu || 'DJKN') + ')';
      if (master.evidenceSuratPersetujuan) {
        docHtml += ' <a href="' + _esc(master.evidenceSuratPersetujuan) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
      }
      docHtml += '</div>';
    } else {
      docHtml += '<div style="color:var(--n-text-muted); margin-bottom:4px;">Persetujuan DJKN: Belum ada</div>';
    }

    if (master.nomorSK) {
      docHtml += '<div style="margin-bottom:4px;"><strong>SK Penghapusan:</strong> ' + _esc(master.nomorSK);
      if (master.evidenceSK) {
        docHtml += ' <a href="' + _esc(master.evidenceSK) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
      }
      docHtml += '</div>';
    }

    if (master.evidenceBAST) {
      docHtml += '<div style="margin-bottom:4px;"><strong>BAST Selesai:</strong> <a href="' + _esc(master.evidenceBAST) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas BAST]</a></div>';
    }

    elDocs.innerHTML = docHtml;
  }

  var elCount = document.getElementById('bmn-detail-hps-items-count');
  if (elCount) elCount.textContent = items.length + ' item';

  var tbody = document.getElementById('bmn-detail-hps-items-tbody');
  if (tbody) {
    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:16px; color:var(--n-text-muted);">Tidak ada daftar aset dalam usulan ini.</td></tr>';
    } else {
      var itemHtml = '';
      items.forEach(function (it) {
        var stBadge = '';
        var st = String(it.statusAset || '').toUpperCase();
        if (st === 'DALAM_PENGHAPUSAN') {
          stBadge = '<span class="badge" style="background:#FEF08A;color:#854D0E;">Karantina Usulan</span>';
        } else if (st === 'DIHAPUS') {
          stBadge = '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Dihapus (Final)</span>';
        } else {
          stBadge = '<span class="badge" style="background:#DEF7EC;color:#03543F;">' + _esc(st) + '</span>';
        }

        itemHtml += '<tr>' +
                      '<td>' +
                        '<strong class="tnum">' + _esc(it.kodeBarang) + '</strong>' +
                        '<div style="font-size:.72rem; color:var(--n-text-muted);">NUP: ' + _esc(it.nup) + '</div>' +
                      '</td>' +
                      '<td>' +
                        '<div style="font-weight:600;">' + _esc(it.namaBarang) + '</div>' +
                        (it.merekTipe ? '<div style="font-size:.72rem; color:var(--n-text-muted);">' + _esc(it.merekTipe) + '</div>' : '') +
                      '</td>' +
                      '<td>' + _esc(it.kondisiSaatUsulan || '-') + '</td>' +
                      '<td>' + _esc(it.lokasiId || '-') + '</td>' +
                      '<td style="text-align:right;" class="tnum font-semibold">' + _rupiah(it.nilaiBukuSaatUsulan) + '</td>' +
                      '<td>' + stBadge + '</td>' +
                    '</tr>';
      });
      tbody.innerHTML = itemHtml;
    }
  }

  _bmnRenderAdvanceForm(currentTahap, master);
}

function _bmnRenderAdvanceForm(currentTahap, master) {
  var advanceWrap = document.getElementById('bmn-detail-advance-wrap');
  var advanceTitle = document.getElementById('bmn-detail-advance-title');
  var nextBadge = document.getElementById('bmn-detail-next-step-badge');
  var advanceFields = document.getElementById('bmn-detail-advance-fields');
  var btnReject = document.getElementById('btn-advance-reject');
  var btnAdvance = document.getElementById('btn-confirm-advance');
  var btnVoid = document.getElementById('btn-open-void-hapus');

  if (btnVoid) {
    if (currentTahap === 'BAST_SELESAI' || currentTahap === 'VOID') {
      btnVoid.style.display = 'none';
    } else {
      btnVoid.style.display = '';
    }
  }

  if (currentTahap === 'BAST_SELESAI' || currentTahap === 'DITOLAK' || currentTahap === 'VOID') {
    if (advanceWrap) advanceWrap.style.display = 'none';
    return;
  }

  if (advanceWrap) advanceWrap.style.display = '';
  if (btnReject) btnReject.style.display = 'none';
  _BMN_HPS.isRejectMode = false;

  var fieldsHtml = '';

  if (currentTahap === 'DRAFT_USULAN') {
    if (advanceTitle) advanceTitle.textContent = 'Terbitkan Surat Usulan Internal Satker';
    if (nextBadge) nextBadge.textContent = 'Lanjut ke: SURAT_USULAN';
    if (btnAdvance) btnAdvance.textContent = 'Kirim & Catat Surat Usulan';

    fieldsHtml = '<div class="form-grp">' +
                   '<label for="bmn-adv-no-surat">Nomor Surat Usulan Internal <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-no-surat" class="n-input" value="' + _esc(master.nomorSuratUsulan || '') + '" placeholder="Contoh: B.123/TU/BMN/X/2026">' +
                 '</div>' +
                 '<div class="form-grp">' +
                   '<label for="bmn-adv-tgl-surat">Tanggal Surat Usulan <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="date" id="bmn-adv-tgl-surat" class="n-input" value="' + _esc(master.tanggalSuratUsulan || '') + '">' +
                 '</div>' +
                 '<div class="form-grp" style="grid-column:1 / -1;">' +
                   '<label for="bmn-adv-link-surat">Bukti Dukung / Salinan Surat (Link Google Drive / PDF) <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-link-surat" class="n-input" value="' + _esc(master.evidenceSuratUsulan || '') + '" placeholder="https://drive.google.com/...">' +
                 '</div>';

  } else if (currentTahap === 'SURAT_USULAN') {
    if (advanceTitle) advanceTitle.textContent = 'Persetujuan / Keputusan DJKN/KPKNL';
    if (nextBadge) nextBadge.textContent = 'Lanjut ke: Persetujuan DJKN';
    if (btnAdvance) btnAdvance.textContent = 'Catat Persetujuan DJKN';
    if (btnReject) btnReject.style.display = '';

    fieldsHtml = '<div class="form-grp">' +
                   '<label for="bmn-adv-no-persetujuan">Nomor Surat Persetujuan DJKN <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-no-persetujuan" class="n-input" placeholder="Contoh: S-456/MK.6/KNL.01/2026">' +
                 '</div>' +
                 '<div class="form-grp">' +
                   '<label for="bmn-adv-tgl-persetujuan">Tanggal Persetujuan DJKN <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="date" id="bmn-adv-tgl-persetujuan" class="n-input">' +
                 '</div>' +
                 '<div class="form-grp">' +
                   '<label for="bmn-adv-instansi-kemenkeu">Instansi Penerbit DJKN/KPKNL <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-instansi-kemenkeu" class="n-input" placeholder="Contoh: KPKNL Jakarta I / DJKN">' +
                 '</div>' +
                 '<div class="form-grp">' +
                   '<label for="bmn-adv-link-persetujuan">Salinan Surat Persetujuan (Drive / PDF) <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-link-persetujuan" class="n-input" placeholder="https://drive.google.com/...">' +
                 '</div>';

  } else if (currentTahap === 'PERSETUJUAN_KEMENKEU') {
    if (advanceTitle) advanceTitle.textContent = 'Penerbitan Keputusan Penghapusan (SK KKP)';
    if (nextBadge) nextBadge.textContent = 'Lanjut ke: SK_PENGHAPUSAN';
    if (btnAdvance) btnAdvance.textContent = 'Catat SK Penghapusan';

    fieldsHtml = '<div class="form-grp">' +
                   '<label for="bmn-adv-no-sk">Nomor SK Penghapusan KKP <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-no-sk" class="n-input" placeholder="Contoh: KEP.789/MEN-KP/2026">' +
                 '</div>' +
                 '<div class="form-grp">' +
                   '<label for="bmn-adv-tgl-sk">Tanggal SK Penghapusan <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="date" id="bmn-adv-tgl-sk" class="n-input">' +
                 '</div>' +
                 '<div class="form-grp" style="grid-column:1 / -1;">' +
                   '<label for="bmn-adv-link-sk">Salinan Berkas SK Penghapusan (Drive / PDF) <span style="color:var(--n-crit)">*</span></label>' +
                   '<input type="text" id="bmn-adv-link-sk" class="n-input" placeholder="https://drive.google.com/...">' +
                 '</div>';

  } else if (currentTahap === 'SK_PENGHAPUSAN') {
    if (advanceTitle) advanceTitle.textContent = 'Penyelesaian Pemusnahan / Risalah Lelang (BAST Akhir)';
    if (nextBadge) nextBadge.textContent = 'Finalisasi: BAST_SELESAI';
    if (btnAdvance) btnAdvance.textContent = 'Finalisasi & Hapus Aset';

    fieldsHtml = '<div class="form-grp" style="grid-column:1 / -1;">' +
                   '<label for="bmn-adv-link-bast">Salinan Berkas BAST / Risalah Lelang (Drive / PDF) <span style="color:var(--n-crit)">*</span></label>' +

function _bmnToggleRejectMode() {
  _BMN_HPS.isRejectMode = !_BMN_HPS.isRejectMode;

  var advanceTitle = document.getElementById('bmn-detail-advance-title');
  var nextBadge = document.getElementById('bmn-detail-next-step-badge');
  var advanceFields = document.getElementById('bmn-detail-advance-fields');
  var btnReject = document.getElementById('btn-advance-reject');
  var btnAdvance = document.getElementById('btn-confirm-advance');

  if (_BMN_HPS.isRejectMode) {
    if (advanceTitle) advanceTitle.textContent = 'Tolak Berkas Usulan';
    if (nextBadge) {
      nextBadge.textContent = 'Tahap: DITOLAK';
      nextBadge.className = 'n-badge n-badge-subtle n-badge-crit';
    }
    if (btnReject) btnReject.textContent = 'Batal Menolak (Kembali ke Persetujuan)';
    if (btnAdvance) {
      btnAdvance.textContent = 'Konfirmasi Tolak Usulan';
      btnAdvance.className = 'btn-danger-solid';
    }

    if (advanceFields) {
      advanceFields.innerHTML = '<div class="form-grp" style="grid-column:1 / -1;">' +
                                  '<label for="bmn-adv-alasan-tolak">Alasan Penolakan <span style="color:var(--n-crit)">*</span></label>' +
                                  '<textarea id="bmn-adv-alasan-tolak" class="n-input" rows="3" placeholder="Sebutkan pertimbangan penolakan..."></textarea>' +
                                  '<div style="font-size:.75rem; color:var(--n-text-muted); margin-top:4px;">' +
                                    'Aset yang sebelumnya dikarantina akan otomatis dipulihkan kembali ke status AKTIF di register inventaris.' +
                                  '</div>' +
                                '</div>';
    }
  } else {
    var master = (_BMN_HPS.activeDetail && _BMN_HPS.activeDetail.master) || {};
    _bmnRenderAdvanceForm('SURAT_USULAN', master);
  }
}

function _bmnSubmitAdvanceStage() {
  if (!_BMN_HPS.activeDetail || !_BMN_HPS.activeDetail.master) return;
  var master = _BMN_HPS.activeDetail.master;
  var currentTahap = String(master.tahap || 'DRAFT_USULAN').toUpperCase();
  var hpsId = master.penghapusanId;

  var payload = {
    penghapusanId: hpsId
  };

  if (_BMN_HPS.isRejectMode) {
    var elAlasanTolak = document.getElementById('bmn-adv-alasan-tolak');
    var alasanTolak = elAlasanTolak ? elAlasanTolak.value.trim() : '';
    if (!alasanTolak) {
      _msg('bmn-detail-advance-msg', 'error', 'Alasan penolakan wajib diisi.');
      return;
    }
    payload.tahapTarget = 'DITOLAK';
    payload.alasanTolak = alasanTolak;
  } else if (currentTahap === 'DRAFT_USULAN') {
    var elNo = document.getElementById('bmn-adv-no-surat');
    var elTgl = document.getElementById('bmn-adv-tgl-surat');
    var elLink = document.getElementById('bmn-adv-link-surat');

    var noSurat = elNo ? elNo.value.trim() : '';
    var tglSurat = elTgl ? elTgl.value : '';
    var linkSurat = elLink ? elLink.value.trim() : '';

    if (!noSurat) { _msg('bmn-detail-advance-msg', 'error', 'Nomor Surat Usulan wajib diisi.'); return; }
    if (!tglSurat) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal Surat Usulan wajib diisi.'); return; }
    if (!linkSurat) { _msg('bmn-detail-advance-msg', 'error', 'Link berkas bukti Surat Usulan wajib dilampirkan.'); return; }

    payload.tahapTarget = 'SURAT_USULAN';
    payload.nomorSuratUsulan = noSurat;
    payload.tanggalSuratUsulan = tglSurat;
    payload.evidenceSuratUsulan = linkSurat;

  } else if (currentTahap === 'SURAT_USULAN') {
    var elNoP = document.getElementById('bmn-adv-no-persetujuan');
    var elTglP = document.getElementById('bmn-adv-tgl-persetujuan');
    var elInst = document.getElementById('bmn-adv-instansi-kemenkeu');
    var elLinkP = document.getElementById('bmn-adv-link-persetujuan');

    var noP = elNoP ? elNoP.value.trim() : '';
    var tglP = elTglP ? elTglP.value : '';
    var inst = elInst ? elInst.value.trim() : '';
    var linkP = elLinkP ? elLinkP.value.trim() : '';

    if (!noP) { _msg('bmn-detail-advance-msg', 'error', 'Nomor Surat Persetujuan DJKN wajib diisi.'); return; }
    if (!tglP) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal Surat Persetujuan DJKN wajib diisi.'); return; }
    if (!inst) { _msg('bmn-detail-advance-msg', 'error', 'Instansi DJKN/KPKNL penerbit persetujuan wajib diisi.'); return; }
    if (!linkP) { _msg('bmn-detail-advance-msg', 'error', 'Link bukti berkas persetujuan wajib dilampirkan.'); return; }

    payload.tahapTarget = 'PERSETUJUAN_KEMENKEU';
    payload.nomorSuratPersetujuan = noP;
    payload.tanggalSuratPersetujuan = tglP;
    payload.instansiKemenkeu = inst;
    payload.evidenceSuratPersetujuan = linkP;

  } else if (currentTahap === 'PERSETUJUAN_KEMENKEU') {
    var elNoSK = document.getElementById('bmn-adv-no-sk');
    var elTglSK = document.getElementById('bmn-adv-tgl-sk');
    var elLinkSK = document.getElementById('bmn-adv-link-sk');

    var noSK = elNoSK ? elNoSK.value.trim() : '';
    var tglSK = elTglSK ? elTglSK.value : '';
    var linkSK = elLinkSK ? elLinkSK.value.trim() : '';

    if (!noSK) { _msg('bmn-detail-advance-msg', 'error', 'Nomor SK Penghapusan KKP wajib diisi.'); return; }
    if (!tglSK) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal SK Penghapusan wajib diisi.'); return; }
    if (!linkSK) { _msg('bmn-detail-advance-msg', 'error', 'Link bukti berkas SK Penghapusan wajib dilampirkan.'); return; }

    payload.tahapTarget = 'SK_PENGHAPUSAN';
    payload.nomorSK = noSK;
    payload.tanggalSK = tglSK;
    payload.evidenceSK = linkSK;

  } else if (currentTahap === 'SK_PENGHAPUSAN') {
    var elLinkBAST = document.getElementById('bmn-adv-link-bast');
    var linkBAST = elLinkBAST ? elLinkBAST.value.trim() : '';

    if (!linkBAST) { _msg('bmn-detail-advance-msg', 'error', 'Link berkas BAST / Risalah Lelang wajib dilampirkan.'); return; }

    payload.tahapTarget = 'BAST_SELESAI';
    payload.evidenceBAST = linkBAST;
  }

  var btnAdvance = document.getElementById('btn-confirm-advance');
  if (btnAdvance) btnAdvance.disabled = true;
  _msg('bmn-detail-advance-msg', 'info', 'Menyimpan proses tahapan siklus...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (btnAdvance) btnAdvance.disabled = false;
      if (!res.success) {
        _msg('bmn-detail-advance-msg', 'error', res.error || 'Gagal memproses tahapan.');
        return;
      }
      _msg('bmn-detail-advance-msg', 'success', 'Tahapan berkas berhasil dimutakhirkan ke: ' + payload.tahapTarget);
      _bmnLoadPenghapusanList(true);
      _bmnLoadAsetList(true);
      _bmnLoadSummary(true);
      setTimeout(function () {
        _bmnOpenDetailHapusModal(hpsId);
      }, 700);
    })
    .withFailureHandler(function (err) {
      if (btnAdvance) btnAdvance.disabled = false;
      _msg('bmn-detail-advance-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
    })
    .bmn_advancePenghapusan(APP.token, payload);
}

// ==========================================

function _bmnPromptVoidHapus(penghapusanId) {
  _BMN_HPS.pendingVoidId = penghapusanId;
  var elTarget = document.getElementById('bmn-void-hps-target-id');
  var elReason = document.getElementById('bmn-void-hps-reason');
  var elMsg = document.getElementById('bmn-void-hps-msg');

  if (elTarget) elTarget.textContent = penghapusanId;
  if (elReason) elReason.value = '';
  if (elMsg) elMsg.innerHTML = '';

  openModal('modal-bmn-void-hapus');
}

function _bmnOpenVoidModal() {
  if (!_BMN_HPS.activeDetail || !_BMN_HPS.activeDetail.master) return;
  _bmnPromptVoidHapus(_BMN_HPS.activeDetail.master.penghapusanId);
}

function _bmnExecuteVoidHapus() {
  var penghapusanId = _BMN_HPS.pendingVoidId;
  var elReason = document.getElementById('bmn-void-hps-reason');
  var reason = elReason ? elReason.value.trim() : '';
  var btn = document.getElementById('btn-confirm-void-hapus');

  if (!reason) {
    _msg('bmn-void-hps-msg', 'error', 'Alasan pembatalan/anulir usulan wajib diisi.');
    return;
  }

  if (btn) btn.disabled = true;
  _msg('bmn-void-hps-msg', 'info', 'Membatalkan berkas usulan dan memulihkan status aset...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) btn.disabled = false;
      if (!res.success) {
        _msg('bmn-void-hps-msg', 'error', res.error || 'Gagal menganulir usulan.');
        return;
      }
      closeModal('modal-bmn-void-hapus');
      closeModal('modal-bmn-detail-hapus');
      _msg('bmn-table-msg', 'success', 'Berkas usulan ' + penghapusanId + ' berhasil dianulir dan seluruh aset dipulihkan ke status AKTIF.');
      _bmnLoadPenghapusanList(true);
      _bmnLoadAsetList(true);
      _bmnLoadSummary(true);
    })
    .withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      _msg('bmn-void-hps-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
    })
    .bmn_voidPenghapusan(APP.token, {
      penghapusanId: penghapusanId,
      alasan: reason
    });
}

/**
 * _uiAudit() — Runtime Layout & Geometry Probe (DESIGN.md §5.5.6 & ARCHITECTURE.md §17.2)
 * Memindai seluruh kontainer kontrol interaktif di DOM aktif.
 * Memverifikasi bahwa seluruh kontrol berdampingan memiliki getBoundingClientRect().height identik.
 */
function _uiAudit() {
  var rows = document.querySelectorAll('.ctl-row, .hist-actions, .filter-box, .n-seg, [class*="ctl-"]');
  var results = [];
  var totalChecked = 0;
  var violations = 0;

  rows.forEach(function (container) {
    if (container.offsetParent === null) return; // skip hidden
    var items = Array.from(container.children).filter(function (el) {
      var tag = el.tagName.toLowerCase();
      return (tag === 'button' || tag === 'select' || (tag === 'input' && el.type !== 'hidden') || el.classList.contains('n-seg') || el.classList.contains('btn'));
    });
    if (items.length < 2) return;
    totalChecked++;

    var heights = items.map(function (el) {
      return { el: el, h: Math.round(el.getBoundingClientRect().height * 10) / 10 };
    });
    var baseH = heights[0].h;
    var mismatched = heights.filter(function (it) {
      return Math.abs(it.h - baseH) > 1.5;
    });

    if (mismatched.length > 0) {
      violations++;
      results.push({
        container: container,
        expectedHeight: baseH,
        mismatched: mismatched
      });
      console.warn('[UI COHESION AUDIT VIOLATION]', container, heights);
    }
  });

  var summary = {
    pass: violations === 0,
    containersChecked: totalChecked,
    violations: violations,
    details: results
  };
  if (violations === 0) {
    console.info('[UI COHESION AUDIT PASS] Seluruh ' + totalChecked + ' kontainer kontrol berbaris memiliki tinggi identik.');
  } else {
    console.error('[UI COHESION AUDIT FAIL] Ditemukan ' + violations + ' kontainer dengan tinggi kontrol bertabrakan!');
  }
  return summary;
}
window._uiAudit = _uiAudit;
