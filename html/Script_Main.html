  function _simanpoaParseSaktiNumber(raw) {
    var s = String(raw || '').trim();
    if (!s || s === '-') return 0;
    var neg = false;
    if (s.charAt(0) === '(' && s.charAt(s.length - 1) === ')') {
      neg = true;
      s = s.slice(1, -1).trim();
    }
    s = s.replace(/rp/ig, '').replace(/\s+/g, '');
    if (s.charAt(0) === '-') {
      neg = !neg;
      s = s.slice(1);
    }
    if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) {
      s = s.replace(/,/g, '');
    } else if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else if (s.indexOf(',') !== -1 && s.indexOf('.') === -1) {
      if (/,\d{3}$/.test(s)) {
        s = s.replace(/,/g, '');
      } else {
        s = s.replace(',', '.');
      }
    } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');
    }
    var val = parseFloat(s);
    if (!isFinite(val)) return 0;
    return neg ? -val : val;
  }

  function _simanpoaParseIndonesianDateToIso(str) {
    var s = String(str || '').trim();
    if (!s) return '';
    var isoM = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoM) return isoM[0];

    var months = {
      JANUARI: '01', JAN: '01', JANUARY: '01',
      FEBRUARI: '02', FEB: '02', FEBRUARY: '02',
      MARET: '03', MAR: '03', MARCH: '03',
      APRIL: '04', APR: '04',
      MEI: '05', MAY: '05',
      JUNI: '06', JUN: '06', JUNE: '06',
      JULI: '07', JUL: '07', JULY: '07',
      AGUSTUS: '08', AGU: '08', AGT: '08', AUGUST: '08', AUG: '08',
      SEPTEMBER: '09', SEP: '09', SEPT: '09',
      OKTOBER: '10', OKT: '10', OCTOBER: '10', OCT: '10',
      NOVEMBER: '11', NOV: '11', NOPEMBER: '11', NOP: '11',
      DESEMBER: '12', DES: '12', DECEMBER: '12', DEC: '12'
    };

    var idM = s.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
    if (idM) {
      var mon = months[idM[2].toUpperCase()];
      if (mon) {
        var dd = ('0' + parseInt(idM[1], 10)).slice(-2);
        return idM[3] + '-' + mon + '-' + dd;
      }
    }

    var dmyM = s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (dmyM) {
      var dPad = ('0' + parseInt(dmyM[1], 10)).slice(-2);
      var mPad = ('0' + parseInt(dmyM[2], 10)).slice(-2);
      return dmyM[3] + '-' + mPad + '-' + dPad;
    }

    var mOnly = s.match(/([A-Za-z]+)\s+(\d{4})/);
    if (mOnly && months[mOnly[1].toUpperCase()]) {
      var yr = parseInt(mOnly[2], 10);
      var moNum = parseInt(months[mOnly[1].toUpperCase()], 10);
      var lastDay = new Date(yr, moNum, 0).getDate();
      return mOnly[2] + '-' + months[mOnly[1].toUpperCase()] + '-' + ('0' + lastDay).slice(-2);
    }
    return '';
  }

  function _simanpoaGroupPdfItemsToLines(items, viewport) {
    if (!items || !items.length) return [];
    var vp = viewport && viewport.transform;
    var positioned = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it || !it.str || !it.str.trim()) continue;
      var tr = it.transform || [1, 0, 0, 1, 0, 0];
      var x = tr[4] || 0;
      var y = tr[5] || 0;
      if (vp && vp.length >= 6) {
        x = vp[0] * (tr[4] || 0) + vp[2] * (tr[5] || 0) + vp[4];
        y = vp[1] * (tr[4] || 0) + vp[3] * (tr[5] || 0) + vp[5];
      }
      positioned.push({
        str: it.str,
        x: x,
        y: y
      });
    }
    positioned.sort(function (a, b) {
      return (vp ? (a.y - b.y) : (b.y - a.y)) || (a.x - b.x);
    });

    var buckets = [];
    for (var j = 0; j < positioned.length; j++) {
      var cur = positioned[j];
      var lastBucket = buckets.length > 0 ? buckets[buckets.length - 1] : null;
      if (!lastBucket || Math.abs(lastBucket.y - cur.y) > 2.5) {
        buckets.push({ y: cur.y, items: [cur] });
      } else {
        lastBucket.items.push(cur);
      }
    }

    var pageLines = [];
    for (var b = 0; b < buckets.length; b++) {
      buckets[b].items.sort(function (a, b2) { return a.x - b2.x; });
      var lineText = buckets[b].items.map(function (x) { return x.str; }).join(' ').replace(/\s+/g, ' ').trim();
      if (lineText) pageLines.push(lineText);
    }
    return pageLines;
  }

  function _simanpoaExtractSaktiData(lines, fileName, overrideDocType, overrideJenisLap, overridePeriode) {
    var safeLines = Array.isArray(lines) ? lines : [];
    var fullText = safeLines.join('\n');
    var fName = String(fileName || '');

    var docType = (overrideDocType && overrideDocType !== 'AUTO') ? overrideDocType : '';
    if (!docType) {
      if (/POSISI\s+(?:BMN|BARANG\s+MILIK\s+NEGARA)\s+DI\s+NERACA|LAPORAN\s+NERACA/i.test(fullText) ||
        (/NERACA/i.test(fName) && !/RINCIAN/i.test(fullText))) {
        docType = 'NERACA';
      } else {
        docType = 'RINCIAN_BARANG';
      }
    }

    var jenisLap = (overrideJenisLap && overrideJenisLap !== 'AUTO') ? overrideJenisLap : '';
    if (docType === 'NERACA') {
      jenisLap = 'NERACA';
    } else if (!jenisLap) {
      if (/GABUNGAN/i.test(fullText) || /GABUNGAN/i.test(fName)) {
        jenisLap = 'GABUNGAN';
      } else if (/EKSTRAKOMPTABEL/i.test(fullText) || /EKSTRA/i.test(fName)) {
        jenisLap = 'EKSTRA';
      } else if (/INTRAKOMPTABEL/i.test(fullText) || /INTRA/i.test(fName)) {
        jenisLap = 'INTRA';
      } else {
        jenisLap = 'AUTO';
      }
    }

    var periodeLap = String(overridePeriode || '').trim();
    if (!periodeLap) {
      var pHeaderMatch = fullText.match(/(?:UNTUK\s+PERIODE\s+YANG\s+BERAKHIR(?:\s+TANGGAL)?|PERIODE|PER\s+TANGGAL|S\/D)\s*[:\s]*(\d{1,2}\s+[A-Za-z]+\s+\d{4}|\d{4}-\d{2}-\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4})/i);
      if (pHeaderMatch) {
        periodeLap = _simanpoaParseIndonesianDateToIso(pHeaderMatch[1]);
      }
      if (!periodeLap) {
        var idDateMatch = fullText.match(/\b(\d{1,2}\s+(?:JANUARI|FEBRUARI|MARET|APRIL|MEI|JUNI|JULI|AGUSTUS|SEPTEMBER|OKTOBER|NOVEMBER|NOPEMBER|DESEMBER)\s+\d{4})\b/i);
        if (idDateMatch) {
          periodeLap = _simanpoaParseIndonesianDateToIso(idDateMatch[1]);
        }
      }
      if (!periodeLap) {
        periodeLap = new Date().toISOString().substring(0, 10);
      }
    }

    var extractedRows = [];
    if (docType === 'NERACA') {
      for (var i = 0; i < safeLines.length; i++) {
        var line = String(safeLines[i] || '').trim();
        if (!line) continue;
        var m = line.match(/^(?:\d+\s+)?(1\d{5})\s+(.+?)\s+(\(?[0-9][0-9.,]*\)?)\s*$/);
        if (m) {
          extractedRows.push({
            kodeAkun: m[1],
            uraianAkun: m[2].replace(/\s+/g, ' ').trim(),
            jumlahNilai: _simanpoaParseSaktiNumber(m[3])
          });
        }
      }
    } else {
      var currentAkunKode = '132111';
      var currentAkunUraian = 'Peralatan dan Mesin';
      var knownUnitRe = /^(Unit|Buah|Set|Paket|Tahun|Orang|Meter|M2|M3|Kg|Liter|Lusin|Rim|Box|Kaleng|Botol|Lembar|Bidang|Eksemplar|Koli|-)$/i;

      for (var k = 0; k < safeLines.length; k++) {
        var rLine = String(safeLines[k] || '').trim();
        if (!rLine) continue;

        // Deteksi baris header 6-digit Akun Neraca (mis. 132111 Peralatan dan Mesin ...)
        var akunM = rLine.match(/^(1\d{5})\s+(.+)$/);
        if (akunM) {
          currentAkunKode = akunM[1];
          var cleanAkunDesc = akunM[2].replace(/(?:\s+\(?[0-9][0-9.,]*\)?)+$/, '').replace(/\s+/g, ' ').trim();
          if (cleanAkunDesc) currentAkunUraian = cleanAkunDesc;
          continue;
        }

        // Deteksi baris item 10-digit Kode Barang SAKTI
        var itemM = rLine.match(/^(?:\d+\s+)?(\d{10}|\d\.\d{2}\.\d{2}\.\d{2}\.\d{3})\s+(.+)$/);
        if (!itemM) continue;

        var kd = itemM[1].replace(/\./g, '');
        var rest = itemM[2].trim();

        // Kumpulkan token numerik utuh yang diapit spasi dari teks baris
        var numTokens = [];
        var tokRe = /(?:^|\s)(\(?[0-9][0-9.,]*\)?)(?=\s|$)/g;
        var tm;
        while ((tm = tokRe.exec(rest)) !== null) {
          var tokenStart = tm.index + (tm[0].length - tm[1].length);
          numTokens.push({ raw: tm[1], start: tokenStart });
        }

        if (numTokens.length < 2) continue;

        var splitIdx;
        var cleanNums;
        var qAwal = 0, nAwal = 0, qTambah = 0, nTambah = 0, qKurang = 0, nKurang = 0, qAkhir = 0, nAkhir = 0;

        if (numTokens.length >= 8) {
          var trailing8 = numTokens.slice(-8);
          splitIdx = trailing8[0].start;
          cleanNums = trailing8.map(function (t) { return _simanpoaParseSaktiNumber(t.raw); });
          qAwal = cleanNums[0];
          nAwal = cleanNums[1];
          qTambah = cleanNums[2];
          nTambah = cleanNums[3];
          qKurang = cleanNums[4];
          nKurang = cleanNums[5];
          qAkhir = cleanNums[6];
          nAkhir = cleanNums[7];
        } else {
          var trailing2 = numTokens.slice(-2);
          splitIdx = trailing2[0].start;
          cleanNums = trailing2.map(function (t) { return _simanpoaParseSaktiNumber(t.raw); });
          qTambah = cleanNums[0];
          nTambah = cleanNums[1];
          qAkhir = cleanNums[0];
          nAkhir = cleanNums[1];
        }

        var prefix = rest.slice(0, splitIdx).replace(/\s+/g, ' ').trim();
        var satuan = 'Unit';
        var uraian = prefix;
        var pWords = prefix.split(/\s+/);
        if (pWords.length >= 2 && knownUnitRe.test(pWords[pWords.length - 1])) {
          var rawSat = pWords[pWords.length - 1];
          satuan = rawSat === '-' ? 'Unit' : rawSat;
          uraian = pWords.slice(0, -1).join(' ').trim();
        }

        extractedRows.push({
          kodeAkun: currentAkunKode,
          uraianAkun: currentAkunUraian,
          kodeBarang: kd,
          uraianBarang: uraian || ('Barang ' + kd),
          satuan: satuan,
          kuantitasAwal: qAwal,
          nilaiAwal: nAwal,
          kuantitasTambah: qTambah,
          nilaiTambah: nTambah,
          kuantitasKurang: qKurang,
          nilaiKurang: nKurang,
          kuantitasAkhir: qAkhir,
          nilaiAkhir: nAkhir
        });
      }
    }

    return {
      docType: docType,
      jenisLaporan: jenisLap,
      periodeLaporan: periodeLap,
      rows: extractedRows
    };
  }

  function _simanpoaSetSaktiProgress(visible, pct, label) {

    if (txtEl && label) txtEl.textContent = label;

  function _simanpoaProcessExtractedSaktiLines(allLines, fileName) {
    var docEl = document.getElementById('simanpoa-sync-doctype');
    var jenisEl = document.getElementById('simanpoa-sync-jenislap');
    var perEl = document.getElementById('simanpoa-sync-periode');
    var autoBadge = document.getElementById('simanpoa-sync-autodetect-badge');
    var prevBox = document.getElementById('simanpoa-sync-preview-box');
    var commitBtn = document.getElementById('simanpoa-btn-commit-sync');

    var parsed = _simanpoaExtractSaktiData(
      allLines,
      fileName,
      docEl ? docEl.value : 'AUTO',
      jenisEl ? jenisEl.value : 'AUTO',
      perEl ? perEl.value : ''
    );

    if (autoBadge) {
      autoBadge.textContent = parsed.docType + ' (' + parsed.jenisLaporan + ')';
    }
    if (perEl && !perEl.value.trim() && parsed.periodeLaporan) {
      perEl.value = parsed.periodeLaporan;
    }

    if (parsed.periodeLaporan && !_bmnValidateSaneDate(parsed.periodeLaporan, 2000, new Date().getFullYear() + 1)) {
      _simanpoaSetSaktiProgress(false, 0, '');
      if (prevBox) prevBox.classList.add('n-hidden');
      if (commitBtn) commitBtn.disabled = true;
      _msg('simanpoa-sync-msg', 'error', 'Format Periode / Tanggal Buku tidak valid. Gunakan format YYYY-MM-DD (contoh: 2026-09-30).');
      return;
    }

    if (!parsed.rows || parsed.rows.length === 0) {
      _simanpoaSetSaktiProgress(false, 0, '');
      if (prevBox) prevBox.classList.add('n-hidden');
      if (commitBtn) commitBtn.disabled = true;
      _msg('simanpoa-sync-msg', 'error', 'Format tabel SAKTI tidak dikenali atau tidak ditemukan baris data pada dokumen ini. Pastikan berkas berasal dari ekspor resmi SAKTI.');
      return;
    }

    if (parsed.docType !== 'NERACA') {
      var invalidSakti = parsed.rows.filter(function (r) {
        return r.kuantitasAwal < 0 || r.kuantitasTambah < 0 || r.kuantitasKurang < 0 || r.kuantitasAkhir < 0 || r.nilaiAwal < 0 || r.nilaiAkhir < 0;
      });
      if (invalidSakti.length > 0) {
        _simanpoaSetSaktiProgress(false, 0, '');
        if (prevBox) prevBox.classList.add('n-hidden');
        if (commitBtn) commitBtn.disabled = true;
        _msg('simanpoa-sync-msg', 'error', 'Ditemukan ' + invalidSakti.length + ' baris dengan kuantitas atau saldo nilai negatif yang tidak wajar. Periksa kembali dokumen sumber SAKTI.');
        return;
      }
    }

    _simanpoaSetSaktiProgress(true, 90, 'Menghitung perubahan delta (' + parsed.rows.length + ' baris)...');
    _msg('simanpoa-sync-msg', null);

    google.script.run
      .withSuccessHandler(function (res) {
        _simanpoaSetSaktiProgress(false, 100, '');
        if (!res || !res.success) {
          if (prevBox) prevBox.classList.add('n-hidden');
          if (commitBtn) commitBtn.disabled = true;
          _msg('simanpoa-sync-msg', 'error', (res && res.error) || 'Gagal melakukan analisis delta di server.');
          return;
        }
        _msg('simanpoa-sync-msg', 'success', 'Ekstraksi selesai. Ditemukan ' + res.data.totalRows + ' baris data siap ditinjau sebelum diterapkan.');
        _SIMANPOA.pendingSyncRows = res.data.previewRows;
        _SIMANPOA.pendingSyncMeta = res.data;
        _simanpoaRenderSaktiPreview(res.data);
        if (commitBtn) commitBtn.disabled = (res.data.totalRows === 0);
      })
      .withFailureHandler(function (err) {
        _simanpoaSetSaktiProgress(false, 0, '');
        if (prevBox) prevBox.classList.add('n-hidden');
        if (commitBtn) commitBtn.disabled = true;
        _msg('simanpoa-sync-msg', 'error', 'Gagal terhubung ke server: ' + ((err && err.message) || 'Terjadi kesalahan koneksi.'));
      })
      .bmn_previewSaktiSync(APP.token, {
        docType: parsed.docType,
        jenisLaporan: parsed.jenisLaporan,
        periodeLaporan: parsed.periodeLaporan,
        fileName: fileName,
        rows: parsed.rows
      });
  }

  function _simanpoaHandleSaktiFile(e) {
    var file = e && e.target && e.target.files && e.target.files[0];
    var fileLbl = document.getElementById('simanpoa-sync-file-lbl');
    var prevBox = document.getElementById('simanpoa-sync-preview-box');
    var commitBtn = document.getElementById('simanpoa-btn-commit-sync');
    var perEl = document.getElementById('simanpoa-sync-periode');

    if (!file) return;
    if (fileLbl) fileLbl.textContent = file.name + ' (' + Math.max(1, Math.round(file.size / 1024)) + ' KB)';
    if (perEl) perEl.value = '';
    if (prevBox) prevBox.classList.add('n-hidden');
    if (commitBtn) commitBtn.disabled = true;
    _SIMANPOA.pendingSyncRows = null;
    _SIMANPOA.pendingSyncMeta = null;

    var ext = (file.name.split('.').pop() || '').toLowerCase();

    if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
      _simanpoaSetSaktiProgress(true, 25, 'Membaca berkas ' + ext.toUpperCase() + '...');
      _msg('simanpoa-sync-msg', null);
      _loadSheetJS(function () {
        if (typeof XLSX === 'undefined') {
          _simanpoaSetSaktiProgress(false, 0, '');
          _msg('simanpoa-sync-msg', 'error', 'Library pembaca Excel (SheetJS) gagal dimuat. Periksa koneksi internet.');
          return;
        }
        var reader = new FileReader();
        reader.onload = function (ev) {
          try {
            var wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
            var allLines = [];
            wb.SheetNames.forEach(function (name) {
              var grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
              grid.forEach(function (row) {
                var lineStr = row.map(function (c) { return String(c === null || c === undefined ? '' : c).trim(); }).filter(Boolean).join(' ');
                if (lineStr) allLines.push(lineStr);
              });
            });
            _SIMANPOA.lastSaktiLines = allLines;
            _SIMANPOA.lastSaktiFileName = file.name;
            _simanpoaProcessExtractedSaktiLines(allLines, file.name);
          } catch (err) {
            _simanpoaSetSaktiProgress(false, 0, '');
            _msg('simanpoa-sync-msg', 'error', 'Gagal membaca file Excel: ' + (err.message || 'Format tidak didukung.'));
          }
        };
        reader.readAsArrayBuffer(file);
      });
      return;
    }

    if (!window.pdfjsLib) {
      _msg('simanpoa-sync-msg', 'error', 'Library PDF.js belum siap di peramban. Muat ulang halaman.');
      return;
    }

    _simanpoaSetSaktiProgress(true, 10, 'Membaca dokumen PDF SAKTI...');
    _msg('simanpoa-sync-msg', null);

    var reader = new FileReader();
    reader.onload = function (ev) {
      var typedarray = new Uint8Array(ev.target.result);
      window.pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
        var numPages = pdf.numPages || 1;
        var completedPages = 0;
        var pagePromises = [];

        for (var i = 1; i <= numPages; i++) {
          (function (pageIdx) {
            pagePromises.push(pdf.getPage(pageIdx).then(function (page) {
              var viewport = page.getViewport({ scale: 1 });
              return page.getTextContent().then(function (textContent) {
                completedPages++;
                var pct = 10 + Math.round((completedPages / numPages) * 70);
                _simanpoaSetSaktiProgress(true, pct, 'Mengekstrak teks halaman ' + completedPages + ' dari ' + numPages + '...');
                return _simanpoaGroupPdfItemsToLines(textContent.items, viewport);
              });
            }));
          })(i);
        }

        Promise.all(pagePromises).then(function (pagesLines) {
          var allLines = [];
          pagesLines.forEach(function (pl) {
            allLines = allLines.concat(pl);
          });
          _SIMANPOA.lastSaktiLines = allLines;
          _SIMANPOA.lastSaktiFileName = file.name;
          _simanpoaProcessExtractedSaktiLines(allLines, file.name);
        });
      }).catch(function (err) {
        _simanpoaSetSaktiProgress(false, 0, '');
        _msg('simanpoa-sync-msg', 'error', 'Gagal membaca berkas PDF: ' + ((err && err.message) || 'Berkas rusak atau terenkripsi.'));
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function _simanpoaRenderSaktiPreview(data) {
    var prevBox = document.getElementById('simanpoa-sync-preview-box');
    var countLbl = document.getElementById('simanpoa-sync-count-lbl');
    var statBadge = document.getElementById('simanpoa-sync-status-badge');

    prevBox.classList.remove('n-hidden');
    var isNeraca = data.docType === 'NERACA';

    if (countLbl) {
      countLbl.textContent = (data.totalRows || 0) + ' baris' + (!isNeraca ? (' (' + (data.changedCount || 0) + ' perubahan delta)') : '');
    }
    if (statBadge) {
      statBadge.textContent = (data.docType || '') + ' · ' + (data.jenisLaporan || '') + (data.periodeLaporan ? (' · ' + data.periodeLaporan) : '');
    }

          '<th style="padding:7px 8px;">Status</th>' +
          '<th style="padding:7px 8px;">Kode</th>' +
          '<th style="padding:7px 8px;">Uraian Barang</th>' +
          '<th style="padding:7px 6px;">Jenis</th>' +
          '<th style="padding:7px 6px; text-align:right;">Tambah</th>' +
          '<th style="padding:7px 6px; text-align:right;">Kurang</th>' +

    }

    if (tbody) {
      var html = '';
      if (isNeraca) {
        (data.previewRows || []).forEach(function (r) {
          var badgeStyle = r.statusDelta === 'BERUBAH'
            ? 'background:#FEF3C7; color:#92400E; font-weight:700;'
            : (r.statusDelta === 'AKUN_BARU' ? 'background:#ECFDF5; color:#065F46; font-weight:700;' : 'background:#F3F4F6; color:var(--n-text-secondary);');
          html += '<tr>' +
            '<td><span class="badge" style="' + badgeStyle + '">' + _esc(r.statusDelta) + '</span></td>' +
            '<td class="tnum font-medium">' + _esc(r.kodeAkun) + '</td>' +
            '<td>' + _esc(r.uraianAkun) + '</td>' +

            '<td class="tnum font-bold" style="text-align:right; white-space:nowrap;">' + _formatRupiah(r.nilaiBaru) + '</td>' +
            '<td class="tnum" style="text-align:right; white-space:nowrap;">' + _formatRupiah(r.selisih) + '</td>' +
            '</tr>';
        });
      } else {
        (data.previewRows || []).forEach(function (r) {
          var badgeStyle = r.statusDelta === 'TETAP'
            ? 'background:#F3F4F6; color:var(--n-text-secondary);'
            : 'background:#ECFDF5; color:#065F46; font-weight:700;';
          var shortStatus = r.statusDelta === 'BARANG_BARU' ? 'BARU' : _esc(r.statusDelta);
          html += '<tr>' +
            '<td style="padding:6px 8px;"><span class="badge" style="font-size:0.62rem; ' + badgeStyle + '">' + shortStatus + '</span></td>' +
            '<td class="tnum font-medium" style="padding:6px 8px; white-space:nowrap; font-size:0.72rem;"><div style="font-size:0.62rem; color:var(--n-text-muted);">' + _esc(r.kodeAkun) + '</div>' + _esc(r.kodeBarang) + '</td>' +
            '<td style="padding:6px 8px; max-width:155px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + _esc(r.uraianBarang) + '">' + _esc(r.uraianBarang) + '</td>' +
            '<td style="padding:6px 6px;"><span class="badge" style="font-size:0.62rem;">' + _esc(r.jenisLaporan) + '</span></td>' +
            '<td class="tnum" style="padding:6px 6px; text-align:right; color:#065F46; white-space:nowrap;">' + _formatRupiah(r.nilaiTambah) + '</td>' +
            '<td class="tnum" style="padding:6px 6px; text-align:right; color:#991B1B; white-space:nowrap;">' + _formatRupiah(r.nilaiKurang) + '</td>' +
            '<td class="tnum" style="padding:6px 6px; text-align:right; white-space:nowrap;">' + _formatNumber(r.kuantitasAkhir) + '</td>' +
            '<td class="tnum font-bold" style="padding:6px 8px; text-align:right; white-space:nowrap;">' + _formatRupiah(r.nilaiAkhir) + '</td>' +
            '</tr>';
        });
      }
      tbody.innerHTML = html;
    }
  }

  function _simanpoaCommitSaktiSync() {
    var commitBtn = document.getElementById('simanpoa-btn-commit-sync');
    if (!_SIMANPOA.pendingSyncRows || _SIMANPOA.pendingSyncRows.length === 0) return;

    _setLoading(commitBtn, true);

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(commitBtn, false);
        if (!res || !res.success) {
          _msg('simanpoa-sync-msg', 'error', (res && res.error) || 'Gagal menerapkan sinkronisasi SAKTI.');
          return;
        }
        var docType = _SIMANPOA.pendingSyncMeta && _SIMANPOA.pendingSyncMeta.docType;
        var msgText = res.message || ('Sinkronisasi dokumen SAKTI (' + docType + ') berhasil diterapkan ke basis data SIMANPOA.');
        closeModal('modal-simanpoa-sakti-pdf');
        _msg('bmn-table-msg', 'success', msgText);
        if (docType === 'NERACA') {
          _simanpoaSelectPenatausahaanSub('neraca');
        } else {
          _simanpoaSelectPenatausahaanSub('sakti11');
        }
        _tuLoadBMN(true);
      })
      .withFailureHandler(function (err) {
        _setLoading(commitBtn, false);
        _msg('simanpoa-sync-msg', 'error', 'Kesalahan sistem saat sinkronisasi: ' + ((err && err.message) || 'Terjadi gangguan jaringan.'));
      })
      .bmn_commitSaktiSync(APP.token, {
        docType: _SIMANPOA.pendingSyncMeta.docType,
        jenisLaporan: _SIMANPOA.pendingSyncMeta.jenisLaporan,
        periodeLaporan: _SIMANPOA.pendingSyncMeta.periodeLaporan,
        fileName: _SIMANPOA.pendingSyncMeta.fileName,
        rows: _SIMANPOA.pendingSyncRows
      });
  }

  // ── PENGELOLAAN ASET BERBASIS DOKUMEN SK / BAST ───────────

  function _simanpoaOpenDocDisposalModal() {
    var fileInput = document.getElementById('simanpoa-file-disposal');
    var fileLbl = document.getElementById('simanpoa-disposal-file-lbl');
    var tbody = document.getElementById('simanpoa-disp-tbody-match');
    var thToggle = document.getElementById('simanpoa-disp-th-toggle');
    var selCount = document.getElementById('simanpoa-disp-sel-count');
    var execBtn = document.getElementById('simanpoa-btn-execute-disposal');

    if (fileInput) fileInput.value = '';
    if (fileLbl) fileLbl.textContent = 'Pilih Berkas PDF SK Penghapusan / BAST Serah Terima';
    _msg('simanpoa-disposal-msg', '', '');
    if (execBtn) execBtn.disabled = true;
    if (thToggle) thToggle.checked = false;
    if (selCount) selCount.textContent = '0';

    (document.getElementById('simanpoa-disp-nomor') || {}).value = '';
    (document.getElementById('simanpoa-disp-tgl') || {}).value = '';
    (document.getElementById('simanpoa-disp-ket') || {}).value = '';
    (document.getElementById('simanpoa-disp-instansi') || {}).value = '';

    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:18px; color:var(--n-text-muted);">Silakan unggah dokumen SK / BAST untuk mencocokkan aset secara otomatis...</td></tr>';
    }

    _SIMANPOA.pendingDisposalPayload = null;
    _simanpoaBindDropzone('simanpoa-dropzone-disposal', 'simanpoa-file-disposal', _simanpoaHandleDisposalFile);
    openModal('modal-simanpoa-doc-disposal');
  }

  function _simanpoaHandleDisposalFile(e) {
    var file = e && e.target && e.target.files && e.target.files[0];
    var fileLbl = document.getElementById('simanpoa-disposal-file-lbl');
    var execBtn = document.getElementById('simanpoa-btn-execute-disposal');

    if (!file) return;
    if (fileLbl) fileLbl.textContent = file.name + ' (' + Math.max(1, Math.round(file.size / 1024)) + ' KB)';
    if (execBtn) execBtn.disabled = true;

    var runServerMatch = function (fullText) {
      var cleanText = String(fullText || '');
      var noMatch = cleanText.match(/(?:NOMOR|NO[\.:]|KEP\.?|BAST)\s*[:\s]*([A-Z0-9][A-Z0-9\/\.\-]{3,})/i);
      if (noMatch) {
        var noEl = document.getElementById('simanpoa-disp-nomor');
        if (noEl && !noEl.value) noEl.value = noMatch[1].trim();
      }

      var tglMatch = cleanText.match(/\b(\d{1,2}\s+(?:Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Nopember|Desember)\s+\d{4}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}|\d{4}-\d{2}-\d{2})\b/i);
      if (tglMatch) {
        var iso = _simanpoaParseIndonesianDateToIso(tglMatch[1]);
        var tglEl = document.getElementById('simanpoa-disp-tgl');
        if (tglEl && iso && !tglEl.value) tglEl.value = iso;
      }

      var jenisEl = document.getElementById('simanpoa-disp-jenis');
      if (jenisEl) {
        if (/TRANSFER\s+KELUAR|MUTASI\s+KELUAR|SERAH\s+TERIMA/i.test(cleanText)) jenisEl.value = 'TRANSFER_KELUAR';
        else if (/NON[\-\s]?OPERASIONAL|166112/i.test(cleanText)) jenisEl.value = 'NON_OPERASIONAL';
        else if (/USULAN/i.test(cleanText)) jenisEl.value = 'USULAN_BARU';
        else jenisEl.value = 'SK_PENGHAPUSAN';
      }

      var ketEl = document.getElementById('simanpoa-disp-ket');
      if (ketEl && !ketEl.value) {
        ketEl.value = 'Dokumen sumber: ' + file.name;
      }

      _msg('simanpoa-disposal-msg', 'info', 'Mencocokkan nomor dan kode aset pada dokumen dengan register inventaris SIMANPOA...');

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            _msg('simanpoa-disposal-msg', 'error', (res && res.error) || 'Gagal mencocokkan dokumen.');
            return;
          }
          var mLen = (res.data && res.data.matchedAssets) ? res.data.matchedAssets.length : 0;
          if (mLen > 0) {
            _msg('simanpoa-disposal-msg', 'success', 'Ditemukan ' + mLen + ' unit aset yang sesuai dengan dokumen. Silakan tinjau dan konfirmasi.');
          } else {
            _msg('simanpoa-disposal-msg', 'info', 'Tidak ditemukan kecocokan otomatis dari teks PDF. Pilih aset secara manual dari daftar register aktif di bawah.');
          }
          _simanpoaRenderDisposalPreview(res.data);
        })
        .withFailureHandler(function (err) {
          _msg('simanpoa-disposal-msg', 'error', 'Gagal mencocokkan dokumen: ' + ((err && err.message) || 'Terjadi kesalahan sistem.'));
        })
        .bmn_previewDisposalDoc(APP.token, {
          fileName: file.name,
          rawText: cleanText
        });
    };

    if (file.type && file.type.indexOf('image/') === 0) {
      _msg('simanpoa-disposal-msg', 'info', 'Berkas gambar terdeteksi. Memuat daftar aset aktif untuk verifikasi manual...');
      runServerMatch(file.name);
      return;
    }

    if (!window.pdfjsLib) {
      _msg('simanpoa-disposal-msg', 'error', 'Library PDF.js belum siap di peramban.');
      return;
    }

    _msg('simanpoa-disposal-msg', 'info', 'Membaca teks dari berkas PDF SK / BAST...');

    var reader = new FileReader();
    reader.onload = function (ev) {
      var typedarray = new Uint8Array(ev.target.result);
      window.pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
        var numPages = pdf.numPages || 1;
        var pagePromises = [];

        for (var i = 1; i <= numPages; i++) {
          (function (pageIdx) {
            pagePromises.push(pdf.getPage(pageIdx).then(function (page) {
              var viewport = page.getViewport({ scale: 1 });
              return page.getTextContent().then(function (textContent) {
                return _simanpoaGroupPdfItemsToLines(textContent.items, viewport).join(' ');
              });
            }));
          })(i);
        }

        Promise.all(pagePromises).then(function (pageTexts) {
          runServerMatch(pageTexts.join('\n'));
        });
      }).catch(function (err) {
        _msg('simanpoa-disposal-msg', 'error', 'Gagal membaca PDF: ' + ((err && err.message) || 'Format berkas tidak valid.'));
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function _simanpoaUpdateDisposalSelCount() {
    var checkedCount = document.querySelectorAll('.simanpoa-disposal-cb:checked').length;
    var selCount = document.getElementById('simanpoa-disp-sel-count');
    var execBtn = document.getElementById('simanpoa-btn-execute-disposal');
    if (selCount) selCount.textContent = String(checkedCount);
    if (execBtn) execBtn.disabled = (checkedCount === 0);
  }

  function _simanpoaRenderDisposalPreview(data) {
    var tbody = document.getElementById('simanpoa-disp-tbody-match');
    var thToggle = document.getElementById('simanpoa-disp-th-toggle');
    if (!tbody || !data) return;

    var matched = data.matchedAssets || [];
    var others = data.otherEligibleAssets || [];
    var rows = [];

    matched.forEach(function (m) {
      rows.push({ item: m, isMatched: true });
    });
    others.forEach(function (o) {
      rows.push({ item: o, isMatched: false });
    });

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:24px; color:var(--n-crit);">' +
        'Belum ada unit aset berstatus AKTIF yang tersedia di register SIMANPOA.' +
        '</td></tr>';
      if (thToggle) thToggle.checked = false;
      _simanpoaUpdateDisposalSelCount();
      return;
    }

    var html = '';
    rows.forEach(function (entry) {
      var m = entry.item;
      var checkedAttr = entry.isMatched ? ' checked' : '';
      var badgeStyle = entry.isMatched
        ? 'background:#ECFDF5; color:#065F46; font-size:0.65rem;'
        : 'background:#F3F4F6; color:var(--n-text-muted); font-size:0.65rem;';
      var reasonText = m.matchReason || (entry.isMatched ? 'Kode cocok dengan dokumen' : 'Pilihan manual register aktif');

      html += '<tr>' +
        '<td style="text-align:center;"><input type="checkbox" class="simanpoa-disposal-cb" value="' + _esc(m.asetId) + '"' + checkedAttr + ' onchange="_simanpoaUpdateDisposalSelCount()"></td>' +
        '<td class="tnum font-medium">' + _esc(m.kodeBarang) + ' · NUP ' + _esc(m.nup) + '</td>' +
        '<td><strong>' + _esc(m.namaBarang) + '</strong>' + (m.noPolisi ? (' <span class="simanpoa-nopol-badge">' + _esc(m.noPolisi) + '</span>') : '') + '<div style="color:var(--n-text-muted); font-size:0.7rem;">' + _esc(m.lokasiId) + '</div></td>' +
        '<td><span class="badge" style="font-size:0.65rem;">' + _esc(m.kondisi) + '</span></td>' +
        '<td><span class="badge" style="' + badgeStyle + '">' + _esc(reasonText) + '</span></td>' +
        '<td class="tnum" style="text-align:right;">' + _formatRupiah(m.nilaiBuku !== undefined ? m.nilaiBuku : m.nilaiPerolehan) + '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
    if (thToggle) thToggle.checked = (matched.length > 0 && others.length === 0);
    _simanpoaUpdateDisposalSelCount();
  }

  function _simanpoaToggleAllDisposalAsets(masterEl) {
    var cbs = document.querySelectorAll('.simanpoa-disposal-cb');
    cbs.forEach(function (cb) {
      cb.checked = !!(masterEl && masterEl.checked);
    });
    _simanpoaUpdateDisposalSelCount();
  }

  var _simanpoaToggleAllDisposalCheck = _simanpoaToggleAllDisposalAsets;

  function _simanpoaExecuteDocDisposal() {
    var cbs = document.querySelectorAll('.simanpoa-disposal-cb:checked');
    var asetIds = [];
    cbs.forEach(function (cb) {
      asetIds.push(cb.value);
    });

    if (asetIds.length === 0) {
      _msg('simanpoa-disposal-msg', 'error', 'Pilih minimal 1 unit aset yang akan dikurangi atau dihapus.');
      return;
    }

    var noDok = ((document.getElementById('simanpoa-disp-nomor') || {}).value || '').trim();
    var tglDok = (document.getElementById('simanpoa-disp-tgl') || {}).value || '';
    var jenis = (document.getElementById('simanpoa-disp-jenis') || {}).value || 'SK_PENGHAPUSAN';
    var ket = ((document.getElementById('simanpoa-disp-ket') || {}).value || '').trim();
    var instansi = ((document.getElementById('simanpoa-disp-instansi') || {}).value || '').trim();
    var btn = document.getElementById('simanpoa-btn-execute-disposal');

    if (!noDok || noDok.length < 3 || !/[A-Z0-9]/i.test(noDok)) {
      _msg('simanpoa-disposal-msg', 'error', 'Nomor Dokumen SK / BAST wajib diisi dengan format yang valid (minimal 3 karakter).');
      return;
    }
    if (!tglDok || !_bmnValidateSaneDate(tglDok, 1990, new Date().getFullYear()) || tglDok > _bmnTodayIso()) {
      _msg('simanpoa-disposal-msg', 'error', 'Tanggal Dokumen tidak valid atau berada di masa depan.');
      return;
    }

    var alasan = 'SEBAB_LAIN';
    var ketUpper = ket.toUpperCase();
    if (ketUpper.indexOf('RUSAK') !== -1) alasan = 'RUSAK_BERAT';
    else if (ketUpper.indexOf('KADALUWARSA') !== -1) alasan = 'KADALUWARSA';
    else if (ketUpper.indexOf('HILANG') !== -1) alasan = 'HILANG';

    _setLoading(btn, true);

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res || !res.success) {
          _msg('simanpoa-disposal-msg', 'error', (res && res.error) || 'Gagal mengeksekusi pengurangan aset.');
          return;
        }
        closeModal('modal-simanpoa-doc-disposal');
        _msg('bmn-table-msg', 'success', res.message || 'Aset berhasil dikurangi dari inventaris aktif SIMANPOA.');
        _simanpoaLoadWorkspace(true);
        _tuLoadBMN(true);
        _bmnLoadPenghapusanList(true);
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg('simanpoa-disposal-msg', 'error', 'Terjadi kesalahan sistem saat mengeksekusi dokumen: ' + ((err && err.message) || 'Koneksi gagal.'));
      })
      .bmn_executeDocumentDisposal(APP.token, {
        nomorDokumen: noDok,
        tanggalDokumen: tglDok,
        jenisPengelolaan: jenis,
        alasan: alasan,
        instansiTujuan: instansi,
        keterangan: ket,
        asetIds: asetIds
      });
  }

  // ── MULTI-SHEET EXCEL EXPORT ENGINE (SHEETJS) ─────────────

  function _simanpoaExportExcel() {
    _loadSheetJS(function () {
      if (typeof XLSX === 'undefined') {
        alert('Library SheetJS belum siap di peramban.');
        return;
      }

      var ws = _SIMANPOA.workspaceData;
      var wb = XLSX.utils.book_new();

      // 1. Sheet: Posisi_Neraca_BMN
      var neracaRows = [
        ['KODE AKUN', 'URAIAN AKUN NERACA', 'KATEGORI KLASIFIKASI', 'JUMLAH NILAI (RP)']
      ];
      if (ws && ws.neraca && ws.neraca.items) {
        ws.neraca.items.forEach(function (n) {
          neracaRows.push([n.kodeAkun, n.uraianAkun, n.kategoriNeraca, n.jumlahNilai]);
        });
        if (ws.neraca.totals) {
          neracaRows.push(['', 'TOTAL EKUITAS / NILAI BERSIH NERACA BMN', '', ws.neraca.totals.neracaBersih]);
        }
      }
      var wsNeraca = XLSX.utils.aoa_to_sheet(neracaRows);
      XLSX.utils.book_append_sheet(wb, wsNeraca, 'Posisi_Neraca_BMN');

      // 2. Sheet: Rincian_11Kolom_SAKTI
      var saktiRows = [
        ['KODE AKUN', 'KODE BARANG', 'URAIAN BARANG', 'SATUAN', 'QTY AWAL', 'NILAI AWAL', 'QTY TAMBAH', 'NILAI TAMBAH', 'QTY KURANG', 'NILAI KURANG', 'QTY AKHIR', 'NILAI AKHIR', 'JENIS LAPORAN']
      ];
      if (ws && ws.rekapSakti) {
        var allSakti = (ws.rekapSakti.intra || []).concat(ws.rekapSakti.ekstra || []);
        allSakti.forEach(function (r) {
          saktiRows.push([
            r.kodeAkun, r.kodeBarang, r.uraianBarang, r.satuan,
            r.kuantitasAwal, r.nilaiAwal,
            r.kuantitasTambah, r.nilaiTambah,
            r.kuantitasKurang, r.nilaiKurang,
            r.kuantitasAkhir, r.nilaiAkhir,
            r.jenisLaporan
          ]);
        });
      }
      var wsSakti = XLSX.utils.aoa_to_sheet(saktiRows);
      XLSX.utils.book_append_sheet(wb, wsSakti, 'Rincian_11Kolom_SAKTI');

      // 3. Sheet: Kendaraan_Dinas_STNK
      var kndRows = [
        ['PLAT NOMOR', 'KODE BARANG', 'NUP', 'NAMA KENDARAAN', 'MEREK / TIPE', 'LOKASI UPT', 'RUANGAN', 'JATUH TEMPO PAJAK', 'JATUH TEMPO STNK', 'STATUS REMINDER', 'DOKUMEN STNK']
      ];
      if (ws && ws.kendaraan && ws.kendaraan.items) {
        ws.kendaraan.items.forEach(function (v) {
          var st = v.stnkStatus || {};
          kndRows.push([
            v.noPolisi || '', v.kodeBarang, v.nup, v.namaBarang, v.merekTipe || '',
            v.lokasiId, v.lokasiDetailRuangan || '',
            v.tglPajakTahunan || '', v.tglStnkLimaTahunan || '',
            st.milestoneLabel || st.statusReminder || 'AMAN',
            v.fotoStnkEvidenceId ? 'ADA' : 'BELUM'
          ]);
        });
      }
      var wsKnd = XLSX.utils.aoa_to_sheet(kndRows);
      XLSX.utils.book_append_sheet(wb, wsKnd, 'Kendaraan_Dinas_STNK');

      // 4. Sheet: Register_Unit_Fisik
      var regRows = [
        ['ASET ID', 'KODE BARANG', 'NUP', 'NAMA BARANG', 'MEREK / TIPE', 'PENCATATAN', 'KATEGORI', 'TGL PEROLEHAN', 'NILAI PEROLEHAN', 'NILAI BUKU', 'KONDISI', 'LOKASI UPT', 'RUANGAN', 'STATUS ASET']
      ];
      if (_BMN.listData && _BMN.listData.items) {
        _BMN.listData.items.forEach(function (a) {
          regRows.push([
            a.asetId, a.kodeBarang, a.nup, a.namaBarang, a.merekTipe || '',
            a.kategoriPencatatan, a.kodeKategori, a.tanggalPerolehan,
            a.nilaiPerolehan, a.nilaiBuku, a.kondisi, a.lokasiId, a.lokasiDetailRuangan || '', a.statusAset || 'AKTIF'
          ]);
        });
      }
      var wsReg = XLSX.utils.aoa_to_sheet(regRows);
      XLSX.utils.book_append_sheet(wb, wsReg, 'Register_Unit_Fisik');

      var dateStr = new Date().toISOString().substring(0, 10);
      XLSX.writeFile(wb, 'SIMANPOA_Laporan_Aset_DitPOA_' + dateStr + '.xlsx');
    });
  }

  /**
   * _uiAudit() — Runtime Layout & Geometry Probe (DESIGN.md §5.5.6 & ARCHITECTURE.md §17.2)
   * Memindai seluruh kontainer kontrol interaktif di DOM aktif.
   * Memverifikasi bahwa seluruh kontrol berdampingan memiliki getBoundingClientRect().height identik.
   */
  function _uiAudit() {
    var rows = document.querySelectorAll('.ctl-row, .hist-actions, .filter-box, .n-seg, [class*="ctl-"]');
    var results = [];
    var totalChecked = 0;
    var violations = 0;

    rows.forEach(function (container) {
      if (container.offsetParent === null) return; // skip hidden
      var items = Array.from(container.children).filter(function (el) {
        var tag = el.tagName.toLowerCase();
        return (tag === 'button' || tag === 'select' || (tag === 'input' && el.type !== 'hidden') || el.classList.contains('n-seg') || el.classList.contains('btn'));
      });
      if (items.length < 2) return;
      totalChecked++;

      var heights = items.map(function (el) {
        return { el: el, h: Math.round(el.getBoundingClientRect().height * 10) / 10 };
      });
      var baseH = heights[0].h;
      var mismatched = heights.filter(function (it) {
        return Math.abs(it.h - baseH) > 1.5;
      });

      if (mismatched.length > 0) {
        violations++;
        results.push({
          container: container,
          expectedHeight: baseH,
          mismatched: mismatched
        });
        console.warn('[UI COHESION AUDIT VIOLATION]', container, heights);
      }
    });

    var summary = {
      pass: violations === 0,
      containersChecked: totalChecked,
      violations: violations,
      details: results
    };
    if (violations === 0) {
      console.info('[UI COHESION AUDIT PASS] Seluruh ' + totalChecked + ' kontainer kontrol berbaris memiliki tinggi identik.');
    } else {
      console.error('[UI COHESION AUDIT FAIL] Ditemukan ' + violations + ' kontainer dengan tinggi kontrol bertabrakan!');
    }
    return summary;
  }
  window._uiAudit = _uiAudit;
