<script>
/* ============================================================
   Script_Main.html
   State management, hash routing, sidebar, filter periode.
   Dipanggil via include di Index.html.
   ============================================================ */

// ── KONSTANTA ─────────────────────────────────────────────
var TOKEN_KEY  = 'sikap_token';
var MONTHS     = ['Januari','Februari','Maret','April','Mei','Juni',
                  'Juli','Agustus','September','Oktober','November','Desember'];
var ROLE_LABEL = {
  SUPERADMIN: 'Super Administrator',
  DIREKTUR:   'Direktur',
  KADIV:      'Kepala Divisi / Ketua Tim Kerja',
  STAF:       'Staf'
};

// ── STATE ─────────────────────────────────────────────────
var APP = {
  token:          null,
  user:           null,
  currentView:    'tata-usaha',
  pendingQueueId: null,
  profilKapalId:  '',
  filter: {
    mode:     'monthly',   // 'monthly' | 'range'
    month:    new Date().getMonth() + 1,
    year:     new Date().getFullYear(),
    dateFrom: '',
    dateTo:   ''
  }
};

// State pendaftaran 2 tahap (verifikasi OTP). pendingTokenissued server
// setelah kode OTP benar; auth_register mewajibkannya sebagai bukti.
var REG = { otpEmail: null, pendingToken: null };

// ── BUSY GLOBAL — indikator loading di samping filter periode ──
// Setiap google.script.run otomatis memunculkan spinner selama call in-flight,
// apa pun sheet/server function-nya. Strategi (stabil, tanpa bergantung this):
//  - withSuccessHandler  : +1 saat setup call; -1 di dalam handler sukses.
//  - withFailureHandler  : tidak menaikkan, hanya -1 di dalam handler gagal.
// Karena GS hanya memanggil SATU handler (sukses ATAU gagal, tidak keduanya),
// setiap rantai = tepat +1 dan tepat -1 → selalu balik ke 0.
var _BUSY = 0;
var _BUSY_LAST = 0;
var _BUSY_WATCHDOG = null;
function _busyPushActivity() { _BUSY_LAST = Date.now(); }
function _busyInc() { _BUSY++; _busyPushActivity(); _syncBusy(); }
function _busyDec() {
  if (_BUSY > 0) _BUSY--;
  _busyPushActivity();
  _syncBusy();
}
function _syncBusy() {
  var isBusy = (_BUSY > 0);

  // 1. Topbar Loading Pill (Header Top-Right)
  var topbarLoading = document.getElementById('topbar-loading-indicator');
  if (topbarLoading) topbarLoading.classList.toggle('n-hidden', !isBusy);

  // 2. Toolbar Loading Bar (Dedicated Sub-Bar Right)
  var topLoading = document.getElementById('top-loading-bar');
  if (topLoading) topLoading.classList.toggle('n-hidden', !isBusy);

  // 3. Global Top Edge Indeterminate Progress Line
  var globalProg = document.getElementById('global-progress-line');
  if (globalProg) {
    globalProg.classList.toggle('n-hidden', !isBusy);
    globalProg.classList.toggle('active', isBusy);
  }

  // 4. Filter busy indicator
  var el = document.getElementById('filter-busy');
  if (el) el.style.display = isBusy ? 'flex' : 'none';

  if (isBusy && !_BUSY_WATCHDOG) {
    // Jaring pengaman: force-reset jika counter nyangkut (mis. call tanpa
    // failure-handler lalu GAGAL, sehingga tak ada handler yang menurunkan).
    _BUSY_WATCHDOG = setInterval(function () {
      if (_BUSY > 0 && (Date.now() - _BUSY_LAST) > 12000) {
        _BUSY = 0;
        _syncBusy();
      }
    }, 1000);
  } else if (!isBusy && _BUSY_WATCHDOG) {
    clearInterval(_BUSY_WATCHDOG);
    _BUSY_WATCHDOG = null;
  }
}
var _SILENT_RPC = false;
function _silentRun(fn) {
  _SILENT_RPC = true;
  try {
    fn();
  } finally {
    setTimeout(function () { _SILENT_RPC = false; }, 50);
  }
}

function _patchGoogleScriptRun() {
  try {
    var g = window.google && google.script && google.script.run;
    if (!g || g.__nBusyPatched) return;
    g.__nBusyPatched = true;
    var oWsh = g.withSuccessHandler;
    var oWfh = g.withFailureHandler;
    g.withSuccessHandler = function (h) {
      if (_SILENT_RPC) {
        return oWsh.call(this, h);
      }
      _busyInc();
      var runner = oWsh.call(this, function (res) {
        try { return h ? h(res) : res; }
        finally { _busyDec(); }
      });
      if (runner && runner.withFailureHandler) {
        var rWfh = runner.withFailureHandler;
        runner.withFailureHandler = function (fh) {
          return rWfh.call(this, function (err) {
            try { return fh ? fh(err) : err; }
            finally { _busyDec(); }
          });
        };
      }
      return runner;
    };
    g.withFailureHandler = function (h) {
      if (_SILENT_RPC) {
        return oWfh.call(this, h);
      }
      return oWfh.call(this, function (err) {
        try { return h ? h(err) : err; }
        finally { _busyDec(); }
      });
    };
  } catch (e) {
    // patch gagal → spinner tidak tampil, call tetap berjalan normal
  }
}

_patchGoogleScriptRun();
if (typeof window !== 'undefined') {
  window.addEventListener('load', _patchGoogleScriptRun);
  var _patchTimer = setInterval(function () {
    _patchGoogleScriptRun();
    if (window.google && google.script && google.script.run && google.script.run.__nBusyPatched) {
      clearInterval(_patchTimer);
    }
  }, 250);
}

// ── SYNC & HEARTBEAT STATE (Fase 15a/17) ─────────────────────
var APP_SYNC = {
  lastTxVersion:  null,   // string/angka versi transaksi data global dari server (DASH_TX_VERSION)
  lastTxMetadata: null,   // metadata transaksi terakhir { timestamp: ISOString, sheet: string } (Fase 17)
  inFlight:       false,  // mutex guard agar RPC sinkronisasi tidak tumpang tindih
  deferredReload: false,  // true jika ada pembaruan data saat modal form/input sedang aktif
  lastSyncTime:   0,      // timestamp lokal sinkronisasi sukses terakhir
  syncInterval:   35000   // 35 detik interval heartbeat background (hemat kuota GAS)
};

function _fmtSyncTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var hh = (d.getHours() < 10 ? '0' : '') + d.getHours();
  var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  var ss = (d.getSeconds() < 10 ? '0' : '') + d.getSeconds();
  return hh + ':' + mm + ':' + ss;
}

/**
 * Render Live Header Telemetry & Sync Status Terpadu (Fase 17 Refinement)
 * Menyajikan status sinkronisasi satu-pintu dengan ikon SVG dan hover popover.
 * Tidak ada teks ganda/clutter di header.
 */
function _updateTelemetryTimestampUI() {
  var syncEl = document.getElementById('sync-indicator');
  if (!syncEl) return;
  var txt = syncEl.querySelector('.sync-indicator-text');
  var popStatus = syncEl.querySelector('.sync-pop-status');
  var popData = document.getElementById('sync-pop-data');

  var meta = APP_SYNC.lastTxMetadata;
  if (!meta || !meta.timestamp) {
    if (txt && !syncEl.classList.contains('is-syncing') && !syncEl.classList.contains('is-deferred')) {
      txt.textContent = 'Tersinkron';
    }
    if (popStatus) popStatus.textContent = 'Sistem Tersinkron';
    if (popData) popData.textContent = 'Data per: Terbaru';
    syncEl.title = 'Sistem Tersinkron. Klik untuk memeriksa pembaruan.';
    return;
  }
  var d = new Date(meta.timestamp);
  if (isNaN(d.getTime())) {
    if (txt && !syncEl.classList.contains('is-syncing') && !syncEl.classList.contains('is-deferred')) {
      txt.textContent = 'Tersinkron';
    }
    if (popStatus) popStatus.textContent = 'Sistem Tersinkron';
    if (popData) popData.textContent = 'Data per: Belum tersedia';
    syncEl.title = 'Sistem Tersinkron. Klik untuk memeriksa pembaruan.';
    return;
  }
  var monthsShort = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var day = d.getDate();
  var mName = monthsShort[d.getMonth()] || '';
  var y = d.getFullYear();
  var hh = (d.getHours() < 10 ? '0' : '') + d.getHours();
  var mm = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  var dateStr = day + ' ' + mName + ' ' + y + ' \u00B7 ' + hh + ':' + mm + ' WIB';

  var ageDays = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
  var isStale = ageDays > 7;

  if (popData) {
    popData.textContent = 'Data per: ' + dateStr + (meta.sheet ? ' (' + meta.sheet + ')' : '');
  }

  if (isStale) {
    syncEl.classList.add('is-stale');
    if (txt) txt.textContent = 'Data Usang';
    if (popStatus) popStatus.textContent = 'Data Perlu Pembaruan';
    syncEl.title = 'Peringatan: Data terakhir diperbarui ' + Math.floor(ageDays) + ' hari yang lalu (> 7 hari). Klik untuk memeriksa pembaruan.';
  } else {
    syncEl.classList.remove('is-stale');
    if (txt && !syncEl.classList.contains('is-syncing') && !syncEl.classList.contains('is-deferred')) {
      txt.textContent = 'Tersinkron';
    }
    if (popStatus) popStatus.textContent = 'Sistem Tersinkron';
    syncEl.title = 'Sistem Tersinkron \u00B7 Data per: ' + dateStr + '. Klik untuk memeriksa pembaruan.';
  }
}

function _syncUpdateIndicator(state, detailText) {
  var el = document.getElementById('sync-indicator');
  if (!el) return;
  var txt = el.querySelector('.sync-indicator-text');
  var popStatus = el.querySelector('.sync-pop-status');

  el.classList.remove('is-syncing', 'is-deferred');

  if (state === 'syncing') {
    el.classList.add('is-syncing');
    if (txt) txt.textContent = 'Menyinkronkan\u2026';
    if (popStatus) popStatus.textContent = 'Memeriksa data ke server\u2026';
    el.title = 'Sedang memeriksa versi data ke server\u2026';
  } else if (state === 'deferred') {
    el.classList.add('is-deferred');
    if (txt) txt.textContent = 'Ada Pembaruan';
    if (popStatus) popStatus.textContent = 'Data Baru Tersedia di Server';
    el.title = 'Data baru tersedia di server. Ditunda selama formulir aktif.';
  } else {
    // synced
    if (txt) txt.textContent = 'Tersinkron';
    if (popStatus) popStatus.textContent = 'Sistem Tersinkron';
    _updateTelemetryTimestampUI();
  }
}

function _triggerManualSync() {
  if (APP_SYNC.inFlight) return;
  _runSyncTick(true);
}

/**
 * Form Modal Guard (Fase 15a):
 * Memeriksa apakah pengguna sedang mengisi formulir atau membuka modal data entry.
 * Jika aktif, silent reloader TIDAK BOLEH memuat ulang data tampilan agar input pengguna tidak terhapus/terinterupsi.
 */
function _isFormActive() {
  // 1. Cek overlay modal terbuka (.n-overlay yang tidak memiliki class .n-hidden)
  var openOverlays = document.querySelectorAll('.n-overlay:not(.n-hidden)');
  for (var i = 0; i < openOverlays.length; i++) {
    var ov = openOverlays[i];
    if (ov.id === 'dr-mask') continue; // abaikan backdrop drawer mask jika drawer tertutup
    var hasInputs = ov.querySelector('input, textarea, select');
    if (hasInputs) return true;
  }

  // 2. Cek apakah ada elemen input di halaman utama yang sedang aktif (focus)
  var ae = document.activeElement;
  if (ae && ae !== document.body && ae !== document.documentElement) {
    var tag = ae.tagName ? ae.tagName.toUpperCase() : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      // Kecualikan filter periode di header
      if (!ae.classList.contains('filter-sel') && !ae.classList.contains('filter-date')) {
        return true;
      }
    }
  }

  // 3. Cek apakah drawer persetujuan sedang terbuka dan ada input aktif
  var drawer = document.getElementById('approval-drawer');
  if (drawer && !drawer.classList.contains('n-hidden')) {
    var rejectArea = drawer.querySelector('textarea, input');
    if (rejectArea && rejectArea.value && rejectArea.value.trim().length > 0) {
      return true;
    }
  }

  return false;
}

/**
 * Pemeriksaan tertunda (Fase 15a):
 * Dipanggil sesaat setelah modal ditutup. Jika sebelumnya ada pembaruan data yang ditunda,
 * eksekusi pembaruan sekarang karena formulir sudah tertutup dengan aman.
 */
function _syncCheckDeferred() {
  setTimeout(function () {
    if (!APP_SYNC.deferredReload) return;
    if (_isFormActive()) return; // masih ada formulir lain yang terbuka
    APP_SYNC.deferredReload = false;
    _syncUpdateIndicator('syncing');
    _executeCurrentViewReloader();
    setTimeout(function () { _syncUpdateIndicator('synced'); }, 400);
  }, 120);
}

// ── NAVIGASI: section + items ─────────────────────────────
// divisiId: null = semua role; string = DIV-* untuk Kadiv/Staf
// minRoles: null = semua APPROVED; array = hanya role tsb
var NAV_SECTIONS = [
  {
    label: 'SUBBAG TATA USAHA',
    items: [
      { id: 'tata-usaha',    label: 'Tata Usaha',          divisiId: 'DIV-TU',     minRoles: null }
    ]
  },
  {
    label: 'SISTEM',
    items: [
      { id: 'kelola-akun', label: 'Admin Panel',      divisiId: null, minRoles: ['SUPERADMIN','DIREKTUR'] }
    ]
  }
];

// Apakah user bisa akses view ini?
function _canAccess(item, user) {
  if (!user) return false;
  if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') return true;
  if (item.minRoles && item.minRoles.indexOf(user.role) === -1) return false;
  if (item.divisiId && user.divisiId !== item.divisiId) return false;
  return true;
}

// Ambil item nav dari id
function _navItem(id) {
  for (var s = 0; s < NAV_SECTIONS.length; s++) {
    var items = NAV_SECTIONS[s].items;
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
  }
  return null;
}

// Judul halaman dari view ID
function _viewTitle(id) {
  var item = _navItem(id);
  return item ? item.label : '—';
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
  // Dekorasi tombol berlabel dengan ikon (satu peta global `_ICO_LABEL`).
  // Jalan di awal untuk markup statis views/*.html, lalu MutationObserver
  // menutupi semua render dinamis setelahnya.
  try { _icoDecorate(); _icoWatch(); } catch (e) { /* dekorasi tidak boleh halt app */ }

  // Overlay click-to-close: klik di luar .n-modal menutup popup,
  // dengan konfirmasi jika ada field yang sudah diisi.
  try { _initOverlayClose(); } catch (e) { /* tidak boleh halt app */ }
  try { _initSheetGestures(); } catch (e) { /* gesture fallback */ }

  // Fallback safety: jika dalam 15 detik callback tidak pernah dipanggil
  // (GAS RPC error, sandbox restriction, dsb), paksa sembunyikan loading.
  var _loadingTimedOut = false;
  var _loadingTimer = setTimeout(function () {
    _loadingTimedOut = true;
    _hideLoading();
    _showAuthView('login');
  }, 15000);

  function _doneLoading() {
    if (_loadingTimedOut) return;
    clearTimeout(_loadingTimer);
    _hideLoading();
  }

  // Prefill divisi list (dipakai di form register) — fire-and-forget
  try {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.data) return;
        var sel = document.getElementById('reg-divisi');
        if (!sel) return;
        res.data.forEach(function (d) {
          var opt = document.createElement('option');
          opt.value       = d.divisiId;
          opt.textContent = d.namaDashboard + ' \u2014 ' + d.namaResmi;
          sel.appendChild(opt);
        });
      })
      .withFailureHandler(function () { /* silent – tidak kritis */ })
      .auth_getDivisiList();
  } catch (e) { /* silent */ }

  // Cek sesi
  var savedToken = null;
  try { savedToken = sessionStorage.getItem(TOKEN_KEY) || sessionStorage.getItem('nautika_token'); } catch (e) { /* sandbox restriction */ }

  if (savedToken) {
    try {
      google.script.run
        .withSuccessHandler(function (res) {
          _doneLoading();
          if (res && res.success && res.data) {
            APP.token = savedToken;
            APP.user  = res.data;
            if (res.data.status === 'APPROVED') {
              _stopPendingStatusPolling();
              _initApp();
            } else {
              _renderPendingInfo(res.data);
              _showAuthView('pending');
              _startPendingStatusPolling(res.data);
            }
          } else {
            try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
            _showAuthView('login');
          }
        })
        .withFailureHandler(function () {
          _doneLoading();
          try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
          _showAuthView('login');
        })
        .auth_getSessionInfo(savedToken);
    } catch (e) {
      _doneLoading();
      _showAuthView('login');
    }
  } else {
    _doneLoading();
    // Cek apakah ada pendaftaran pending yang sedang dipantau di sesi ini
    var restoredPending = false;
    try {
      var rawPending = sessionStorage.getItem('SIKAP_PENDING_REG') || sessionStorage.getItem('NAUTIKA_PENDING_REG');
      if (rawPending) {
        var pData = JSON.parse(rawPending);
        if (pData && (pData.email || pData.userId)) {
          _renderPendingInfo(pData);
          _showAuthView('pending');
          _startPendingStatusPolling(pData);
          restoredPending = true;
        }
      }
    } catch (e) {}
    if (!restoredPending) {
      _showAuthView('login');
    }
  }
});

// ── AUTH HELPERS ──────────────────────────────────────────
function _hideLoading() {
  var el = document.getElementById('n-loading');
  if (el) { el.style.opacity = '0'; setTimeout(function(){ el.style.display='none'; }, 250); }
}

function _showAuthView(name) {
  document.getElementById('auth-wrapper').classList.remove('n-hidden');
  document.getElementById('app-wrapper').classList.add('n-hidden');
  ['login','register','pending'].forEach(function (v) {
    document.getElementById('v-' + v).classList.add('n-hidden');
  });
  document.getElementById('v-' + name).classList.remove('n-hidden');
}

function showAuthView(name) { _showAuthView(name); } // public alias for inline onclick

// State polling status pendaftaran (real-time tanpa refresh)
var _pendingPollTimer = null;
var _lastPendingPayload = null;
var _pendingAutoRedirectTimer = null;

function _clearPendingAutoRedirect() {
  if (_pendingAutoRedirectTimer) {
    clearInterval(_pendingAutoRedirectTimer);
    _pendingAutoRedirectTimer = null;
  }
}

function _clearPendingBanners() {
  _clearPendingAutoRedirect();
  var pHost = document.getElementById('pending-banner-host');
  if (pHost) pHost.innerHTML = '';
  var rHost = document.getElementById('register-banner-host');
  if (rHost) rHost.innerHTML = '';
}

function _startPendingStatusPolling(payload) {
  if (!payload || (!payload.email && !payload.userId)) return;
  _lastPendingPayload = payload;
  _stopPendingStatusPolling();

  function checkOnce() {
    if (!_lastPendingPayload) return;
    _silentRun(function () {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) {
            console.warn('[PendingPolling] Response kosong dari server.');
            return;
          }
          if (!res.success) {
            console.warn('[PendingPolling] Pemeriksaan status:', res.error);
            return;
          }
          if (!res.data) return;
          var st = String(res.data.status || '').trim().toUpperCase();
          if (st === 'APPROVED') {
            console.log('[PendingPolling] Akun telah disetujui (APPROVED). Memperbarui UI...');
            _stopPendingStatusPolling();
            _onRegistrationApproved(res.data);
          } else if (st === 'REJECTED') {
            console.log('[PendingPolling] Akun ditolak (REJECTED). Memperbarui UI...');
            _stopPendingStatusPolling();
            _onRegistrationRejected(res.data);
          }
        })
        .withFailureHandler(function (err) {
          console.error('[PendingPolling] Gagal menghubungi auth_checkRegistrationStatus:', err);
        })
        .auth_checkRegistrationStatus({
          email: _lastPendingPayload.email,
          userId: _lastPendingPayload.userId
        });
    });
  }

  // Cek segera + interval setiap 8 detik
  checkOnce();
  _pendingPollTimer = setInterval(checkOnce, 8000);
}

function _stopPendingStatusPolling() {
  if (_pendingPollTimer) {
    clearInterval(_pendingPollTimer);
    _pendingPollTimer = null;
  }
}

function _onRegistrationApproved(data) {
  var email = data.email || (_lastPendingPayload && _lastPendingPayload.email) || '';
  var nama  = data.nama  || (_lastPendingPayload && _lastPendingPayload.nama)  || 'Pengguna';

  try { sessionStorage.removeItem('SIKAP_PENDING_REG'); sessionStorage.removeItem('NAUTIKA_PENDING_REG'); } catch (e) {}

  var titleEl = document.querySelector('#v-pending .auth-title');
  if (titleEl) titleEl.textContent = 'Pendaftaran Disetujui';

  var staticInfoEl = document.querySelector('#v-pending .n-info-static');
  if (staticInfoEl) staticInfoEl.style.display = 'none';

  var pInfoEl = document.getElementById('pending-info');
  if (pInfoEl) {
    var warnBadge = pInfoEl.querySelector('.badge-warn');
    if (warnBadge) {
      warnBadge.className = 'badge badge-success';
      warnBadge.textContent = 'Disetujui & Aktif';
    }
  }

  var bannerHtml =
    '<div class="n-banner-approved" role="alert">' +
      '<div class="n-banner-approved-head">' +
        '<span class="n-banner-approved-icon">&#10003;</span>' +
        '<span>Akun Anda Berhasil Disetujui!</span>' +
      '</div>' +
      '<p class="n-banner-approved-text">' +
        'Pendaftaran akun atas nama <b>' + _esc(nama) + '</b> telah diterima dan disetujui oleh atasan/administrator. ' +
        'Akun Anda kini aktif. Silakan masuk untuk mengakses sistem SIKAP.' +
      '</p>' +
      '<div class="n-banner-approved-actions">' +
        '<button type="button" class="btn-primary" onclick="_pendingGoToLogin(\'' + _esc(email) + '\')">' +
          'Masuk ke Akun (Sign In)' +
        '</button>' +
      '</div>' +
    '</div>';

  var pHost = document.getElementById('pending-banner-host');
  if (pHost) pHost.innerHTML = bannerHtml;
  var rHost = document.getElementById('register-banner-host');
  if (rHost) rHost.innerHTML = bannerHtml;

  var timeLeft = 4;
  var liveEl = document.getElementById('pending-live-status');
  if (liveEl) {
    liveEl.innerHTML =
      '<span style="color:var(--n-status-success);font-weight:600;display:inline-flex;align-items:center;gap:6px;">' +
        '&#10003; Mengalihkan otomatis ke halaman masuk dalam <span id="pending-cd-sec">' + timeLeft + '</span> detik…' +
      '</span>';
  }

  _clearPendingAutoRedirect();
  _pendingAutoRedirectTimer = setInterval(function () {
    timeLeft--;
    var cdEl = document.getElementById('pending-cd-sec');
    if (cdEl) cdEl.textContent = String(timeLeft);
    if (timeLeft <= 0) {
      _clearPendingAutoRedirect();
      _pendingGoToLogin(email);
    }
  }, 1000);
}

function _onRegistrationRejected(data) {
  _clearPendingAutoRedirect();
  var email  = data.email || (_lastPendingPayload && _lastPendingPayload.email) || '';
  var alasan = data.alasanReject || 'Pendaftaran tidak memenuhi kriteria verifikasi.';

  try { sessionStorage.removeItem('SIKAP_PENDING_REG'); sessionStorage.removeItem('NAUTIKA_PENDING_REG'); } catch (e) {}

  var titleEl = document.querySelector('#v-pending .auth-title');
  if (titleEl) titleEl.textContent = 'Pendaftaran Ditolak';

  var staticInfoEl = document.querySelector('#v-pending .n-info-static');
  if (staticInfoEl) staticInfoEl.style.display = 'none';

  var pInfoEl = document.getElementById('pending-info');
  if (pInfoEl) {
    var warnBadge = pInfoEl.querySelector('.badge-warn');
    if (warnBadge) {
      warnBadge.className = 'badge badge-danger';
      warnBadge.textContent = 'Ditolak';
    }
  }

  var bannerHtml =
    '<div class="n-banner-rejected" role="alert">' +
      '<div class="n-banner-rejected-head">' +
        '<span>Pendaftaran Belum Disetujui</span>' +
      '</div>' +
      '<p class="n-banner-rejected-text">' +
        'Permintaan pendaftaran akun ditolak. Alasan: <b>' + _esc(alasan) + '</b>. ' +
        'Anda dapat melakukan pendaftaran ulang dengan data yang benar.' +
      '</p>' +
      '<div class="n-banner-approved-actions">' +
        '<button type="button" class="btn-primary" onclick="_pendingGoToRegister(\'' + _esc(email) + '\')">' +
          'Daftar Ulang' +
        '</button>' +
      '</div>' +
    '</div>';

  var pHost = document.getElementById('pending-banner-host');
  if (pHost) pHost.innerHTML = bannerHtml;
  var rHost = document.getElementById('register-banner-host');
  if (rHost) rHost.innerHTML = bannerHtml;

  var liveEl = document.getElementById('pending-live-status');
  if (liveEl) {
    liveEl.innerHTML = '<span style="color:var(--n-status-critical);font-weight:600;">Status: Pendaftaran Ditolak</span>';
  }
}

function _pendingGoToLogin(email) {
  _clearPendingAutoRedirect();
  _stopPendingStatusPolling();
  _showAuthView('login');
  var emailInput = document.getElementById('login-email');
  if (emailInput && email) {
    emailInput.value = email;
  }
  var pwdInput = document.getElementById('login-password');
  if (pwdInput) {
    pwdInput.value = '';
    pwdInput.focus();
  }
  _msg('login-msg', 'success', 'Akun Anda telah aktif. Masukkan password Anda untuk masuk.');
}

function _pendingGoToRegister(email) {
  _clearPendingAutoRedirect();
  _stopPendingStatusPolling();
  _showAuthView('register');
  _regResetOtp();
  var emailInput = document.getElementById('reg-email');
  if (emailInput && email) {
    emailInput.value = email;
  }
  _clearPendingBanners();
}

function _pendingCancelOrNew() {
  _clearPendingAutoRedirect();
  _stopPendingStatusPolling();
  _lastPendingPayload = null;
  try { sessionStorage.removeItem('SIKAP_PENDING_REG'); sessionStorage.removeItem('NAUTIKA_PENDING_REG'); } catch (e) {}
  _clearPendingBanners();
  _showAuthView('register');
  _regResetOtp();
}

function _renderPendingInfo(user) {
  _clearPendingAutoRedirect();
  var titleEl = document.querySelector('#v-pending .auth-title');
  if (titleEl) titleEl.textContent = 'Menunggu Persetujuan';
  var staticInfoEl = document.querySelector('#v-pending .n-info-static');
  if (staticInfoEl) staticInfoEl.style.display = '';

  var el = document.getElementById('pending-info');
  if (!el) return;
  el.innerHTML =
    '<div class="info-row"><span class="lbl">Nama</span><span class="val">' + _esc(user.nama) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Email</span><span class="val">' + _esc(user.email) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Jabatan Dilamar</span><span class="val">' + _esc(ROLE_LABEL[user.role] || user.role) + '</span></div>' +
    '<div class="info-row"><span class="lbl">Status</span>' +
      '<span class="val"><span class="badge badge-warn">Menunggu Persetujuan</span></span>' +
    '</div>';
  var liveEl = document.getElementById('pending-live-status');
  if (liveEl) {
    liveEl.innerHTML = '<span class="pending-pulse-dot"></span><span>Memeriksa status persetujuan secara otomatis…</span>';
  }
}

// ── AUTH HANDLERS ─────────────────────────────────────────
function handleLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-login');
  _setLoading(btn, true);
  _msg('login-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) { _msg('login-msg', 'error', (res && res.error) || 'Terjadi kesalahan. Coba lagi.'); return; }
      APP.token = res.data.token;
      APP.user  = res.data.user;
      sessionStorage.setItem(TOKEN_KEY, APP.token);
      if (res.data.user.status === 'APPROVED') {
        _stopPendingStatusPolling();
        _initApp();
      } else {
        _renderPendingInfo(res.data.user);
        _showAuthView('pending');
        _startPendingStatusPolling(res.data.user);
      }
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('login-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_login({
      email:    document.getElementById('login-email').value,
      password: document.getElementById('login-password').value
    });
}

// Tahap 1: kirim kode OTP ke email. Akun BELUM dibuat di tahap ini.
function handleRegister(e) {
  e.preventDefault();
  // Email sudah terbukti pada percobaan sebelumnya dan pendingToken-nya masih
  // hidup (server tidak mencabut token saat registrasi ditolak) — lewati tahap
  // OTP dan kirim ulang pendaftaran dengan token tersebut.
  var email = String(document.getElementById('reg-email').value || '').trim().toLowerCase();
  if (REG.pendingToken && REG.otpEmail === email) {
    _regSubmitRegister();
    return;
  }
  var btn = document.getElementById('btn-register');
  _setLoading(btn, true);
  _msg('register-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('register-msg', 'error', (res && res.error) || 'Terjadi kesalahan. Coba lagi.');
        return;
      }
      _regShowOtpStep(res.data.email);
      _msg('register-msg', 'success',
        'Kode verifikasi dikirim ke ' + res.data.email + '. Periksa kotak masuk (dan spam).');
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_requestOtp(_regPayload(document.getElementById('reg-email').value));
}

// Kumpulkan seluruh field registrasi. Server memvalidasi SEMUA field sebelum
// mengirim kode OTP — jadi kalau ada yang tidak valid, user tidak perlu
// menunggu email hanya untuk ditolak di akhir.
function _regPayload(email) {
  return {
    nama:        document.getElementById('reg-nama').value,
    email:       email,
    nip:         document.getElementById('reg-nip').value,
    password:    document.getElementById('reg-password').value,
    divisiId:    document.getElementById('reg-divisi').value,
    roleDilamar: document.getElementById('reg-role').value
  };
}

function _regShowOtpStep(email) {
  var step = document.getElementById('reg-otp-step');
  var form = document.getElementById('form-register');
  var hint = document.getElementById('reg-otp-hint');
  if (step) step.classList.remove('n-hidden');
  if (form) form.classList.add('n-hidden');
  if (hint) hint.textContent = 'Kode dikirim ke ' + email;
  var code = document.getElementById('reg-otp');
  if (code) { code.value = ''; code.focus(); }
  REG.otpEmail = email;
  REG.pendingToken = null;
}

// Kembali ke tahap 1.
//
// keepVerified = true dipakai setelah auth_register ditolak di tahap akhir
// (mis. NIP sudah dipakai). Server TIDAK membatalkan pendingToken saat
// registrasi gagal, jadi user cukup memperbaiki fieldnya lalu menekan
// "Verifikasi" lagi dengan kode yang sama — tanpa perlu email baru.
function _regResetOtp(keepVerified) {
  if (!keepVerified) {
    REG.otpEmail = null;
    REG.pendingToken = null;
  }
  var step = document.getElementById('reg-otp-step');
  var form = document.getElementById('form-register');
  if (step) step.classList.add('n-hidden');
  if (form) form.classList.remove('n-hidden');
  var code = document.getElementById('reg-otp');
  if (code) code.value = '';
  if (!keepVerified) _msg('register-msg', null);
  var btn = document.getElementById('btn-register');
  if (btn) btn.disabled = false;
}

function _regResendOtp() {
  if (!REG.otpEmail) { _regResetOtp(); return; }
  var btn = document.getElementById('btn-otp-resend');
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('register-msg', 'error', (res && res.error) || 'Gagal mengirim ulang kode.');
        return;
      }
      _msg('register-msg', 'success', 'Kode baru dikirim ke ' + res.data.email + '.');
      var code = document.getElementById('reg-otp');
      if (code) code.value = '';
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_requestOtp(_regPayload(REG.otpEmail));
}

// Tahap 2: cek kode → dapat pendingToken.
function _regVerifyOtp() {
  var code = String(document.getElementById('reg-otp').value || '').trim();
  if (!/^[0-9]{6}$/.test(code)) {
    _msg('register-msg', 'error', 'Masukkan 6 digit kode verifikasi.');
    return;
  }
  var btn = document.getElementById('btn-otp-verify');
  _setLoading(btn, true);
  _msg('register-msg', null);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('register-msg', 'error', (res && res.error) || 'Kode verifikasi gagal.');
        return;
      }
      REG.pendingToken = res.data.pendingToken;
      _regSubmitRegister();
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_verifyOtp({ email: REG.otpEmail, code: code });
}

// Tahap 3: kirim pendaftaran dengan bukti OTP.
function _regSubmitRegister() {
  // Tombol yang sedang terlihat: "Verifikasi" saat masih di step OTP, atau
  // "Daftar" saat user kembali ke form untuk memperbaiki data yang ditolak.
  var step = document.getElementById('reg-otp-step');
  var inOtp = step && !step.classList.contains('n-hidden');
  var btn = document.getElementById(inOtp ? 'btn-otp-verify' : 'btn-register');
  _setLoading(btn, true);

  var payload = {
    nama:         document.getElementById('reg-nama').value,
    email:        document.getElementById('reg-email').value,
    nip:          document.getElementById('reg-nip').value,
    password:     document.getElementById('reg-password').value,
    divisiId:     document.getElementById('reg-divisi').value,
    roleDilamar:  document.getElementById('reg-role').value,
    pendingToken: REG.pendingToken
  };

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        var err = (res && res.error) || 'Terjadi kesalahan. Coba lagi.';
        // Email masih terverifikasi — server menyimpan pendingToken (15 menit).
        // Kembalikan ke form supaya user bisa memperbaiki field yang bermasalah
        // tanpa menunggu email baru.
        var keep = /tidak cocok dengan email/i.test(err);
        _regResetOtp(keep);
        _msg('register-msg', 'error', err + (keep
          ? ''
          : ' Perbaiki data Anda lalu masukkan kode yang sama untuk melanjutkan.'));
        return;
      }
      var registeredUser = {
        userId:   (res.data && res.data.userId) || '',
        nama:     (res.data && res.data.nama) || payload.nama,
        email:    (res.data && res.data.email) || payload.email,
        nip:      payload.nip,
        role:     (res.data && res.data.role) || payload.roleDilamar,
        divisiId: (res.data && res.data.divisiId) || payload.divisiId
      };
      try {
        sessionStorage.setItem('SIKAP_PENDING_REG', JSON.stringify(registeredUser));
      } catch (e) {}

      document.getElementById('form-register').reset();
      _regResetOtp();
      _clearPendingBanners();
      _renderPendingInfo(registeredUser);
      _showAuthView('pending');
      _startPendingStatusPolling(registeredUser);
    })
    .withFailureHandler(function () {
      _setLoading(btn, false);
      _msg('register-msg', 'error', 'Terjadi kesalahan koneksi. Coba lagi.');
    })
    .auth_register(payload);
}

function handleLogout() {
  if (_appHeartbeatTimer) {
    clearInterval(_appHeartbeatTimer);
    _appHeartbeatTimer = null;
  }
  _stopPendingStatusPolling();
  if (APP.token) google.script.run.auth_logout(APP.token);
  APP.token = null;
  APP.user  = null;
  sessionStorage.removeItem(TOKEN_KEY);
  _showAuthView('login');
}

/**
 * Error handler bersama: kalau server menyatakan sesi tidak valid lagi
 * (logout paksa, akun dinonaktifkan/diubah Superadmin, TTL habis), paksa
 * keluar ke layar login dengan pesan yang bisa dimengerti user.
 * Dipakai oleh semua pemanggilan google.script.run di halaman Notifikasi,
 * shell status, dan Admin Panel.
 */
function _failOrLogout(err) {
  var msg = (err && err.message) ? err.message : String(err || '');
  if (/^UNAUTHORIZED/.test(msg)) {
    handleLogout();
    _msg('login-msg', 'error',
      'Sesi Anda berakhir atau akun diperbarui oleh Superadmin. Silakan login kembali.');
    return;
  }
  return msg || 'Gagal menghubungi server.';
}

/**
 * Jaring pengaman loader (Fase 13). Dua kegagalan yang tadinya muncul sebagai
 * "loading selamanya" tanpa pesan apa pun:
 *   1. Exception di dalam withSuccessHandler — google.script.run TIDAK
 *      meneruskannya ke withFailureHandler, jadi spinner tetap menggantung.
 *   2. Server tidak pernah menjawab (script belum di-push, versi deployed
 *      masih lama, atau hang) — tidak ada callback sama sekali.
 * _asyncArm menyalakan pengatur waktu; kalau loader selesai (sukses maupun
 * gagal) memanggil _asyncDisarm, jadi tidak ada perubahan perilaku normal.
 */
var _asyncTimeoutMs = 20000;
var _asyncTimers = {};

// UI kegagalan bersama: pesan + tombol coba lagi. Dipakai oleh timeout,
// respons kosong, dan handler lain supaya konsisten.
//
// "Coba lagi" dibuat ICON-ONLY (ikon refresh + `title`/`aria-label`): tombol
// ini selalu muncul di dalam pesan error yang teksnya sudah menjelaskan
// kegagalannya, jadi mengulang kata "Coba lagi" hanya memakan ruang tanpa
// menambah informasi.
function _asyncFailUi(wrap, msg, retryCall) {
  if (!wrap || !wrap.isConnected) return;
  wrap.innerHTML = '<div class="n-msg error">' + _esc(msg) + '</div>' +
    (retryCall ? '<div style="margin-top:8px"><button type="button" class="n-iconbtn-x" ' +
      'data-ico="refresh" title="Coba lagi" aria-label="Coba lagi" onclick="' +
      retryCall + '"></button></div>' : '');
}

function _asyncArm(key, wrap, retryCall) {
  _asyncDisarm(key);
  _asyncTimers[key] = setTimeout(function () {
    delete _asyncTimers[key];
    _asyncFailUi(wrap, 'Server tidak menjawab dalam ' +
      Math.round(_asyncTimeoutMs / 1000) + ' detik. Kemungkinan perubahan belum di-deploy, ' +
      'atau server sedang mengalami error.', retryCall);
  }, _asyncTimeoutMs);
}

function _asyncDisarm(key) {
  if (_asyncTimers[key]) { clearTimeout(_asyncTimers[key]); delete _asyncTimers[key]; }
}

/**
 * Normalisasi respons google.script.run.
 *
 * GAS memanggil success handler dengan `null` (bukan failure handler) bila
 * fungsi server selesai tanpa nilai balik, atau nilai balik tidak bisa
 * diserialisasi. Accessor `res.success` pada null melempar TypeError di dalam
 * callback, sehingga spinner menggantung dan tidak ada jejak errornya.
 *
 * @param {*} res respons dari success handler
 * @return {string|null} pesan error, atau null bila res sah
 */
function _asyncResErr(res) {
  if (!res) {
    return 'Server mengembalikan respons kosong. Fungsi server mungkin belum ' +
      'di-deploy (jalankan clasp push) atau melempar exception sebelum return.';
  }
  if (res.success) return null;
  return res.error || 'Permintaan ditolak server.';
}

// null-safe counterpart of _asyncRenderFail: untuk respons kosong/bermasalah.
function _asyncResFail(key, wrap, res, retryCall) {
  _asyncDisarm(key);
  if (window.console && console.error) {
    console.error('[sikap] respons tidak valid: ' + key, res);
  }
  _asyncFailUi(wrap, _asyncResErr(res), retryCall);
}

// Dipanggil dari catch di dalam success handler: tampilkan error, jangan spinner.
function _asyncRenderFail(key, wrap, e) {
  _asyncDisarm(key);
  if (window.console && console.error) console.error('[sikap] render gagal: ' + key, e);
  if (!wrap || !wrap.isConnected) return;
  wrap.innerHTML = '<div class="n-msg error">Gagal menampilkan data: ' +
    _esc(e && e.message ? e.message : String(e)) + '</div>';
}

// ── APP INIT & HASH ROUTING ──────────────────────────────
var _APP_INIT_DONE = false;

function _onHashChange() {
  var h = (window.location.hash || '').replace('#', '');
  if (!h || h === APP.currentView) {
    return;
  }
  if (h === 'bmn-penghapusan') {
    if (APP.currentView !== 'tata-usaha') _routeTo('tata-usaha');
    _tuSwitchTab('bmn');
    _bmnSelectSubTab('penghapusan');
  } else if (h === 'bmn') {
    if (APP.currentView !== 'tata-usaha') _routeTo('tata-usaha');
    _tuSwitchTab('bmn');
    _bmnSelectSubTab('aset');
  } else {
    _routeTo(h);
  }
}

function _initApp() {
  _hideLoading();
  document.getElementById('auth-wrapper').classList.add('n-hidden');
  document.getElementById('app-wrapper').classList.remove('n-hidden');
  _renderSidebar();
  var hash = (window.location.hash || '').replace('#', '') || 'tata-usaha';
  if (hash === 'bmn-penghapusan') {
    _routeTo('tata-usaha');
    _tuSwitchTab('bmn');
    _bmnSelectSubTab('penghapusan');
  } else if (hash === 'bmn') {
    _routeTo('tata-usaha');
    _tuSwitchTab('bmn');
    _bmnSelectSubTab('aset');
  } else {
    _routeTo(hash);
  }
  _startAppHeartbeat();
  setTimeout(function () {
    _runSyncTick(false); // inisialisasi versi live-sync server secara hening setelah tampilan utama selesai mount
  }, 2000);

  if (!_APP_INIT_DONE) {
    _APP_INIT_DONE = true;
    window.addEventListener('hashchange', _onHashChange);
  }
}

// ── SIDEBAR & TOPBAR NAVIGATION ───────────────────────────
function _sikapSelectModule(modName) {
  if (modName === 'admin') {
    _routeTo('kelola-akun');
    _sikapHighlightModule('admin');
  } else if (modName === 'penghapusan') {
    if (APP.currentView !== 'tata-usaha') {
      _routeTo('tata-usaha');
    }
    _tuSwitchTab('bmn');
    _bmnSelectSubTab('penghapusan');
  } else {
    if (APP.currentView !== 'tata-usaha') {
      _routeTo('tata-usaha');
    }
    _tuSwitchTab(modName);
    _sikapHighlightModule(modName);
  }
}

function _sikapHighlightModule(modName) {
  var target = (modName === 'penghapusan') ? 'bmn' : modName;
  var btns = document.querySelectorAll('.modulenav-btn');
  btns.forEach(function (b) {
    if (b.id === 'mod-nav-' + target) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });
}

function _renderSidebar() {
  var user = APP.user || {};
  // User trigger card & popover menu
  var nameEl = document.getElementById('sb-user-name');
  if (nameEl) nameEl.textContent = user.nama || 'Pengguna';
  var roleEl = document.getElementById('sb-user-role');
  if (roleEl) roleEl.textContent = ROLE_LABEL[user.role] || user.role || '—';

  var initialsEl = document.getElementById('user-avatar-initials');
  if (initialsEl) {
    var nm = (user.nama || 'TU').trim();
    var parts = nm.split(/\s+/);
    var ini = parts.length > 1 ? (parts[0][0] + parts[1][0]) : nm.substring(0, 2);
    initialsEl.textContent = ini.toUpperCase();
  }

  var menuName = document.getElementById('sb-menu-name');
  if (menuName) menuName.textContent = user.nama || 'Pengguna';
  var menuEmail = document.getElementById('sb-menu-email');
  if (menuEmail) menuEmail.textContent = user.email || '—';
  var menuRole = document.getElementById('sb-menu-role');
  if (menuRole) menuRole.textContent = ROLE_LABEL[user.role] || user.role || 'Pengguna';

  var adminItem = document.getElementById('sb-menu-admin-item');
  if (adminItem) {
    if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') {
      adminItem.classList.remove('n-hidden');
    } else {
      adminItem.classList.add('n-hidden');
    }
  }

  var modAdmin = document.getElementById('mod-nav-admin');
  if (modAdmin) {
    if (user.role === 'SUPERADMIN' || user.role === 'DIREKTUR') {
      modAdmin.classList.remove('n-hidden');
    } else {
      modAdmin.classList.add('n-hidden');
    }
  }

  // Compatibility Nav
  var nav = document.getElementById('sb-nav');
  if (nav) nav.innerHTML = '';
}

// ── USER ACCOUNT MENU (Drop-Up Popover) ───────────────────
function _toggleUserMenu(e) {
  if (e) e.stopPropagation();
  var menu = document.getElementById('sb-user-menu');
  var card = document.getElementById('sb-user-card');
  if (!menu || !card) return;

  var isOpen = !menu.classList.contains('n-hidden');
  if (isOpen) {
    _closeUserMenu();
  } else {
    menu.classList.remove('n-hidden');
    card.classList.add('is-active');
    setTimeout(function () {
      document.addEventListener('click', _userMenuOutsideClickHandler);
      document.addEventListener('keydown', _userMenuKeyHandler);
    }, 0);
  }
}

function _closeUserMenu() {
  var menu = document.getElementById('sb-user-menu');
  var card = document.getElementById('sb-user-card');
  if (menu) menu.classList.add('n-hidden');
  if (card) card.classList.remove('is-active');
  document.removeEventListener('click', _userMenuOutsideClickHandler);
  document.removeEventListener('keydown', _userMenuKeyHandler);
}

function _userMenuOutsideClickHandler(e) {
  var footer = document.getElementById('sb-footer');
  if (footer && !footer.contains(e.target)) {
    _closeUserMenu();
  }
}

function _userMenuKeyHandler(e) {
  if (e.key === 'Escape' || e.keyCode === 27) {
    _closeUserMenu();
  }
}

function _handleMenuNav(viewId) {
  _closeUserMenu();
  _routeTo(viewId);
}

function _updateActiveNav(viewId) {
  document.querySelectorAll('.nav-item').forEach(function (el) {
    el.classList.remove('active');
  });
  var active = document.getElementById('nav-' + viewId);
  if (active) active.classList.add('active');
}

// ── ROUTING ───────────────────────────────────────────────
function _routeTo(viewId) {
  var item = _navItem(viewId);
  // Jika view tidak ada atau tidak bisa diakses → ke tata-usaha
  if (!item || !_canAccess(item, APP.user)) {
    viewId = 'tata-usaha';
  }
  APP.currentView = viewId;
  if (window.location.hash !== '#' + viewId) {
    window.location.hash = viewId;
  }
  _updateActiveNav(viewId);
  _renderPageHeader(viewId);
  _renderViewContent(viewId);
  _applyShellStatus();
}

// ── PAGE HEADER & FILTER CONTROLS ─────────────────────────
function _renderPageHeader(viewId) {
  // filter tidak tampil di kelola-akun
  var noFilter = (viewId === 'kelola-akun');
  var filterHtml = noFilter ? '' : _buildFilterHtml();

  var filterWrap = document.getElementById('topbar-filter-periode');
  if (filterWrap) {
    filterWrap.innerHTML = filterHtml ? '<div class="filter-box">' + filterHtml + '</div><span id="filter-busy" class="filter-busy" title="Memuat data&hellip;"></span>' : '';
  }

  var ph = document.getElementById('page-header');
  if (ph) {
    ph.innerHTML = '';
  }

  _sikapHighlightModule(viewId === 'kelola-akun' ? 'admin' : (_TU.activeTab || 'anggaran'));
  _syncBusy();
  _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
  _updateTelemetryTimestampUI();
}

// ── FILTER PERIODE ────────────────────────────────────────
function _buildFilterHtml() {
  var f    = APP.filter;
  var now  = new Date();
  var year = now.getFullYear();

  // Year options: 3 tahun ke belakang s.d. tahun ini
  var yearOpts = '';
  for (var y = year; y >= year - 3; y--) {
    yearOpts += '<option value="' + y + '"' + (f.year === y ? ' selected' : '') + '>' + y + '</option>';
  }

  // Month options
  var monthOpts = MONTHS.map(function (m, i) {
    var val = i + 1;
    return '<option value="' + val + '"' + (f.month === val ? ' selected' : '') + '>' + m + '</option>';
  }).join('');

  var mode =
    '<div class="filter-mode">' +
      '<button type="button" class="filter-mode-btn' + (f.mode==='monthly'?' active':'') + '" onclick="_setFilterMode(\'monthly\')">Bulanan</button>' +
      '<button type="button" class="filter-mode-btn' + (f.mode==='range'  ?' active':'') + '" onclick="_setFilterMode(\'range\')">Rentang</button>' +
    '</div>';

  var monthlyInputs =
    '<div class="filter-inputs" id="filter-monthly" ' + (f.mode !== 'monthly' ? 'style="display:none"' : '') + '>' +
      '<select class="filter-sel" onchange="_setFilterMonth(this.value)">' + monthOpts + '</select>' +
      '<select class="filter-sel" onchange="_setFilterYear(this.value)">' + yearOpts + '</select>' +
    '</div>';

  var rangeInputs =
    '<div class="filter-inputs" id="filter-range" ' + (f.mode !== 'range' ? 'style="display:none"' : '') + '>' +
      '<input type="date" class="filter-date" value="' + (f.dateFrom||'') + '" onchange="_setFilterFrom(this.value)">' +
      '<span class="filter-sep">s.d.</span>' +
      '<input type="date" class="filter-date" value="' + (f.dateTo||'') + '"   onchange="_setFilterTo(this.value)">' +
    '</div>';

  return mode + '<div class="filter-mode-sep"></div>' + monthlyInputs + rangeInputs;
}

function _setFilterMode(mode) {
  APP.filter.mode = mode;
  var ml = document.getElementById('filter-monthly');
  var rl = document.getElementById('filter-range');
  if (ml) ml.style.display = (mode === 'monthly') ? '' : 'none';
  if (rl) rl.style.display = (mode === 'range')   ? '' : 'none';
  document.querySelectorAll('.filter-mode-btn').forEach(function(btn, i){
    btn.classList.toggle('active', (i===0 && mode==='monthly') || (i===1 && mode==='range'));
  });
  _reloadOnFilterChange();
}
function _setFilterMonth(v) { APP.filter.month    = parseInt(v, 10); _reloadOnFilterChange(); }
function _setFilterYear(v)  { APP.filter.year     = parseInt(v, 10); _reloadOnFilterChange(); }
function _setFilterFrom(v)  { APP.filter.dateFrom = v; _reloadOnFilterChange(); }
function _setFilterTo(v)    { APP.filter.dateTo   = v; _reloadOnFilterChange(); }

// Reload otomatis seluruh isi halaman saat filter global berubah (keputusan
// user Fase 12). Header/filter input TIDAK dibangun ulang — hanya konten.
function _reloadOnFilterChange() {
  if (APP.currentView) {
    _renderViewContent(APP.currentView);
  }
}

// ── VIEW CONTENT ──────────────────────────────────────────
function _renderViewContent(viewId) {
  if (typeof _chartTeardownAll === 'function') {
    try { _chartTeardownAll(); } catch (e) { /* ignore */ }
  }
  var el = document.getElementById('page-content');
  if (viewId === 'tata-usaha')  { _renderTataUsaha(el);   return; }
  if (viewId === 'kelola-akun') { _renderKelolaAkun(el); return; }
  _renderTataUsaha(el);
}

// ── APPROVAL MANAGEMENT ───────────────────────────────────
// Parametrik agar bisa dipakai pada halaman "Kelola Akun" dan
// panel geser kanan (banner KADIV/approver) tanpa duplikasi.
// id default: ka-* → halaman Kelola Akun; dr-* → drawer kanan.
var APPROVAL_WRAPS = [
  { wrapId: 'ka-approval-table-wrap', msgId: 'ka-approval-msg' },
  { wrapId: 'dr-approval-table-wrap', msgId: 'dr-approval-msg' }
];

function _appActiveWraps() {
  var out = [];
  for (var i = 0; i < APPROVAL_WRAPS.length; i++) {
    var w = APPROVAL_WRAPS[i];
    if (document.getElementById(w.wrapId)) out.push(w);
  }
  return out;
}

function _loadApprovals() {
  var act = _appActiveWraps();
  if (act.length === 0) return;
  for (var i = 0; i < act.length; i++) {
    var w = document.getElementById(act[i].wrapId);
    if (w) w.innerHTML = _tableSkeleton(4, 5);
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Gagal memuat data.'); return; }
      _renderApprovalTable(res.data);
    })
    .withFailureHandler(function () { _appMsg('error', 'Gagal memuat data.'); })
    .auth_getPendingApprovals(APP.token);
}

// Reload seluruh panel approval yang sedang tampil (halaman + drawer).
function _refreshApprovalPanels() { _loadApprovals(); }

function _appMsg(type, text) {
  var act = _appActiveWraps();
  if (act.length === 0) return;
  var el = document.getElementById(act[0].msgId);
  if (!el) return;
  el.className = 'n-msg ' + type + ' show';
  el.textContent = text;
}

function _renderApprovalTable(items) {
  var act = _appActiveWraps();
  if (act.length === 0) return;

  for (var w = 0; w < act.length; w++) {
    var wrap = document.getElementById(act[w].wrapId);
    if (!wrap) continue;

    if (!items || items.length === 0) {
      wrap.innerHTML = '<div style="color:var(--n-text-muted);font-size:.875rem;padding:8px 0;">Tidak ada permintaan yang menunggu persetujuan.</div>';
      continue;
    }

    var rows = items.map(function (it) {
      var d = it.registeredAt ? new Date(it.registeredAt).toLocaleDateString('id-ID') : '-';
      return '<tr>' +
        '<td>' + _esc(it.nama) +
          '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' + _esc(it.email) + '</span></td>' +
        '<td>' + _esc(it.namaDivisi || '-') + '</td>' +
        '<td>' + (it.roleDilamar === 'KADIV' ? 'Kepala Divisi / Ketua Tim Kerja' : 'Staf') + '</td>' +
        '<td>' + d + '</td>' +
        '<td><div class="ctl-row ctl-sm ctl-nowrap">' +
          '<button class="btn-primary" onclick="doApprove(\'' + _esc(it.queueId) + '\')">Setujui</button>' +
          '<button class="btn-danger"  onclick="openRejectModal(\'' + _esc(it.queueId) + '\')">Tolak</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');

    wrap.innerHTML =
      '<table class="n-table">' +
        '<thead><tr><th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Tgl Daftar</th><th>Tindakan</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }
}

function doApprove(queueId) {
  if (!confirm('Setujui registrasi ini?')) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Terjadi kesalahan.'); return; }
      _appMsg('success', 'Registrasi berhasil disetujui.');
      _loadApprovals();
      _applyShellStatus();
    })
    .withFailureHandler(function () { _appMsg('error', 'Terjadi kesalahan. Coba lagi.'); })
    .auth_decideApproval({ token: APP.token, queueId: queueId, approve: true, alasan: '' });
}

function openRejectModal(queueId) {
  APP.pendingQueueId = queueId;
  document.getElementById('reject-reason').value = '';
  openModal('modal-reject');
}
function closeRejectModal() {
  APP.pendingQueueId = null;
  document.getElementById('modal-reject').classList.add('n-hidden');
}

document.addEventListener('DOMContentLoaded', function () {
  var btnConfirm = document.getElementById('btn-confirm-reject');
  if (!btnConfirm) return;
  btnConfirm.addEventListener('click', function () {
    var alasan = document.getElementById('reject-reason').value.trim();
    if (!alasan) { alert('Alasan penolakan wajib diisi.'); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        closeRejectModal();
        if (!res || !res.success) { _appMsg('error', (res && res.error) || 'Terjadi kesalahan.'); return; }
        _appMsg('success', 'Registrasi berhasil ditolak.');
        _loadApprovals();
        _applyShellStatus();
      })
      .withFailureHandler(function () {
        closeRejectModal();
        _appMsg('error', 'Terjadi kesalahan. Coba lagi.');
      })
      .auth_decideApproval({ token: APP.token, queueId: APP.pendingQueueId, approve: false, alasan: alasan });
  });
});


// ── ADMIN PANEL — persetujuan + pengguna + audit log (Fase 13) ──
// Menu "Admin Panel" (SUPERADMIN/DIREKTUR). Tab Pengguna & Audit Log hanya
// ditampilkan untuk SUPERADMIN (server juga menolak non-SUPERADMIN).
// APP_mWraps() dipakai: ka-* di sini; dr-* di-drawer kanan.
var _ADN = { tab: 'persetujuan', users: [], audit: [], userFormId: null, divisi: [] };

function _renderKelolaAkun(el) {
  var tpl = document.getElementById('view-tpl-kelola-akun');
  if (!tpl) return;
  el.innerHTML = tpl.innerHTML;

  var isSA = (APP.user && APP.user.role === 'SUPERADMIN');
  var tabPengguna = document.getElementById('adn-tab-pengguna');
  var tabAudit = document.getElementById('adn-tab-audit');
  var tabReminder = document.getElementById('adn-tab-reminder');
  if (tabPengguna) {
    if (isSA) tabPengguna.removeAttribute('hidden'); else tabPengguna.setAttribute('hidden', '');
  }
  if (tabAudit) {
    if (isSA) tabAudit.removeAttribute('hidden'); else tabAudit.setAttribute('hidden', '');
  }
  if (tabReminder) {
    if (isSA) tabReminder.removeAttribute('hidden'); else tabReminder.setAttribute('hidden', '');
  }

  _ADN.tab = 'persetujuan';
  _ADN.users = [];
  _ADN.audit = [];
  _ADN.userFormId = null;
  _adnSyncTabs();
  _renderApprovalsInto('ka');
}

function _adnSyncTabs() {
  var tabs = document.querySelectorAll('#adn-tabs .n-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === _ADN.tab);
  }
  var panels = {
    persetujuan: 'adn-panel-persetujuan',
    pengguna: 'adn-panel-pengguna',
    audit: 'adn-panel-audit',
    reminder: 'adn-panel-reminder'
  };
  Object.keys(panels).forEach(function (k) {
    var el = document.getElementById(panels[k]);
    if (el) el.hidden = (k !== _ADN.tab);
  });
}

function _adnSwitch(tab) {
  // Guard client-side; server tetap menolak role non-SUPERADMIN (assertScope).
  if (tab !== 'persetujuan' && !(APP.user && APP.user.role === 'SUPERADMIN')) return;
  _ADN.tab = tab;
  _adnSyncTabs();
  if (tab === 'pengguna') { _adnLoadUsers(); _adnLoadDivisi(); }
  if (tab === 'audit') _adnLoadAudit();
  if (tab === 'reminder') _adnLoadReminder();
}

// ── TAB PENGGUNA ───────────────────────────────────────────
function _adnStatusBadge(st) {
  if (st === 'APPROVED') return '<span class="status-badge" style="background:#ecfdf5;color:#047857;">AKTIF</span>';
  if (st === 'PENDING')  return '<span class="status-badge" style="background:var(--n-primary-light);color:var(--n-primary);">MENUNGGU</span>';
  if (st === 'REJECTED') return '<span class="status-badge" style="background:#fee2e2;color:var(--n-status-critical);">DITOLAK</span>';
  if (st === 'NONAKTIF') return '<span class="status-badge" style="background:#f3f4f6;color:#374151;">NONAKTIF</span>';
  return _esc(st || '—');
}

function _adnLoadUsers() {
  var wrap = document.getElementById('adn-users-wrap');
  if (!wrap) return;
  wrap.innerHTML = _tableSkeleton(6, 6);
  _msg('adn-users-msg', null);
  _asyncArm('adn-users', wrap, '_adnLoadUsers()');

  google.script.run
    .withSuccessHandler(function (res) {
      _asyncDisarm('adn-users');
      if (_asyncResErr(res)) {
        _asyncResFail('adn-users', wrap, res, '_adnLoadUsers()');
        return;
      }
      try {
        _ADN.users = res.data || [];
        _adnRenderUsers();
      } catch (e) {
        _asyncRenderFail('adn-users', wrap, e);
      }
    })
    .withFailureHandler(function (err) {
      _asyncDisarm('adn-users');
      wrap.innerHTML = '<div class="n-msg error">' + _esc(_failOrLogout(err) || 'Koneksi terputus.') + '</div>';
    })
    .admin_getUsers(APP.token);
}

function _adnRenderUsers() {
  var wrap = document.getElementById('adn-users-wrap');
  if (!wrap) return;

  if (_ADN.users.length === 0) {
    wrap.innerHTML = '<div class="n-pad-muted">Belum ada pengguna.</div>';
    return;
  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Nama</th><th>Unit Kerja</th><th>Jabatan</th><th>Status</th><th>Tgl Daftar</th><th>Aksi</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < _ADN.users.length; i++) {
    var u = _ADN.users[i];
    var roleLabel = ROLE_LABEL[u.role] || u.role;
    var isSelf = (APP.user && String(APP.user.userId) === String(u.userId));
    t += '<tr>' +
      '<td>' + _esc(u.nama) +
        '<br><span style="font-size:.8rem;color:var(--n-text-muted);">' +
          _esc(u.nip ? 'NIP ' + u.nip + ' · ' : '') + _esc(u.email) + '</span></td>' +
      '<td>' + _esc(u.namaDivisi) + '</td>' +
      '<td>' + _esc(roleLabel) + '</td>' +
      '<td>' + _adnStatusBadge(u.status) + '</td>' +
      '<td>' + _esc(_adnFmtDate(u.registeredAt)) + '</td>' +
      '<td>' +
        (isSelf
          ? '<span style="font-size:.8rem;color:var(--n-text-muted);">Akun Anda</span>'
          : '<button class="btn-mini" onclick="_adnOpenEdit(\'' + _esc(u.userId) + '\')">Kelola</button>') +
      '</td></tr>';
  }

  t += '</tbody></table>';
  wrap.innerHTML = t;
}

function _adnFmtDate(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('id-ID');
}

function _adnLoadDivisi() {
  if (_ADN.divisi.length > 0) return;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res.success) {
        _ADN.divisi = res.data || [];
        // Form mungkin sudah dibuka sebelum daftar divisi tiba.
        if (_ADN.userFormId) _adnFillDivisi(_ADN.userFormId);
      }
    })
    .withFailureHandler(function () {})
    .auth_getDivisiList();
}

// Isi dropdown Unit Kerja; selected = UserID agar pilihan awal ikut ter-restore.
function _adnFillDivisi(selectedUserId) {
  var sel = document.getElementById('adn-f-divisi');
  if (!sel) return;
  var u = selectedUserId ? _adnFindUser(selectedUserId) : null;
  var current = u ? String(u.divisiId || '') : '';
  sel.innerHTML = '<option value="">— Lintas Divisi —</option>' + _ADN.divisi.map(function (d) {
    return '<option value="' + _esc(d.divisiId) + '"' + (d.divisiId === current ? ' selected' : '') + '>' +
      _esc(d.namaDashboard) + '</option>';
  }).join('');
  if (!_ADN.divisi.length) {
    sel.innerHTML = '<option value="">Memuat unit kerja…</option>';
  }
}

// ── FORM KELOLA AKUN (modal) ───────────────────────────────
function _adnFindUser(userId) {
  for (var i = 0; i < _ADN.users.length; i++) {
    if (String(_ADN.users[i].userId) === String(userId)) return _ADN.users[i];
  }
  return null;
}

function _adnOpenEdit(userId) {
  var u = _adnFindUser(userId);
  if (!u) return;
  _ADN.userFormId = userId;

  var roleOpts = ['SUPERADMIN', 'DIREKTUR', 'KADIV', 'STAF'].map(function (r) {
    return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + _esc(ROLE_LABEL[r] || r) + '</option>';
  }).join('');

  var statusOpts = ['APPROVED', 'REJECTED', 'NONAKTIF'].map(function (s) {
    var label = s === 'APPROVED' ? 'Aktif' : (s === 'REJECTED' ? 'Ditolak' : 'Nonaktif');
    return '<option value="' + s + '"' + (s === u.status ? ' selected' : '') + '>' + label + '</option>';
  }).join('');

  document.getElementById('adn-form-title').textContent = 'Kelola Akun — ' + u.nama;
  document.getElementById('adn-f-nama').textContent = u.nama;
  document.getElementById('adn-f-email').textContent = u.email;
  document.getElementById('adn-f-role').innerHTML = roleOpts;
  document.getElementById('adn-f-status').innerHTML = statusOpts;
  document.getElementById('adn-f-password').value = '';
  _msg('adn-form-msg', null);
  // Dropdown unit kerja butuh daftar divisi; kalau belum tiba, placeholder dulu.
  _adnFillDivisi(userId);
  _adnLoadDivisi();
  openModal('modal-admin-user');
  _adnOnRoleChange();
}

function _adnOnRoleChange() {
  var role = document.getElementById('adn-f-role').value;
  var divisi = document.getElementById('adn-f-divisi');
  if (role === 'SUPERADMIN' || role === 'DIREKTUR') {
    divisi.value = '';
    divisi.disabled = true;
  } else {
    divisi.disabled = false;
  }
}

function _adnCloseForm() {
  document.getElementById('modal-admin-user').classList.add('n-hidden');
  _ADN.userFormId = null;
}

function _adnSaveUser() {
  var userId = _ADN.userFormId;
  if (!userId) return;
  var params = {
    userId:   userId,
    role:     document.getElementById('adn-f-role').value,
    divisiId: document.getElementById('adn-f-divisi').value,
    status:   document.getElementById('adn-f-status').value
  };

  var btn = document.getElementById('btn-adn-save');
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('adn-form-msg', 'error', res.error); return; }
      _adnCloseForm();
      _msg('adn-users-msg', 'success', (res.data.changes || []).join('; ') || 'Tidak ada perubahan.');
      _adnLoadUsers();
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg('adn-form-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
    })
    .admin_updateUser(APP.token, params);
}

function _adnResetPassword() {
  var userId = _ADN.userFormId;
  if (!userId) return;
  var pass = document.getElementById('adn-f-password').value;
  if (pass.length < 8) { _msg('adn-form-msg', 'error', 'Password minimal 8 karakter.'); return; }
  if (!confirm('Setel ulang password akun ini? Password lama tidak berlaku lagi.')) return;

  var btn = document.getElementById('btn-adn-reset');
  _setLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res.success) { _msg('adn-form-msg', 'error', res.error); return; }
      document.getElementById('adn-f-password').value = '';
      _msg('adn-form-msg', 'success', 'Password berhasil disetel ulang. Sampaikan password baru ke pengguna secara aman.');
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg('adn-form-msg', 'error', _failOrLogout(err) || 'Terjadi kesalahan. Coba lagi.');
    })
    .admin_resetPassword(APP.token, { userId: userId, newPassword: pass });
}

// ── TAB AUDIT LOG ──────────────────────────────────────────
function _adnLoadAudit() {
  var wrap = document.getElementById('adn-audit-wrap');
  if (!wrap) return;
  wrap.innerHTML = _tableSkeleton(6, 5);
  _msg('adn-audit-msg', null);
  _asyncArm('adn-audit', wrap, '_adnReloadAudit()');

  google.script.run
    .withSuccessHandler(function (res) {
      _asyncDisarm('adn-audit');
      if (_asyncResErr(res)) {
        _asyncResFail('adn-audit', wrap, res, '_adnReloadAudit()');
        return;
      }
      try {
        _ADN.audit = res.data || [];
        _adnRenderAudit();
      } catch (e) {
        _asyncRenderFail('adn-audit', wrap, e);
      }
    })
    .withFailureHandler(function (err) {
      _asyncDisarm('adn-audit');
      wrap.innerHTML = '<div class="n-msg error">' + _esc(_failOrLogout(err) || 'Koneksi terputus.') + '</div>';
    })
    .admin_getAuditLog(APP.token, { limit: 300 });
}

function _adnReloadAudit() { _ADN.audit = []; _adnLoadAudit(); }

function _adnRenderAudit() {
  var wrap = document.getElementById('adn-audit-wrap');
  if (!wrap) return;

  if (_ADN.audit.length === 0) {
    wrap.innerHTML = '<div class="n-pad-muted">Belum ada jejak audit.</div>';
    return;
  }

  var t = '<table class="n-table n-table-full"><thead><tr>' +
    '<th>Waktu</th><th>Pelaku</th><th>Aksi</th><th>Target</th><th>Keterangan</th>' +
    '</tr></thead><tbody>';

  for (var i = 0; i < _ADN.audit.length; i++) {
    var r = _ADN.audit[i];
    t += '<tr>' +

// ── APP HEARTBEAT & LIVE-SYNC ENGINE (Fase 15a & 15b) ──────
var _appHeartbeatTimer = null;
var _lastHeartbeatTick = 0;

/**
 * Registry Silent Reloader Modular (Fase 15b):
 * Memetakan setiap modul/view ke fungsi pembaruan datanya masing-masing
 * tanpa me-rebuild DOM utama atau mereset posisi scroll & state sub-tab.
 */
var _SYNC_RELOADERS = {
  'tata-usaha': function () {
    var tab = (_TU && _TU.activeTab) || 'anggaran';
    if (tab === 'anggaran') {
      if (typeof _tuLoadKPI === 'function') _tuLoadKPI(true);
    } else if (tab === 'paket') {
      if (typeof _tuLoadPaket === 'function') _tuLoadPaket(true);
    } else if (tab === 'pegawai') {
      if (typeof _tuLoadPegawai === 'function') _tuLoadPegawai(true);
      if (typeof _tuLoadKompetensi === 'function') _tuLoadKompetensi(true);
    } else if (tab === 'bmn') {
      if (typeof _tuLoadBMN === 'function') _tuLoadBMN(true);
    }
  },

  'kelola-akun': function () {
    _adnReloadActiveTab();
  }
};

function _adnReloadActiveTab() {
  if (typeof _ADN === 'undefined') return;
  if (_ADN.tab === 'persetujuan') {
    if (typeof _renderApprovalsInto === 'function') {
      _renderApprovalsInto('ka');
    } else if (typeof _loadApprovals === 'function') {
      _loadApprovals();
    }
  } else if (_ADN.tab === 'pengguna') {
    if (typeof _adnLoadUsers === 'function') _adnLoadUsers();
  } else if (_ADN.tab === 'audit') {
    if (typeof _adnLoadAudit === 'function') _adnLoadAudit();
  } else if (_ADN.tab === 'reminder') {
    if (typeof _adnLoadReminder === 'function') _adnLoadReminder();
  }
}

/**
 * Dispatcher pembaruan modular (Fase 15b):
 * Memanggil silent reloader spesifik modul aktif dengan preservasi scroll window & table.
 */
function _dispatchModuleSilentReloader(viewId) {
  var reloader = _SYNC_RELOADERS[viewId];
  if (typeof reloader !== 'function') return;

  // Preservasi scroll window dan kontainer tabel
  var scrollPos = (typeof window !== 'undefined') ? (window.pageYOffset || document.documentElement.scrollTop || 0) : 0;
  var tableWraps = document.querySelectorAll('.n-table-wrap, .n-table-container, .table-responsive');
  var wrapScrolls = [];
  tableWraps.forEach(function (el) {
    wrapScrolls.push({ el: el, top: el.scrollTop, left: el.scrollLeft });
  });

  try {
    reloader();
  } catch (e) {
    if (window.console && console.warn) {
      console.warn('[LiveSync] Silent reload view "' + viewId + '" error:', e);
    }
  }

  // Restore scroll positions setelah render update selesai
  setTimeout(function () {
    if (typeof window !== 'undefined' && scrollPos > 0) {
      window.scrollTo({ top: scrollPos, behavior: 'instant' });
    }
    wrapScrolls.forEach(function (ws) {
      if (ws.el && ws.el.isConnected) {
        ws.el.scrollTop = ws.top;
        ws.el.scrollLeft = ws.left;
      }
    });
  }, 120);
}

/**
 * Dispatcher silent reload untuk tampilan yang sedang aktif.
 * Dipanggil ketika ada pembaruan versi transaksi dari server (DASH_TX_VERSION)
 * dan dipastikan tidak ada modal formulir yang sedang aktif.
 */
function _executeCurrentViewReloader() {
  if (!APP.token || !APP.user) return;
  var view = APP.currentView;

  _silentRun(function () {
    // 1. Selalu perbarui status badge & reminder bar shell
    _applyShellStatus();

    // 2. Eksekusi silent reload melalui registry modular
    _dispatchModuleSilentReloader(view);
  });
}

function _runHeartbeatTick() {
  _runSyncTick(false);
}

/**
 * Eksekutor heartbeat utama (Fase 15a):
 * Mengirim permintaan ringan ke endpoint backend app_getSyncState (RAM zero-sheet-read, <50ms).
 * Mendeteksi perubahan versi transaksi, unread notifikasi, dan antrean approval.
 */
var _syncInFlightTimer = null;
function _runSyncTick(force) {
  if (!APP.token || !APP.user) return;
  var now = Date.now();
  if (!force && (now - _lastHeartbeatTick < 10000)) return; // tenggang minimum 10 detik antar tick
  if (APP_SYNC.inFlight) return;

  _lastHeartbeatTick = now;
  APP_SYNC.inFlight = true;

  if (force) {
    _syncUpdateIndicator('syncing');
  }

  // Jaring pengaman watchdog: cegah status "Menyinkronkan..." nyangkut permanen jika RPC tertahan di GAS
  if (_syncInFlightTimer) clearTimeout(_syncInFlightTimer);
  _syncInFlightTimer = setTimeout(function () {
    if (APP_SYNC.inFlight) {
      APP_SYNC.inFlight = false;
      _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
    }
  }, 12000);

  _silentRun(function () {
    google.script.run
      .withSuccessHandler(function (res) {
        if (_syncInFlightTimer) { clearTimeout(_syncInFlightTimer); _syncInFlightTimer = null; }
        APP_SYNC.inFlight = false;
        if (!res || !res.success) {
          _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
          return;
        }

        APP_SYNC.lastSyncTime = Date.now();
        var d = res.data || {};

        // 0. Update telemetri waktu transaksi terakhir (Fase 17)
        if (d.lastTxMetadata !== undefined) {
          APP_SYNC.lastTxMetadata = d.lastTxMetadata;
          _updateTelemetryTimestampUI();
        }

        // 1. Update badge notifikasi jika data unread tersedia
        if (typeof d.unreadNotif === 'number') {
          _renderNotifBadge(d.unreadNotif);
        }

        // 2. Update antrean approval (jika role approver)
        if (typeof d.queueCount === 'number') {
          var isApprover = (APP.user.role === 'SUPERADMIN' || APP.user.role === 'DIREKTUR' || APP.user.role === 'KADIV');
          if (isApprover) {
            var banner = document.getElementById('dr-banner');
            var bannerCount = document.getElementById('dr-banner-count');
            if (banner && bannerCount) {
              bannerCount.textContent = String(d.queueCount);
              if (d.queueCount > 0) banner.classList.remove('n-hidden');
              else banner.classList.add('n-hidden');
            }
            var drawer = document.getElementById('approval-drawer');
            var drawerOpen = drawer && !drawer.classList.contains('n-hidden');
            if (drawerOpen || APP.currentView === 'kelola-akun') {
              if (typeof _refreshApprovalPanels === 'function') {
                _refreshApprovalPanels();
              }
            }
          }
        }

        // 3. Deteksi perubahan versi transaksi global (txVersion)
        var serverTx = (d.txVersion !== undefined && d.txVersion !== null) ? String(d.txVersion) : '';
        if (serverTx) {
          if (APP_SYNC.lastTxVersion === null) {
            // Inisialisasi awal saat login/pertama kali load
            APP_SYNC.lastTxVersion = serverTx;
            _syncUpdateIndicator('synced');
          } else if (serverTx !== APP_SYNC.lastTxVersion) {
            // Terjadi transaksi baru di server (tambah/edit/anulir)
            APP_SYNC.lastTxVersion = serverTx;
            if (_isFormActive()) {
              // Pengguna sedang membuka modal formulir: TUNDA reload demi keamanan data input
              APP_SYNC.deferredReload = true;
              _syncUpdateIndicator('deferred');
            } else {
              // Tidak ada formulir aktif: langsung lakukan silent reload tanpa refresh halaman
              APP_SYNC.deferredReload = false;
              _syncUpdateIndicator('syncing');
              _executeCurrentViewReloader();
              setTimeout(function () { _syncUpdateIndicator('synced'); }, 400);
            }
          } else {
            // Versi transaksi server sama dengan lokal
            if (APP_SYNC.deferredReload && !_isFormActive()) {
              APP_SYNC.deferredReload = false;
              _syncUpdateIndicator('syncing');
              _executeCurrentViewReloader();
              setTimeout(function () { _syncUpdateIndicator('synced'); }, 400);
            } else if (APP_SYNC.deferredReload) {
              _syncUpdateIndicator('deferred');
            } else {
              _syncUpdateIndicator('synced');
            }
          }
        } else {
          _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
        }
      })
      .withFailureHandler(function (err) {
        if (_syncInFlightTimer) { clearTimeout(_syncInFlightTimer); _syncInFlightTimer = null; }
        APP_SYNC.inFlight = false;
        _failOrLogout(err);
        _syncUpdateIndicator(APP_SYNC.deferredReload ? 'deferred' : 'synced');
      })
      .app_getSyncState(APP.token);
  });
}

function _startAppHeartbeat() {
  if (_appHeartbeatTimer) clearInterval(_appHeartbeatTimer);
  _appHeartbeatTimer = setInterval(function () {
    var isVisible = (typeof document !== 'undefined' && document.visibilityState)
      ? (document.visibilityState === 'visible')
      : true;
    if (isVisible) {
      _runHeartbeatTick();
    }
  }, APP_SYNC.syncInterval || 35000);
}

if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (APP.token) {
        _runHeartbeatTick();
      } else if (_lastPendingPayload) {
        _startPendingStatusPolling(_lastPendingPayload);
      }
    }
  });
}

if (typeof window !== 'undefined') {
  window.addEventListener('focus', function () {
    if (APP.token) {
      _runHeartbeatTick();
    } else if (_lastPendingPayload) {
      _startPendingStatusPolling(_lastPendingPayload);
    }
  });
}

function _esc(str) {

    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function _rupiah(angka) {
  if (angka === null || angka === undefined) return 'Rp —';
  var n = parseFloat(angka) || 0;
  var prefix = n < 0 ? '-Rp ' : 'Rp ';
  return prefix + Math.abs(Math.round(n)).toLocaleString('id-ID');
}

function _opsInitPeriodeUi(prefix) {
  prefix = prefix || 'tu-';
  var now = new Date();
  var ySel = document.getElementById(prefix + 'periode-tahun');
  var mSel = document.getElementById(prefix + 'periode-bulan');
  var wSel = document.getElementById(prefix + 'periode-minggu');
  if (!ySel || !mSel || !wSel) return;

  var tahunOpts = '';
  for (var y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
    tahunOpts += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>';
  }
  ySel.innerHTML = tahunOpts;

  var bulanOpts = MONTHS.map(function (m, i) {
    return '<option value="' + (i + 1) + '"' + ((i + 1) === (now.getMonth() + 1) ? ' selected' : '') + '>' + m + '</option>';
  }).join('');
  mSel.innerHTML = bulanOpts;

  var mingguKe = Math.min(Math.ceil(now.getDate() / 7), 5);
  var mingguOpts = '';
  for (var w = 1; w <= 5; w++) {
    mingguOpts += '<option value="' + w + '"' + (w === mingguKe ? ' selected' : '') + '>Ke-' + w + '</option>';
  }
  wSel.innerHTML = mingguOpts;
}
var _initPeriodeUi = _opsInitPeriodeUi;

function _composePeriode(prefix) {
  prefix = prefix || 'tu-';
  var y = _v(prefix + 'periode-tahun');
  var m = _v(prefix + 'periode-bulan');
  var w = _v(prefix + 'periode-minggu');
  if (!y || !m || !w) return '';
  m = (parseInt(m, 10) < 10 ? '0' : '') + parseInt(m, 10);
  w = 'W0' + parseInt(w, 10);
  return y + '-' + m + '-' + w;
}

    list = list.concat(Array.prototype.slice.call(scope.querySelectorAll(_ICO_SEL)));
  } else {
    list = Array.prototype.slice.call(document.querySelectorAll(_ICO_SEL));
  }
  for (var i = 0; i < list.length; i++) {
    var el = list[i];
    if (el.querySelector('svg.ico')) continue;
    var cls = ' ' + String(el.className || '') + ' ';
    if (cls.indexOf(' n-iconbtn ') !== -1 || cls.indexOf(' n-iconbtn-sm ') !== -1 ||
        cls.indexOf(' n-chip-x ') !== -1 || cls.indexOf(' n-has-ico ') !== -1 ||
        cls.indexOf(' n-tab ') !== -1) continue;
    // Icon-only: markup statis tidak bisa memanggil `_ico()` (Script_Main
    // dimuat setelah markup), jadi tombol mendeklarasikan ikon lewat
    // `data-ico="<nama>"`. Tombol ini WAJIB sudah punya `title` +
    // `aria-label` — ikon saja tidak boleh jadi satu-satunya makna.
    var named = el.getAttribute && el.getAttribute('data-ico');
    if (named) {
      var ico = _ico(named, el.getAttribute('data-ico-size') || 16);
      if (!ico) continue;
      el.insertAdjacentHTML('afterbegin', ico);
      continue;

    el.insertAdjacentHTML('afterbegin', _ico(name, 16));
