  show.warning = function (title, opts) {
    opts = opts || {};
    opts.type = 'warning';
    return _spawn(title, opts);
  };

  show.info = function (title, opts) {
    opts = opts || {};
    opts.type = 'info';
    return _spawn(title, opts);
  };

  show.loading = function (title, opts) {
    opts = opts || {};
    opts.type = 'loading';
    opts.duration = Infinity;
    return _spawn(title, opts);
  };

  show.promise = function (promise, msgs) {
    msgs = msgs || {};
    var id = show.loading(msgs.loading || 'Memproses\u2026');
    if (promise && typeof promise.then === 'function') {
      promise.then(function (res) {
        var s = typeof msgs.success === 'function' ? msgs.success(res) : (msgs.success || 'Selesai');
        show.success(s, { id: id });
        return res;
      }).catch(function (err) {
        var e = typeof msgs.error === 'function' ? msgs.error(err) : (msgs.error || (err && err.message) || 'Terjadi kesalahan');
        show.error(e, { id: id });
        throw err;
      });
    }
    return id;
  };

  show.dismiss = dismiss;

  show.getActiveToasts = function () {
    return _toasts.slice();
  };

  return show;
})();

if (typeof window !== 'undefined') {
  window.toast = toast;
}

function _msg(id, type, text) {
  var el = document.getElementById(id);
  if (el) {
    if (!type) {
      el.className = 'n-msg';
      el.textContent = '';
      el.style.display = 'none';
    } else {
      el.className = 'n-msg ' + type + ' show active';
      el.textContent = text;
      el.style.display = 'block';
      try {
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } catch (_) {}
    }
  }

  // Khusus form BMN: sinkronisasi notifikasi ke banner inline geotagging di Seksi 4
  if (id === 'bmn-form-msg') {
    var inlineEl = document.getElementById('bmn-geotag-inline-msg');
    if (inlineEl) {
      if (!type) {
        inlineEl.className = 'n-msg';
        inlineEl.textContent = '';
        inlineEl.style.display = 'none';
      } else {
        inlineEl.className = 'n-msg ' + type + ' show active';
        inlineEl.textContent = text;
        inlineEl.style.display = 'block';
      }
    }
  }

  // Elevated floating Sonner toast (ask-sonner / emil-design-eng)
  if (type && text && typeof toast !== 'undefined') {
    var t = String(type).toLowerCase();
    if (t === 'ok' || t === 'success') {
      toast.success(text);
    } else if (t === 'err' || t === 'error') {
      toast.error(text);
    } else if (t === 'warn' || t === 'warning') {
      toast.warning(text);
    } else if (t === 'info' || t === 'loading') {
      toast.info(text);
    }
  }
}

function _setLoading(btn, loading) {
  btn.disabled = loading;
  if (loading) {
    btn._orig = btn.innerHTML;
    btn.innerHTML = '<span class="n-spin-sm"></span>Memproses\u2026';
  } else {
    btn.innerHTML = btn._orig || btn.textContent;
  }
  // Kalau tombol ini berada di dalam popup form, tampilkan overlay loading
  // besar di area form supaya proses simpan jauh lebih terlihat (bukan hanya
  // teks "Memproses…" di tombol).
  var ov = btn.closest ? btn.closest('.n-overlay') : null;
  if (ov && ov.id) _formLoadingOverlay(ov.id, loading, 'Menyimpan\u2026');
}

// ── STATE SUKSES DI DALAM MODAL FORM ───────────────────────
// Saat submit berhasil, isi modal popup tidak langsung hilang kosong: diganti
// panel "Berhasil" sebentar, baru ditutup otomatis. Markup modal asli disimpan
// di _FORM_SUCCESS supaya bisa dipulihkan saat form dibuka lagi.
var _FORM_SUCCESS = {};

function _formRestore(modalId) {
  var rec = _FORM_SUCCESS[modalId];
  if (!rec) return false;
  // Batalkan timer auto-close: kalau modal ditutup lebih awal dan langsung
  // dibuka lagi, timer lama tidak boleh menutup form yang sedang dipakai.
  if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
  rec.modal.innerHTML = rec.origHTML;
  delete _FORM_SUCCESS[modalId];
  return true;
}

// Menutup overlay loading (dipakai juga oleh _setLoading).
function _formLoadingOverlay(modalId, on, text) {
  if (!modalId) return;
  var ov = document.getElementById(modalId);
  if (!ov) return;
  // Fallback ke .n-modal untuk popup yang tidak memakai area scroll form
  // (mis. Master Data, Kegiatan) — keduanya punya position:relative.
  var scroll = ov.querySelector('.n-modal-form-scroll') || ov.querySelector('.n-modal');
  if (!scroll) return;
  var el = scroll.querySelector('.form-loading-overlay');
  if (!on) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  if (!el) {
    el = document.createElement('div');
    el.className = 'form-loading-overlay';
    scroll.appendChild(el);
  }
  el.innerHTML = '<span class="n-spin-lg"></span>' +
                 '<span class="loading-text">' + _esc(text || 'Menyimpan\u2026') + '</span>';
  el.classList.add('show');
}

// Tampilkan panel "Berhasil" di dalam modal form. `sub` = kalimat konfirmasi,
// `onClose` = aksi setelah panel ditutup (umumnya reload KPI + riwayat).
function _formShowSuccess(modalId, sub, onClose, delay) {
  var ov = document.getElementById(modalId);
  var modal = ov && ov.querySelector('.n-modal');
  if (!modal) {
    // Fallback: tetap jalankan aksi lanjutan supaya alur tidak macet.
    if (onClose) onClose();
    return;
  }
  var titleEl = modal.querySelector('h2');
  var titleHTML = titleEl ? titleEl.outerHTML : '';

  var msIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    '<path d="M4.5 12.5l5 5 10-11"/></svg>';

  var rec = _FORM_SUCCESS[modalId];
  if (!rec) {
    rec = { modal: modal, origHTML: modal.innerHTML };
    _FORM_SUCCESS[modalId] = rec;
  }
  rec.close = onClose || null;

  modal.innerHTML =
    titleHTML +
    '<div class="modal-success" role="status" aria-live="polite">' +
      '<div class="ms-icon" aria-hidden="true">' + msIcon + '</div>' +
      '<div class="ms-title">Berhasil</div>' +
      '<div class="ms-sub">' + _esc(sub || 'Laporan berhasil disimpan.') + '</div>' +
      '<div class="ms-auto">Menutup otomatis\u2026</div>' +
    '</div>';

  if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
  rec.timer = setTimeout(function () {
    var fn = (rec && rec.close) || null;
    _formRestore(modalId);
    closeModal(modalId);
    if (fn) fn();
  }, delay || 650);
}

// Titik masuk tunggal untuk 14 form laporan: dipanggil dari callback
// `_attachUploadAll`. Upload gagal (ok === false) tidak menampilkan panel
// sukses — perilaku lama (tutup modal + reload) dipertahankan.
function _formSubmitDone(modalId, sub, onClose, ok) {
  // Berhenti di "Mengunggah…" — baik sukses maupun gagal, overlay sudah tidak
  // relevan karena isi modal akan diganti panel sukses atau langsung ditutup.
  _formLoadingOverlay(modalId, false);
  if (ok === false) {
    closeModal(modalId);
    if (onClose) onClose();
    return;
  }
  _formShowSuccess(modalId, sub, onClose);
}

// Peta key lampiran → id modal form, supaya overlay loading ikut berlanjut
// selama tahap unggah (bukan hanya saat simpan ke server).
var _ATTACH_MODAL = {
  tu: 'modal-tu-form',
  'tu-pagu': 'modal-tu-pagu',
  'tu-revisi': 'modal-tu-revisi',
  opslaut: 'modal-ops-laut-form',
  opsudara: 'modal-ops-udara-form',
  intel: 'modal-int-form',
  kgd: 'modal-kgd-form',
  pem: 'modal-pem-form',
  rawk: 'modal-rawk-form',

  rawi: 'modal-rawi-form',
  lga: 'modal-lga-form',
  lgb: 'modal-lgb-form',
  lgp: 'modal-lgp-form',
  awkakn: 'modal-akn-form',
  awkkeg: 'modal-akk-form'
};
function _attachModalId(key) { return _ATTACH_MODAL[key] || null; }

var _MODAL_STACK = [];
var _BASE_MODAL_Z = 99999;

function openModal(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('n-hidden');

  // Dynamic z-index stacking: Modal yang baru dibuka selalu berada di atas modal sebelumnya
  var idx = _MODAL_STACK.indexOf(id);
  if (idx !== -1) _MODAL_STACK.splice(idx, 1);
  _MODAL_STACK.push(id);

  el.style.zIndex = _BASE_MODAL_Z + (_MODAL_STACK.length * 20);
}

function closeModal(id) {
  // Kalau sedang menampilkan panel sukses, pulihkan markup modal asli dulu
  // supaya form bisa dipakai lagi saat dibuka berikutnya.
  _formRestore(id);
  var el = document.getElementById(id);
  if (el) {
    el.classList.add('n-hidden');
    el.style.zIndex = '';
  }
  var idx = _MODAL_STACK.indexOf(id);
  if (idx !== -1) _MODAL_STACK.splice(idx, 1);

  // Pulihkan modal induk pegawai jika modal sertifikat ditutup
  if (id === 'modal-tu-sertifikat' && typeof _TU !== 'undefined' && _TU._parentModalBeforeSertifikat) {
    var pId = _TU._parentModalBeforeSertifikat;
    _TU._parentModalBeforeSertifikat = null;
    openModal(pId);
  }

  _syncCheckDeferred();
}

// ── OVERLAY KLIK DI LUAR MODAL = TUTUP ──────────────────────────────────
// Berlaku untuk semua .n-overlay yang berisi form. Overlay drawer (n-z-drawer)
// dan modal-hd (read-only detail) dikecualikan.
// Jika ada field yang sudah diisi, tampilkan konfirmasi sebelum menutup.

var _MODAL_OVERLAY_EXCLUDE = {
  'dr-mask': true,         // drawer persetujuan
  'modal-hd': true,        // modal lihat detail (read-only)
  'modal-reject': true,    // modal tolak pendaftaran (satu field saja, aman)
  'modal-admin-user': true // modal admin kelola akun
};

// Cek apakah overlay memiliki field yang telah diisi pengguna.
function _modalHasDirtyFields(overlayEl) {
  var inputs = overlayEl.querySelectorAll('input, textarea, select');
  for (var i = 0; i < inputs.length; i++) {
    var el = inputs[i];
    // Skip: hidden, disabled, readonly, checkbox "tidak perlu lampiran"
    if (el.type === 'hidden' || el.disabled || el.readOnly) continue;
    if (el.type === 'checkbox') continue;
    // Skip: input bertipe file (nilai default = '')
    if (el.type === 'file') continue;
    // Select: dirty bila berubah dari option pertama (index 0) dan option > 1
    if (el.tagName === 'SELECT') {
      if (el.options.length > 1 && el.selectedIndex > 0) return true;
      continue;
    }
    var v = (el.value || '').trim();
    // Angka: dirty jika bukan '0' dan bukan ''
    if (el.type === 'number') { if (v !== '' && v !== '0') return true; continue; }
    if (v !== '') return true;
  }
  return false;
}

// Pasang listener overlay-click-to-close satu kali saat init.
function _initOverlayClose() {
  document.addEventListener('click', function (e) {
    // Cari overlay terdekat yang menjadi target klik
    var overlay = e.target;
    if (!overlay || !overlay.classList || !overlay.classList.contains('n-overlay')) return;
    // Klik harus tepat di overlay (bukan di anak elemen .n-modal)
    var modal = overlay.querySelector('.n-modal');
    if (modal && modal.contains(e.target)) return;
    // Lewati overlay yang dikecualikan
    if (_MODAL_OVERLAY_EXCLUDE[overlay.id]) return;
    // Lewati overlay drawer (pakai kelas n-z-drawer)
    if (overlay.classList.contains('n-z-drawer')) return;
    // Lewati overlay yang sudah hidden
    if (overlay.classList.contains('n-hidden')) return;

    // Jika ada field yang diisi, konfirmasi dulu
    if (_modalHasDirtyFields(overlay)) {
      var ok = confirm('Formulir ini memiliki isian yang belum disimpan.\nApakah Anda yakin ingin menutup dan membuang perubahan?');
      if (!ok) return;
    }

    // Cari tombol Batal / fungsi close yang terkait dengan overlay ini
    // (supaya state modul ikut di-reset, mis. _TU.pendingRowId)
    var cancelBtn = overlay.querySelector('button.btn-ghost, button.btn-outline');
    if (cancelBtn && cancelBtn.onclick) {
      cancelBtn.click();
    } else {
      closeModal(overlay.id);
    }
  });

  // ── APPLE DESIGN: ANCHORED MODAL ORIGIN TRACKER ─────────────
  try {
    var _lastClickOrigin = null;
    document.addEventListener('pointerdown', function (e) {
      var btn = e.target.closest('button, .btn, .btn-primary, .btn-mini, .n-iconbtn, a');
      if (btn) {
        _lastClickOrigin = { x: e.clientX, y: e.clientY };
      }
    }, true);

    var _modalObserver = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var m = mutations[i];
        if (m.type === 'attributes' && m.attributeName === 'class') {
          var target = m.target;
          if (target && target.classList && target.classList.contains('n-overlay') && !target.classList.contains('n-hidden')) {
            var modal = target.querySelector('.n-modal');
            if (modal && _lastClickOrigin) {
              var r = modal.getBoundingClientRect();
              var ox = Math.max(16, Math.min(r.width - 16, _lastClickOrigin.x - r.left));
              var oy = Math.max(16, Math.min(r.height - 16, _lastClickOrigin.y - r.top));
              modal.style.transformOrigin = ox + 'px ' + oy + 'px';
            }
          }
        }
      }
    });
    _modalObserver.observe(document.body, { attributes: true, subtree: true, attributeFilter: ['class'] });
  } catch (e) { /* silent origin helper */ }
}

// ── APPLE DESIGN: GESTURE SHEET SWIPE-TO-DISMISS ────────────
function _initSheetGestures() {
  try {
    var drawer = document.getElementById('dr-drawer');
    if (!drawer) return;
    var startY = 0, currentY = 0, isDragging = false;
    drawer.addEventListener('touchstart', function (e) {
      if (e.target.closest('.sheet-grabber') || (e.target.closest('.n-drawer-hd') && drawer.scrollTop <= 0)) {
        startY = e.touches[0].clientY;
        isDragging = true;
        drawer.style.transition = 'none';
      }
    }, { passive: true });
    drawer.addEventListener('touchmove', function (e) {
      if (!isDragging) return;
      currentY = e.touches[0].clientY;
      var dy = currentY - startY;
      if (dy > 0) {
        drawer.style.transform = 'translateY(' + dy + 'px)';
      }
    }, { passive: true });
    drawer.addEventListener('touchend', function () {
      if (!isDragging) return;
      isDragging = false;
      drawer.style.transition = 'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1)';
      var dy = currentY - startY;
      if (dy > 80) {
        closeApprovalDrawer();
      } else {
        drawer.style.transform = '';
      }
    });
  } catch (e) { /* silent gesture helper */ }
}

// ── MODAL LIHAT RIWAYAT (detail submission, berlaku semua modul) ──
// Tiap renderer riwayat mendorong satu entri detail per baris via _hdPush(),
// lalu menaruh tombol "Lihat" dengan index-nya sebagai argumen onclick.
// Argumen `manage` (opsional) = kode onclick untuk aksi kelola lampiran,
// ditampilkan di bagian "Lampiran" modal — menggantikan tombol "Lampiran"
// terpisah yang dulu ada di baris tabel.

var _HD = { stack: [], cur: null };

function _hdReset() {
  _HD.stack = [];
  _HD.cur = null;
}

function _hdPush(refSheet, rowId, title, fields, manage) {
  var i = _HD.stack.length;
  _HD.stack.push({ refSheet: refSheet, rowId: rowId, title: title, fields: fields || [], manage: manage || null });
  return i;
}

function _hdOpen(i) {
  var d = _HD.stack[i];
  if (!d) return;
  _HD.cur = d;
  var titleEl = document.getElementById('hd-title');
  if (titleEl) titleEl.textContent = d.title;
  var body = document.getElementById('hd-body');
  var rows = '';
  for (var j = 0; j < d.fields.length; j++) {
    rows += '<tr><td class="hd-k">' + d.fields[j][0] + '</td><td class="hd-v">' + d.fields[j][1] + '</td></tr>';
  }
  if (body) body.innerHTML = rows || '<tr><td colspan="2" style="padding:12px;color:var(--n-text-muted);font-size:.85rem;">Tidak ada detail tambahan.</td></tr>';
  var manageEl = document.getElementById('hd-evidence-manage');
  if (manageEl) manageEl.innerHTML = d.manage ? '<button class="btn-mini" onclick="' + d.manage + '">Kelola</button>' : '';
  _hdLoadEvidence(d.refSheet, d.rowId);
  var m = document.getElementById('modal-hd');
  if (m) m.classList.remove('n-hidden');
}

function _hdClose() {
  _HD.cur = null;
  closeModal('modal-hd');
}

// Setelah lampiran ditambah/diubah dari modal kelola, segarkan daftar lampiran
// di modal Lihat bila baris yang sama masih terbuka di sana.
function _hdRefreshEvidenceIfCurrent(refSheet, refRowId) {
  var d = _HD.cur;
  if (!d || d.refSheet !== refSheet || d.rowId !== refRowId) return;
  _hdLoadEvidence(d.refSheet, d.rowId);
}

function _hdLoadEvidence(refSheet, rowId) {
  var list = document.getElementById('hd-evidence');
  if (!list) return;
  list.innerHTML = _loadingInline('Memuat lampiran\u2026');
  if (!refSheet || !rowId) {
    list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Tidak ada lampiran.</div>';
    return;
  }
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        list.innerHTML = '<div class="n-msg error show">' + _esc((res && res.error) || 'Gagal memuat lampiran.') + '</div>';
        return;
      }
      if (!res.data.length) {
        list.innerHTML = '<div style="color:var(--n-text-muted);font-size:.85rem;">Belum ada lampiran untuk laporan ini.</div>';
        return;
      }
      list.innerHTML = res.data.map(function (e) {
        var tgl = e.uploadedAt ? new Date(e.uploadedAt).toLocaleString('id-ID') : '';
        return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n-border-subtle);">' +
          '<a href="' + _esc(e.viewUrl) + '" target="_blank" rel="noopener" style="color:var(--n-primary);font-size:.85rem;">' + _esc(e.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--n-text-muted);white-space:nowrap;">' + _esc(e.sourceMode) + ' \u00b7 ' + tgl + '</span>' +
        '</div>';
      }).join('');
    })
    .withFailureHandler(function () {
      list.innerHTML = '<div class="n-msg error show">Gagal memuat lampiran. Coba lagi.</div>';
    })
    .evidence_list(APP.token, refSheet, rowId);
}

// ══════════════════════════════════════════════════════════
// RENDERER RIWAYAT DIVISI — SATU IMPLEMENTASI UNTUK SEMUA MODUL
// ══════════════════════════════════════════════════════════
// Bentuk tabel riwayat seragam di setiap divisi:
//   Periode | …kolom khusus modul… | Dikirim | Status | Aksi
//   Aksi   : Lihat · Revisi · Anulir  (urutan tetap, Anulir destruktif di akhir)
//   Status : badge AKTIF / DITIMPA / DIANULIR dari token tema
//   VOID   : baris tinted + komentar anulir inline (ARCHITECTURE.md §5, PRD §7.4)
// Modul hanya supplying konfigurasi `columns` / `cells` / `detail` dan callback
// revisi-anulir-nya; badge, baris anulir, empty state, dan aksi tetap di sini
// supaya tidak ada lagi salinan yang menyimpang antar modul.

// Modul "Gen-1" (Tata Usaha, Operasi Laut/Udara, Intelijen, Kegiatan, Pemantauan)
// mengirim baris apa adanya dari sheet dengan key PascalCase. Normalisasi di
// sisi client saja — kontrak endpoint server tidak diubah.
var _HIST_KEYMAP = {
  RowID: 'rowId', DivisiID: 'divisiId', Periode: 'periode', Timestamp: 'timestamp',
  Status: 'status', SupersedesRowID: 'supersedesRowId',
  VoidReason: 'voidReason', VoidedBy: 'voidedBy', VoidedAt: 'voidedAt'
};

function _histNorm(r) {
  var out = {}, k;
  for (k in r) if (Object.prototype.hasOwnProperty.call(r, k)) out[k] = r[k];
  for (k in _HIST_KEYMAP) {
    if (out[_HIST_KEYMAP[k]] === undefined && out[k] !== undefined) out[_HIST_KEYMAP[k]] = out[k];
  }
  return out;
}

function _histBadge(status) {
  var s = String(status || '').toUpperCase();
  if (s === 'ACTIVE') return '<span class="status-badge aktif">AKTIF</span>';
  if (s === 'VOID') return '<span class="status-badge dianulir">DIANULIR</span>';
  return '<span class="status-badge ditimpa">DITIMPA</span>';
}

// Badge status domain (mis. SIAP/TIDAK SIAP, BASELINE/PENGGUNAAN) — tetap
// bermakna status, bukan dekorasi (DESIGN.md §1.3), jadi memakai kelas yang sama.
function _histBadgeTone(label, tone) {
  return '<span class="status-badge ' + tone + '">' + _esc(label) + '</span>';
}

function _histRowAttrs(status) {
  var s = String(status || '').toUpperCase();
  if (s === 'VOID') return ' class="hist-row-void"';
  if (s === 'SUPERSEDED') return ' class="hist-row-ditampa"';
  return '';
}

function _histActions(cfg, r) {
  var active = String(r.status || '').toUpperCase() === 'ACTIVE';
  var sheet = (typeof cfg.refSheet === 'function') ? cfg.refSheet(r) : cfg.refSheet;
  var out = '<button class="btn-outline" onclick="_hdOpen(' +
    _hdPush(sheet, r.rowId, cfg.title(r), cfg.detail(r), cfg.manage ? cfg.manage(r) : null) +
    ')">Lihat</button>';
  if (active && cfg.revisi) out += '<button class="btn-outline" onclick="' + cfg.revisi(r) + '">Revisi</button>';
  if (active && cfg.anulir) out += '<button class="btn-danger" onclick="' + cfg.anulir(r) + '">Anulir</button>';
  return '<div class="hist-actions ctl-row ctl-sm ctl-nowrap">' + out + '</div>';
}

function _histRender(wrapId, cfg, rows, prefixHtml) {
  var wrap = document.querySelector('#page-content #' + wrapId) || document.getElementById(wrapId);
  if (!wrap) return;
  _hdReset();
  var pre = prefixHtml || '';
  var items = (rows || []).map(_histNorm);

  if (!items.length) {
    wrap.innerHTML = pre + '<div class="hist-empty">' +
      _esc(cfg.empty || 'Belum ada laporan untuk periode ini.') + '</div>';
    return;
  }

  var t = '<div class="n-table-wrap"><table class="n-table"><thead><tr>';
  cfg.columns.forEach(function (c) { t += '<th>' + _esc(c) + '</th>'; });
  t += '<th>Dikirim</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';

  items.forEach(function (r) {
    t += '<tr' + _histRowAttrs(r.status) + '>';
    cfg.cells(r).forEach(function (cell) { t += '<td>' + cell + '</td>'; });

}

function _attachToggle(key) {

  if (f) f.style.display = s.noAtt ? 'none' : 'grid';
  _attachMsg(key, null);
}

function _attachPickFiles(key) {
  var s = _attachState(key);
  if (!s) return;
  var input = document.getElementById(key + '-files');
  if (input && input.files) {
    var rejectedVideos = [];
    for (var i = 0; i < input.files.length; i++) {
      var file = input.files[i];
      var isVideo = file.type && file.type.indexOf('video/') === 0;
      // Enforce video policy (Fase 17): Video > 20MB wajib via link Drive / YouTube
      if (isVideo && file.size > 20 * 1024 * 1024) {
        rejectedVideos.push(file.name + ' (' + (file.size / (1024 * 1024)).toFixed(1) + 'MB)');
        continue;
      }
      s.files.push(file);
    }
    input.value = '';
    if (rejectedVideos.length > 0) {
      _attachMsg(key, 'warn', 'Video melebihi batas 20MB: ' + rejectedVideos.join(', ') + '. Sesuai kebijakan penyimpanan, silakan gunakan opsi tautan Google Drive / YouTube.');
    } else {
      _attachMsg(key, null);
    }
  }
  _attachRenderList(key);
}

function _attachRemoveFile(key, idx) {

      '<button type="button" onclick="_attachRetry(\'' + key + '\')">Ulangi upload lampiran</button></div>';

/**
 * Validasi blok lampiran: default wajib ada file/link, kecuali dicentang
 * "tidak perlu lampiran". Mengembalikan '' jika valid, pesan error jika tidak.
 */
function _attachValidate(key) {
  var s = _attachState(key);
  if (!s) return '';
  if (s.noAtt) return '';
  if (s.files.length === 0 && !s.link) {
    return 'Lampiran wajib pada pengunggahan ini, atau centang \u201cPengunggahan ini tidak perlu lampiran\u201d.';
  }
  if (s.link && !/drive\.google\.com/.test(s.link) && !/youtube\.com|youtu\.be/.test(s.link) && !/^[a-zA-Z0-9_\-]{20,}$/.test(s.link)) {
    return 'Link harus berupa URL Google Drive atau tautan YouTube yang valid.';
  }
  return '';
}

function _attachReset(key) {
  var s = _attachState(key);
  if (!s) return;
  s.noAtt = false;
  s.files = [];
  s.link = '';
  s.rowIds = [];
  s.tasks = [];
  s.busy = false;
  s.after = null;
  var cb = document.getElementById(key + '-noatt');
  if (cb) cb.checked = false;
  var f = document.getElementById(key + '-fields');
  if (f) f.style.display = 'grid';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
  _attachMsg(key, null);
}

function _attachReadBase64(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var data = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
    cb(data || null);
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/**
 * Kompresi Kanvas Sisi Klien (Fase 17):
 * Mengubah resolusi gambar raster (JPEG/PNG/WEBP) ke max-width 1600px dan mengompresnya
 * ke format JPEG kualitas 0.8 sebelum di-encode ke Base64. Menghemat kuota Google Drive
 * dan mencegah batas kuota/timeout payload GAS.
 */
function _compressImageCanvas(file, maxWidth, quality, cb) {
  if (!file.type || !file.type.match(/^image\/(jpeg|png|webp)/i)) {
    _attachReadBase64(file, function (b64) {
      cb({ name: file.name, mime: file.type || 'application/octet-stream', b64: b64 });
    });
    return;
  }

  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      try {
        var targetW = img.width;
        var targetH = img.height;
        if (targetW > maxWidth) {
          targetH = Math.round((targetH * maxWidth) / targetW);
          targetW = maxWidth;
        }
        var canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, targetW, targetH);

        var dataUrl = canvas.toDataURL('image/jpeg', quality || 0.8);
        var b64 = dataUrl.replace(/^data:[^;]+;base64,/, '');
        var newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
        cb({ name: newName, mime: 'image/jpeg', b64: b64 });
      } catch (err) {
        var fallbackB64 = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
        cb({ name: file.name, mime: file.type, b64: fallbackB64 });
      }
    };
    img.onerror = function () {
      var fallbackB64 = String(e.target.result || '').replace(/^data:[^;]+;base64,/, '');
      cb({ name: file.name, mime: file.type, b64: fallbackB64 });
    };
    img.src = e.target.result;
  };
  reader.onerror = function () {
    cb({ name: file.name, mime: file.type, b64: null });
  };
  reader.readAsDataURL(file);
}

/**
 * Upload semua lampiran (file/link) ke baris hasil submit, lalu reset blok.
 * @param key   - kunci state blok (prefix form)
 * @param rowIds- RowID baris tujuan (1..N dari hasil submit)
 * @param after - callback(ok:boolean) setelah seluruh tentatif selesai
 */
function _attachUploadAll(key, rowIds, after) {
  var s = _attachState(key);
  if (!s) return;
  if (s.noAtt || !s.refSheet || !rowIds || !rowIds.length) { if (after) after(true); return; }
  if (s.files.length === 0 && !s.link) { if (after) after(true); return; }

  s.rowIds = rowIds;
  s.after = after;
  s.busy = true;
  s.tasks = [];
  for (var i = 0; i < s.files.length; i++) {
    s.tasks.push({ kind: 'file', file: s.files[i], base64: null });
  }
  if (s.link) s.tasks.push({ kind: 'link', url: s.link });

  if (s.tasks.length === 0) { if (after) after(true); return; }

  // Data sudah tersimpan, sekarang tinggal mengunggah lampiran — lanjutkan
  // overlay besar dengan status baru supaya prosesnya tetap terlihat.
  var mid = _attachModalId(key);
  if (mid) _formLoadingOverlay(mid, true, 'Mengunggah lampiran\u2026');
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

function _attachReadTasks(key, idx, done) {
  var s = _attachState(key);
  if (idx >= s.tasks.length) { done(); return; }
  var t = s.tasks[idx];
  if (t.kind !== 'file' || t.base64) { _attachReadTasks(key, idx + 1, done); return; }
  _compressImageCanvas(t.file, 1600, 0.8, function (res) {
    t.base64 = res.b64;
    t.compressedName = res.name;
    t.compressedMime = res.mime;
    _attachReadTasks(key, idx + 1, done);
  });
}

function _attachRunNext(key, idx) {
  var s = _attachState(key);
  if (!s) return;
  if (idx >= s.tasks.length) {
    s.busy = false;
    var doneCb = s.after;
    _attachMsg(key, 'success', 'Semua lampiran berhasil diunggah.');
    _attachReset(key);
    if (doneCb) doneCb(true);
    return;
  }

  var t = s.tasks[idx];
  var single = s.rowIds.length === 1;
  var runner = google.script.run.withSuccessHandler(function (res) {
    if (res && res.success) {
      s.tasks.splice(idx, 1);
      _attachRunNext(key, idx);
    } else {
      _attachFail(key, (res && res.error) || 'Upload gagal.');
    }
  }).withFailureHandler(function () {
    _attachFail(key, 'Terjadi kesalahan koneksi saat mengunggah lampiran.');
  });

  if (t.kind === 'file') {
    var params = {
      refSheet: s.refSheet,
      fileName: t.compressedName || t.file.name,
      mimeType: t.compressedMime || t.file.type || 'application/octet-stream',
      dataBase64: t.base64
    };
    if (single) { params.refRowId = s.rowIds[0]; runner.evidence_upload(APP.token, params); }
    else        { params.refRowIds = s.rowIds;     runner.evidence_uploadBatch(APP.token, params); }
  } else {
    var p2 = { refSheet: s.refSheet, url: t.url };
    if (single) { p2.refRowId = s.rowIds[0]; runner.evidence_uploadFromLink(APP.token, p2); }
    else        { p2.refRowIds = s.rowIds;   runner.evidence_uploadFromLinkBatch(APP.token, p2); }
  }
}

function _attachFail(key, text) {
  var s = _attachState(key);
  if (!s) return;
  s.busy = false;
  var doneCb = s.after;
  s.after = null;
  var mid = _attachModalId(key);
  if (mid) _formLoadingOverlay(mid, false);
  _attachMsg(key, 'warn', text + ' Baris sudah tersimpan; lampiran yang belum ter-upload akan dicoba lagi.');
  if (doneCb) doneCb(false);
}

function _attachRetry(key) {
  var s = _attachState(key);
  if (!s || s.busy) return;
  if (!s.tasks.length) return;
  s.after = null;
  s.busy = true;
  _attachMsg(key, null);
  _attachReadTasks(key, 0, function () { _attachRunNext(key, 0); });
}

/** Bersihkan input file/link setelah semua berhasil (state file/link di-reset). */
function _attachResetFieldsOnly(key) {
  var s = _attachState(key);
  if (!s) return;
  s.files = [];
  s.link = '';
  var li = document.getElementById(key + '-link');
  if (li) li.value = '';
  _attachRenderList(key);
}

/**
 * Bawa lampiran baris lama ke baris baru hasil revisi (fire-and-forget).
 * Dipanggil setelah revisi sukses, agar lampiran tidak "hilang" dari baris aktif.
 */
function _attachCarry(refSheet, fromRowId, toRowId) {
  if (!refSheet || !fromRowId || !toRowId) return;
  google.script.run
    .withFailureHandler(function () { /* non-blokir — revisi tetap sukses */ })
    .evidence_carry(APP.token, { refSheet: refSheet, fromRowId: fromRowId, toRowId: toRowId });
}

function _tuLoadKPI(silent) {

  if (histWrap && !silent && (!_TU.history || !_TU.history.length)) {
    histWrap.innerHTML = _tableSkeleton(4, 5);

  google.script.run
    .withSuccessHandler(function (res) {

function _tuUpdatePaguModalPreview() {
  var k = _TU.kpi || {};
  var oldReg = Number(k.paguReguler) || 0;
  var oldAbt = Number(k.paguABT) || 0;
  var oldTot = oldReg + oldAbt;
  var revCount = parseInt(k.revisiPagu, 10) || 0;

  var newReg = Number((document.getElementById('tu-pagu-modal-reguler') || {}).value) || 0;
  var newAbt = Number((document.getElementById('tu-pagu-modal-abt') || {}).value) || 0;
  var newTot = newReg + newAbt;
  var delta  = newTot - oldTot;
  var changed = (newReg !== oldReg) || (newAbt !== oldAbt);

  var totBadge = document.getElementById('tu-pagu-total-badge');
  if (totBadge) totBadge.textContent = 'Total: ' + _rupiah(newTot);

  var cmpOld = document.getElementById('tu-pagu-cmp-old');
  var cmpOldSub = document.getElementById('tu-pagu-cmp-old-sub');
  var cmpNew = document.getElementById('tu-pagu-cmp-new');
  var cmpNewSub = document.getElementById('tu-pagu-cmp-new-sub');
  var cmpDelta = document.getElementById('tu-pagu-cmp-delta');
  var cmpRevNext = document.getElementById('tu-pagu-cmp-rev-next');

  if (cmpOld) cmpOld.textContent = _rupiah(oldTot);
  if (cmpOldSub) cmpOldSub.textContent = 'Reg: ' + _rupiah(oldReg) + ' \u00B7 ABT: ' + _rupiah(oldAbt);
  if (cmpNew) cmpNew.textContent = _rupiah(newTot);
  if (cmpNewSub) cmpNewSub.textContent = 'Reg: ' + _rupiah(newReg) + ' \u00B7 ABT: ' + _rupiah(newAbt);

  if (cmpDelta) {
    var sign = delta > 0 ? '+' : (delta < 0 ? '-' : '');
    cmpDelta.textContent = sign + _rupiah(Math.abs(delta));
    cmpDelta.style.color = delta > 0 ? '#059669' : (delta < 0 ? 'var(--n-crit)' : 'var(--n-text-secondary)');
  }
  if (cmpRevNext) {
    cmpRevNext.textContent = changed
      ? 'Akan dicatat sebagai Revisi ke-' + (revCount + 1)
      : 'Nominal belum berubah dari Pagu aktif';
  }
}

function tuSubmitPagu() {
  var btn = document.getElementById('tu-btn-submit-pagu');
  _msg('tu-pagu-msg', null);

  var chk = document.getElementById('tu-pagu-verify-check');
  if (!chk || !chk.checked) {
    _msg('tu-pagu-msg', 'error', 'Harap centang pernyataan verifikasi dokumen DIPA/POK terlebih dahulu.');
    return;
  }

  var pReg = Number((document.getElementById('tu-pagu-modal-reguler') || {}).value) || 0;
  var pAbt = Number((document.getElementById('tu-pagu-modal-abt') || {}).value) || 0;
  var cat  = String((document.getElementById('tu-pagu-modal-catatan') || {}).value || '').trim();

  if (pReg + pAbt <= 0) {
    _msg('tu-pagu-msg', 'error', 'Total alokasi Pagu DIPA (Reguler + ABT) harus lebih besar dari Rp 0.');
    return;
  }

  var k = _TU.kpi || {};
  var oldReg = Number(k.paguReguler) || 0;
  var oldAbt = Number(k.paguABT) || 0;
  var isRevisi = (oldReg + oldAbt) > 0;

  if (isRevisi) {
    if (pReg === oldReg && pAbt === oldAbt) {
      _msg('tu-pagu-msg', 'error', 'Nominal Pagu Reguler dan Pagu ABT belum berubah dari Pagu aktif saat ini.');
      return;
    }
    if (!cat) {
      _msg('tu-pagu-msg', 'error', 'Dasar hukum / Catatan Revisi Pagu DIPA wajib diisi saat melakukan revisi Pagu.');
      return;
    }
  }

  var attachErr = _attachValidate('tu-pagu');
  if (attachErr) {
    _msg('tu-pagu-msg', 'error', attachErr);
    return;
  }

  _setLoading(btn, true);
  var params = {
    paguReguler: pReg,
    paguABT: pAbt,
    catatanRevisiPagu: cat,
    verified: true
  };

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg('tu-pagu-msg', 'error', (res && res.error) || 'Gagal menyimpan data Pagu.');
        return;
      }
      _msg('tu-pagu-msg', 'success', res.data.message);
      _attachUploadAll('tu-pagu', [res.data.rowId], function (ok) {
        _formSubmitDone('modal-tu-pagu', res.data.message, function () {
          _tuLoadKPI();
        }, ok);
      });
    })
    .withFailureHandler(function () {

// Status bar kunci Pagu: 'lock' (terkunci, ikut laporan sebelumnya), 'unlock' (bisa diubah), 'none' (belum ada laporan sebelumnya).
function _tuSetPaguBar(state) {
  var bar   = document.getElementById('tu-pagu-bar');
  var txt   = document.getElementById('tu-pagu-bar-txt');
  var btnU  = document.getElementById('tu-btn-unlock-pagu');
  var btnL  = document.getElementById('tu-btn-lock-pagu');
  var pr    = document.getElementById('tu-pagu-reguler');
  var pa    = document.getElementById('tu-pagu-abt');
  if (pr) pr.readOnly = (state === 'lock');
  if (pa) pa.readOnly = (state === 'lock');
  _tuWatchPagu(state === 'unlock');
  if (state === 'none') {
    if (bar) bar.classList.add('n-hidden');
    if (btnU) btnU.classList.add('n-hidden');
    if (btnL) btnL.classList.add('n-hidden');
    return;
  }
  if (bar) {
    bar.classList.remove('n-hidden');
    bar.classList.toggle('unlocked', state === 'unlock');
  }
  if (txt) {
    txt.textContent = (state === 'lock')
      ? 'Pagu terkunci \u2014 mengikuti laporan sebelumnya (Reguler Rp ' + _rupiah(_TU._paguBase.r) + ' \u00B7 ABT Rp ' + _rupiah(_TU._paguBase.a) + '). Klik "Ubah Pagu" hanya bila pagu berubah.'
      : 'Pagu dibuka untuk diubah \u2014 wajib isi Catatan Revisi Pagu saat menyimpan.';
  }
  if (btnU) btnU.classList.toggle('n-hidden', state !== 'lock');
  if (btnL) btnL.classList.toggle('n-hidden', state !== 'unlock');
}

// Pasang/lepas pemantau perubahan nilai Pagu. Ditempel di satu tempat
// (_tuSetPaguBar) supaya tidak ada listener nyangkut saat modal ditutup
// dalam keadaan pagu terbuka — kalau nyangkut, penghitung akan ikut
// berubah di luar modal.
function _tuWatchPagu(on) {
  ['tu-pagu-reguler', 'tu-pagu-abt'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (on) el.addEventListener('input', _tuPaguBerubah);
    else    el.removeEventListener('input', _tuPaguBerubah);
  });
}

function _tuShowCatatan(show) {
  var wrap = document.getElementById('tu-catatan-wrap');
  if (wrap) wrap.classList.toggle('n-hidden', !show);
}

// Penghitung "Revisi pagu: sudah N kali" (server: _tuHitungRevisiPagu di
// TataUsahaService, lewat KPI.revisiPagu). Angka = revisi yang SUDAH terjadi.
// Saat pagu dibuka untuk diubah, tambahkan prediksi "Jika disimpan, menjadi
// revisi ke-(N+1)" — user jadi tahu nomor yang akan terpakai sebelum menyimpan.
function _tuRenderRevisiPagu(elId, next) {
  var el = document.getElementById(elId);
  if (!el) return;
  var k = _TU.kpi;
  el.classList.remove('is-next');
  // KPI belum termuat → jangan tampilkan "Belum pernah direvisi": itu klaim
  // yang belum terverifikasi. Tanda hubung netral sampai data tiba.
  if (!k) { el.textContent = '\u2014'; return; }
  var n = parseInt(k.revisiPagu, 10);
  if (isNaN(n) || n < 0) n = 0;
  var html = n > 0
    ? 'Revisi pagu: sudah <b>' + n + '</b> kali'
    : 'Belum pernah direvisi';
  if (next) {
    html += ' \u2014 jika disimpan, menjadi <b>revisi ke-' + (n + 1) + '</b>.';
    el.classList.add('is-next');
  }
  el.innerHTML = html;
}

// Apakah nilai Pagu saat ini benar-benar berbeda dari nilai dasar (dari
// laporan sebelumnya)? Membuka "Ubah Pagu" tanpa mengubah angka TIDAK
// menambah revisi — jadi prediksi "revisi ke-N" harus hilang kalau nilai
// dikembalikan ke nilai asal.
function _tuPaguBerubah() {
  var pr = document.getElementById('tu-pagu-reguler');
  var pa = document.getElementById('tu-pagu-abt');
  var base = _TU._paguBase || { r: null, a: null };
  var berubah =
    (pr && Number(pr.value || 0) !== Number(base.r)) ||
    (pa && Number(pa.value || 0) !== Number(base.a));
  _tuRenderRevisiPagu('tu-pagu-rev', berubah);
}

function tuUnlockPagu(enable) {
  if (enable) {
    // Kunci dulu nilai lama agar "Batalkan" bisa mengembalikannya.
    if (!_TU._paguBase || _TU._paguBase.r === null) {
      _TU._paguBase = {
        r: (document.getElementById('tu-pagu-reguler') || {}).value || 0,
        a: (document.getElementById('tu-pagu-abt')     || {}).value || 0
      };
    }
    _tuSetPaguBar('unlock');
    _tuShowCatatan(true);
    // Nilai saat unlock masih sama dengan nilai dasar → belum sebuah revisi.
    _tuRenderRevisiPagu('tu-pagu-rev', false);
  } else {
    var pr = document.getElementById('tu-pagu-reguler');
    var pa = document.getElementById('tu-pagu-abt');
    if (pr && _TU._paguBase.r !== null) pr.value = _TU._paguBase.r;
    if (pa && _TU._paguBase.a !== null) pa.value = _TU._paguBase.a;
    var cl = document.getElementById('tu-catatan');
    if (cl) cl.value = '';
    _tuSetPaguBar('lock');
    _tuShowCatatan(false);
    _tuRenderRevisiPagu('tu-pagu-rev', false);
  }
  _msg('tu-form-msg', null);
}

function _tuFillFormContext() {
  var d = _TU.kpi;
  var regEl = document.getElementById('tu-ctx-pagu-reg');
  var abtEl = document.getElementById('tu-ctx-pagu-abt');
  var ctx   = document.getElementById('tu-form-context-value');
  if (regEl) regEl.textContent = d ? _rupiah(d.paguReguler || 0) : 'Rp 0';
  if (abtEl) abtEl.textContent = d ? _rupiah(d.paguABT || 0) : 'Rp 0';
  if (ctx)   ctx.textContent   = d ? _rupiah(d.paguTotal || ((d.paguReguler || 0) + (d.paguABT || 0))) : 'Rp 0';
}

function _tuSwitchTab(tabName) {
  var isHapusTarget = (tabName === 'penghapusan');
  _TU.activeTab = isHapusTarget ? 'bmn' : (tabName || 'anggaran');
  _sikapHighlightModule(_TU.activeTab);

  // Toggle active class on tab buttons
  var btns = document.querySelectorAll('.tu-subnav-btn');
  btns.forEach(function (b) {
    if (b.getAttribute('data-tu-tab') === _TU.activeTab) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });

  // Toggle visible pane
  var panes = ['anggaran', 'paket', 'pegawai', 'bmn', 'penghapusan'];
  panes.forEach(function (p) {
    var paneEl = document.querySelector('#page-content #tu-pane-' + p) || document.getElementById('tu-pane-' + p);
    if (!paneEl) return;
    if (p === _TU.activeTab) {
      paneEl.classList.remove('n-hidden');
    } else {
      paneEl.classList.add('n-hidden');
    }
  });

  // Load data for selected tab
  if (_TU.activeTab === 'anggaran') {
    if (_TU.kpi) {
      _tuRenderKPI(_TU.kpi);
      if (_TU.history && _TU.history.length) _tuRenderHistory(_TU.history);
      _tuLoadKPI(true);
    } else {
      _tuLoadKPI();
    }
  } else if (_TU.activeTab === 'paket') {
    if (_TU.paketData) {
      _tuRenderPaketKPI(_TU.paketData);
      if (typeof _tuFilterPaket === 'function') _tuFilterPaket();
      _tuLoadPaket(true);
    } else {
      _tuLoadPaket();
    }
  } else if (_TU.activeTab === 'pegawai') {
    if (_TU.pegawaiData) {
      _tuRenderPegawaiKPI(_TU.pegawaiData);
      if (typeof _tuRenderPegawaiChart === 'function') _tuRenderPegawaiChart(_TU.pegawaiData);
      _tuLoadPegawai(true);
    } else {
      _tuLoadPegawai();
    }
    _tuLoadKompetensi();
  } else if (_TU.activeTab === 'bmn') {
    _bmnSelectSubTab(isHapusTarget ? 'penghapusan' : (_BMN.subTab || 'aset'), true);
    _tuLoadBMN();
  }
}

function _tuRenderPegawaiKPI(d) {
  d = d || {};
  var b = d.breakdown || {};
  var pns   = b.PNS || { count: 0, percentage: 0 };
  var p3k   = b.P3K || { count: 0, percentage: 0 };
  var p3kPw = b.P3K_PARUH_WAKTU || { count: 0, percentage: 0 };
  var pjlp  = b.PJLP || { count: 0, percentage: 0 };
  var mag   = b.MAGANG || { count: 0, percentage: 0 };

  var poa = (_TU.kompetensiData && _TU.kompetensiData.kpi && _TU.kompetensiData.kpi.totalDitPoa) || (d && d.totalDitPoa) || 108;
  var awak = (_TU.kompetensiData && _TU.kompetensiData.kpi && _TU.kompetensiData.kpi.totalAwakArmada) || (d && d.totalAwakArmada) || 396;
  var nonAsnCount = (p3k.count || 0) + (p3kPw.count || 0) + (pjlp.count || 0) + (mag.count || 0);
  var total = (poa + awak + nonAsnCount);

  var elTotal  = document.getElementById('tu-peg-kpi-total');
  var elPoa    = document.getElementById('tu-peg-kpi-poa');
  var elAwak   = document.getElementById('tu-peg-kpi-awak');
  var elP3k    = document.getElementById('tu-peg-kpi-p3k');
  var elP3kPw  = document.getElementById('tu-peg-kpi-p3kpw');

function _tuSubmitPegawai() {
  var btn = document.getElementById('tu-peg-btn-save');
  var msgElId = 'tu-pegawai-form-msg';
  _msg(msgElId, null);

  try {
    var pns    = Number((document.getElementById('tu-peg-pns') || {}).value) || 0;
    var p3k    = Number((document.getElementById('tu-peg-p3k') || {}).value) || 0;
    var p3kPw  = Number((document.getElementById('tu-peg-p3k-pw') || {}).value) || 0;
    var pjlp   = Number((document.getElementById('tu-peg-pjlp') || {}).value) || 0;
    var magang = Number((document.getElementById('tu-peg-magang') || {}).value) || 0;
    var ket    = ((document.getElementById('tu-peg-keterangan') || {}).value || '').trim();

    _setLoading(btn, true);

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) {
          _msg(msgElId, 'error', res.error || 'Gagal menyimpan pembaruan.');
          return;
        }
        closeModal('modal-tu-pegawai-form');
        _msg('tu-pegawai-hist-msg', 'success', res.message || 'Pembaruan kepegawaian berhasil disimpan.');
        var ketEl = document.getElementById('tu-peg-keterangan');
        if (ketEl) ketEl.value = '';
        _tuLoadPegawai(true);
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg(msgElId, 'error', 'Terjadi kesalahan sistem saat menyimpan.');
      })
      .tataUsaha_submitPegawai(APP.token, {
        counts: {
          PNS: pns,
          P3K: p3k,
          P3K_PARUH_WAKTU: p3kPw,
          PJLP: pjlp,
          MAGANG: magang
        },
        keterangan: ket
      });
  } catch (ex) {
    _setLoading(btn, false);
    _msg(msgElId, 'error', 'Gagal memproses form: ' + ex.message);
  }
}

function _tuLoadKompetensi(force) {

function _tuPopulatePegawaiFilterOptions(filters) {
  filters = filters || {};
  var unitSelect = document.getElementById('tu-filter-unit');
  var groupSelect = document.getElementById('tu-m-kelompok');

  // Normalisasi seluruh variasi Dit. POA ke 'Dit. POA'
  var uniqueUnits = [];
  var seenUnits = {};
  (filters.units || []).forEach(function (u) {
    var clean = String(u || '').trim();
    if (clean.toLowerCase().indexOf('poa') !== -1 || clean.toLowerCase().indexOf('operasi armada') !== -1 || clean.toLowerCase().indexOf('pengendalian') !== -1) {
      clean = 'Dit. POA';
    }
    if (clean && !seenUnits[clean]) {
      seenUnits[clean] = true;
      uniqueUnits.push(clean);
    }
  });
  uniqueUnits.sort();

  if (unitSelect) {
    var curUnit = unitSelect.value;
    var uHtml = '<option value="">Semua Unit Kerja</option>';
    uniqueUnits.forEach(function (u) {
      uHtml += '<option value="' + _esc(u) + '">' + _esc(u) + '</option>';
    });
    unitSelect.innerHTML = uHtml;
    if (curUnit) unitSelect.value = curUnit;
  }

  if (groupSelect && (!groupSelect.options || groupSelect.options.length <= 1)) {
    var groups = filters.kelompokJabatanList || (typeof STANDAR_PELATIHAN_RESMI !== 'undefined' ? Object.keys(STANDAR_PELATIHAN_RESMI) : []);
    if (groups && groups.length > 0) {
      var gHtml = '<option value="">-- Pilih Kelompok Jabatan --</option>';
      groups.forEach(function (g) {
        gHtml += '<option value="' + _esc(g) + '">' + _esc(g) + '</option>';
      });
      groupSelect.innerHTML = gHtml;
    }
  }
}

function _tuApplyPegawaiFilters() {
  if (!_TU.kompetensiData || !_TU.kompetensiData.pegawaiList) return;

  if (!_TU.pegawaiFilter) {
    _TU.pegawaiFilter = { seg: 'ALL', search: '', unit: '', status: '', statusPegawai: '', page: 1, pageSize: 20 };
  }

  var f = _TU.pegawaiFilter;
  var list = _TU.kompetensiData.pegawaiList;

  var filtered = list.filter(function (p) {
    var pUnit = String(p.unitKerja || '').trim();
    var uLow = pUnit.toLowerCase();
    if (uLow === 'dit. poa' || uLow === 'dit poa' || uLow.indexOf('pengendalian operasi armada') !== -1 || (uLow.indexOf('poa') !== -1 && uLow.indexOf('armada') === -1)) {
      pUnit = 'Dit. POA';
    }

    // Segmented filter
    if (f.seg === 'DIT_POA') {
      if (pUnit !== 'Dit. POA' || p.rumpun === 'AWAK_DEK' || p.rumpun === 'AWAK_MESIN') return false;
    } else if (f.seg === 'AWAK') {
      if (p.rumpun !== 'AWAK_DEK' && p.rumpun !== 'AWAK_MESIN' && p.lingkupData !== 'AWAK_KAPAL_ARMADA') return false;
    } else if (f.seg === 'AWAK_DEK') {
      if (p.rumpun !== 'AWAK_DEK') return false;
    } else if (f.seg === 'AWAK_MESIN') {
      if (p.rumpun !== 'AWAK_MESIN') return false;
    }

    // Search filter
    if (f.search) {
      var haystack = ((p.nama || '') + ' ' + (p.nip || '') + ' ' + (p.jabatanLengkap || '') + ' ' + pUnit + ' ' + (p.kelompokJabatan || '') + ' ' + (p.statusKepegawaian || '') + ' ' + (p.institusiAsal || '') + ' ' + (p.subJenisSDM || '')).toLowerCase();
      if (haystack.indexOf(f.search) === -1) return false;
    }

    // Status Kepegawaian filter (PNS, P3K, PJLP, MAGANG, NON_ASN)
    if (f.statusPegawai) {
      var sPeg = String(p.statusKepegawaian || '').toUpperCase();
      if (!sPeg) {
        sPeg = (pUnit === 'Dit. POA' && p.rumpun !== 'AWAK_DEK' && p.rumpun !== 'AWAK_MESIN') ? 'PNS' : (p.nip && p.nip !== '-' ? 'PNS' : 'NON_ASN');
      }
      if (f.statusPegawai === 'PNS') {
        if (sPeg !== 'PNS') return false;
      } else if (f.statusPegawai === 'P3K') {
        if (sPeg !== 'P3K') return false;
      } else if (f.statusPegawai === 'P3K_PARUH_WAKTU') {
        if (sPeg !== 'P3K_PARUH_WAKTU') return false;
      } else if (f.statusPegawai === 'NON_ASN') {
        if (sPeg !== 'PJLP' && sPeg !== 'MAGANG' && sPeg !== 'NON_ASN') return false;
      } else if (f.statusPegawai === 'PJLP') {
        if (sPeg !== 'PJLP') return false;
      } else if (f.statusPegawai === 'MAGANG') {
        if (sPeg !== 'MAGANG') return false;
      } else if (sPeg !== f.statusPegawai) {
        return false;
      }
    }

    // Unit filter
    if (f.unit) {
      if (f.unit === 'Dit. POA') {
        if (pUnit !== 'Dit. POA' || p.rumpun === 'AWAK_DEK' || p.rumpun === 'AWAK_MESIN') return false;
      } else if (pUnit !== f.unit) {
        return false;
      }
    }

    // Status filter
    if (f.status && p.statusGap !== f.status) return false;

    return true;
  });

  var badgeEl = document.getElementById('tu-peg-badge-total');
  if (badgeEl) badgeEl.textContent = filtered.length + ' personel';

  var totalItems = filtered.length;
  var pageSize = f.pageSize || 20;
  var totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
  if (f.page > totalPages) f.page = totalPages;
  if (f.page < 1) f.page = 1;

  var start = (f.page - 1) * pageSize;
  var end = Math.min(start + pageSize, totalItems);
  var pageItems = filtered.slice(start, end);

  _tuRenderPegawaiDirectoryTable(pageItems, start);
  _tuRenderPegawaiPagination(totalItems, start, end, f.page, totalPages);
}

function _tuRenderPegawaiPagination(totalItems, start, end, currentPage, totalPages) {
  var infoEl = document.getElementById('tu-peg-pagination-info');
  var ctrlEl = document.getElementById('tu-peg-pagination-controls');
  if (!infoEl || !ctrlEl) return;

  if (totalItems === 0) {
    infoEl.textContent = 'Menampilkan 0 dari 0 personel';
    ctrlEl.innerHTML = '';
    return;
  }

  infoEl.textContent = 'Menampilkan ' + (start + 1) + '-' + end + ' dari ' + totalItems + ' personel';

  var prevDisabled = currentPage <= 1 ? 'disabled style="opacity:0.5; pointer-events:none;"' : '';
  var nextDisabled = currentPage >= totalPages ? 'disabled style="opacity:0.5; pointer-events:none;"' : '';

  var h = '';
  h += '<button type="button" class="btn-outline ctl-sm" onclick="_tuChangePegawaiPage(' + (currentPage - 1) + ')" ' + prevDisabled + '>' +
         '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
           '<polyline points="15 18 9 12 15 6"></polyline>' +
         '</svg>' +
         '<span>Sebelumnya</span>' +
       '</button>';

  h += '<span style="font-size:.8125rem; font-weight:600; padding:0 8px;">Hal. ' + currentPage + ' / ' + totalPages + '</span>';

  h += '<button type="button" class="btn-outline ctl-sm" onclick="_tuChangePegawaiPage(' + (currentPage + 1) + ')" ' + nextDisabled + '>' +
         '<span>Berikutnya</span>' +
         '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
           '<polyline points="9 18 15 12 9 6"></polyline>' +
         '</svg>' +
       '</button>';

  ctrlEl.innerHTML = h;
}

function _tuChangePegawaiPage(page) {

function _tuOpenPegawaiDetailModal(pegId) {

  var pUnit = String(peg.unitKerja || '').trim();

      html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--n-border); gap:10px; flex-wrap:wrap;">' +
                '<div style="flex:1; min-width:220px;">' +

                      '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>' +
                      '<polyline points="17 8 12 3 7 8"></polyline>' +
                      '<line x1="12" y1="3" x2="12" y2="15"></line>' +

                    '<span>' + (isLulus ? 'Update File' : 'Upload Sertifikat') + '</span>' +

  if (wrap) wrap.innerHTML = html;

function _tuOpenSertifikatModal(pegId, kodePelatihan) {
  if (!_TU.kompetensiData || !_TU.kompetensiData.pegawaiList) return;
  var peg = _TU.kompetensiData.pegawaiList.find(function (p) { return p.pegawaiId === pegId; });
  if (!peg) return;

  var pUnit = String(peg.unitKerja || '').trim();
  if (pUnit.toLowerCase().indexOf('poa') !== -1 || pUnit.toLowerCase().indexOf('operasi armada') !== -1 || pUnit.toLowerCase().indexOf('pengendalian') !== -1) {
    pUnit = 'Dit. POA';
  }

  var standards = (_TU.kompetensiData.standarByGroup && _TU.kompetensiData.standarByGroup[peg.kelompokJabatan]) || [];
  var st = standards.find(function (s) { return s.kode === kodePelatihan; });
  var cData = (peg.certifications && peg.certifications[kodePelatihan]) || null;

  _TU.pendingSertifikat = {
    pegawaiId: pegId,
    kodePelatihan: kodePelatihan,
    namaPelatihan: st ? st.nama : kodePelatihan
  };
  _TU.sertifikatUploadFile = null;

  var pInput = document.getElementById('tu-sert-pegawai-id');
  var kInput = document.getElementById('tu-sert-kode');
  var nInput = document.getElementById('tu-sert-nama');
  if (pInput) pInput.value = pegId;
  if (kInput) kInput.value = kodePelatihan;
  if (nInput) nInput.value = st ? st.nama : kodePelatihan;

  var lblPel = document.getElementById('tu-sert-label-pelatihan');
  var lblPeg = document.getElementById('tu-sert-label-pegawai');
  var bdgTgt = document.getElementById('tu-sert-badge-target');
  if (lblPel) lblPel.textContent = st ? st.nama : kodePelatihan;
  if (lblPeg) lblPeg.textContent = peg.nama + ' · ' + peg.jabatanLengkap + ' (' + pUnit + ')';
  if (bdgTgt) bdgTgt.textContent = st ? st.kategori : 'Pelatihan';

  var statusSelect = document.getElementById('tu-sert-status');
  var noInput = document.getElementById('tu-sert-nomor');
  var thnInput = document.getElementById('tu-sert-tahun');
  var expInput = document.getElementById('tu-sert-expired');
  var fileInput = document.getElementById('tu-sert-file-input');
  var fileLabel = document.getElementById('tu-sert-file-label');
  var existingBox = document.getElementById('tu-sert-existing-link');

  if (statusSelect) statusSelect.value = (cData && cData.status) ? cData.status : 'SUDAH_LULUS';
  if (noInput) noInput.value = (cData && cData.nomorSertifikat) ? cData.nomorSertifikat : '';
  if (thnInput) thnInput.value = (cData && cData.tahun) ? cData.tahun : new Date().getFullYear();
  if (expInput) expInput.value = (cData && cData.berlakuSampai) ? cData.berlakuSampai : '';
  if (fileInput) fileInput.value = '';

  if (fileLabel) {
    fileLabel.innerHTML = '<strong>Pilih File Dokumen atau Foto Sertifikat</strong><br>Format PDF, JPG, PNG (Maks 15 MB). Di HP dapat langsung membuka kamera.';
  }

  if (existingBox) {
    if (cData && cData.fileEvidenceUrl) {
      existingBox.classList.remove('n-hidden');
      existingBox.innerHTML = '<span style="color:var(--n-primary);">File Bukti Tersedia:</span> <a href="' + _esc(cData.fileEvidenceUrl) + '" target="_blank" style="color:var(--n-primary); text-decoration:underline;">Lihat Dokumen di Google Drive</a>';
    } else {
      existingBox.classList.add('n-hidden');
      existingBox.innerHTML = '';
    }
  }

  _msg('tu-sert-modal-msg', null);
  // Sembunyikan modal detail sementara agar modal sertifikat fokus di layer teratas
  var parentDetailModal = document.getElementById('modal-tu-pegawai-detail');
  if (parentDetailModal && !parentDetailModal.classList.contains('n-hidden')) {
    parentDetailModal.classList.add('n-hidden');
    _TU._parentModalBeforeSertifikat = 'modal-tu-pegawai-detail';
  }
  openModal('modal-tu-sertifikat');
}

function _tuHandleSertifikatFileChange(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;

  if (file.size > 15 * 1024 * 1024) {
    _msg('tu-sert-modal-msg', 'error', 'Ukuran file melebihi batas 15MB. Silakan pilih file yang lebih kecil.');
    event.target.value = '';
    return;
  }

  var label = document.getElementById('tu-sert-file-label');
  if (label) {
    var sizeKb = Math.round(file.size / 1024);
    label.innerHTML = '<strong style="color:var(--n-primary);">' + _esc(file.name) + '</strong><br>' + sizeKb + ' KB · Siap diunggah ke Google Drive';
  }

  var reader = new FileReader();
  reader.onload = function (e) {
    var raw = e.target.result;
    var base64 = raw.split(',')[1];
    _TU.sertifikatUploadFile = {
      name: file.name,
      type: file.type || 'application/pdf',
      base64: base64
    };
  };
  reader.readAsDataURL(file);
}

function _tuOnDocUpload(type, file) {
  if (!file) return;

  var pickerLblId = type === 'P3K' ? 'tu-p3k-picker-lbl' : (type === 'P3K_PW' ? 'tu-p3kpw-picker-lbl' : (type === 'PJLP' ? 'tu-pjlp-picker-lbl' : 'tu-magang-picker-lbl'));
  var pickerSubId = type === 'P3K' ? 'tu-p3k-picker-sub' : (type === 'P3K_PW' ? 'tu-p3kpw-picker-sub' : (type === 'PJLP' ? 'tu-pjlp-picker-sub' : 'tu-magang-picker-sub'));
  var ocrResId    = type === 'P3K' ? 'tu-p3k-ocr-result' : (type === 'P3K_PW' ? 'tu-p3kpw-ocr-result' : (type === 'PJLP' ? 'tu-pjlp-ocr-result' : 'tu-magang-ocr-result'));

  var lblEl = document.getElementById(pickerLblId);
  var subEl = document.getElementById(pickerSubId);
  var resEl = document.getElementById(ocrResId);

  var fSizeKb = Math.round(file.size / 1024);
  if (lblEl) lblEl.textContent = file.name + ' (' + fSizeKb + ' KB)';
  if (subEl) subEl.textContent = 'Membaca dokumen secara sistematis...';
  if (resEl) {
    resEl.style.display = 'block';
    resEl.innerHTML = '<span style="color:var(--n-primary); font-size:.75rem;">Sedang membaca teks dokumen secara otomatis…</span>';
  }

  var reader = new FileReader();
  reader.onload = function (ev) {
    var base64 = ev.target.result;
    if (!_TU) _TU = {};
    _TU.pendingDoc = {
      type: type,
      fileName: file.name,
      mimeType: file.type || 'application/pdf',
      base64: base64
    };

    // Jika scan gambar, jalankan OCR client-side untuk membaca teks secara penuh
    if (file.type && file.type.indexOf('image/') === 0) {
      var img = new Image();
      img.onload = function () {
        var origW = img.naturalWidth || img.width;
        var origH = img.naturalHeight || img.height;
        var scale = Math.min(1, 1600 / Math.max(origW, origH));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(origW * scale);
        canvas.height = Math.round(origH * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, origW, origH, 0, 0, canvas.width, canvas.height);

        _loadTesseract(function () {
          if (!window.Tesseract || typeof window.Tesseract.recognize !== 'function') {
            if (subEl) subEl.textContent = 'Berkas tersimpan & siap diunggah ke cloud.';
            if (resEl) resEl.innerHTML = '<span style="color:var(--n-text-muted); font-size:.75rem;">Berkas berhasil dilampirkan.</span>';
            return;
          }
          window.Tesseract.recognize(canvas, 'eng')
            .then(function (result) {
              var text = (result && result.data && result.data.text) || '';
              _tuApplyOcrExtractedData(type, text, resEl, subEl);
            })
            .catch(function (err) {
              console.warn('[Doc OCR] Gagal recognize:', err);
              if (subEl) subEl.textContent = 'Berkas tersimpan & siap diunggah ke cloud.';
              if (resEl) resEl.innerHTML = '<span style="color:var(--n-text-muted); font-size:.75rem;">Berkas berhasil dilampirkan.</span>';
            });
        });
      };
      img.src = base64;
    } else {
      // Berkas PDF
      if (subEl) subEl.textContent = 'Berkas PDF terlampir & siap diunggah ke cloud.';
      if (resEl) {
        resEl.innerHTML = '<div style="background:#ECFDF5; border:1px solid #A7F3D0; border-radius:6px; padding:6px 10px; font-size:.75rem; color:#065F46; display:flex; align-items:center; gap:6px;">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
          '<span>Berkas <strong>' + _esc(file.name) + '</strong> berhasil terlampir (akan diunggah ke Google Drive).</span>' +
        '</div>';
      }
    }
  };
  reader.readAsDataURL(file);
}

function _tuApplyOcrExtractedData(type, text, resEl, subEl) {
  if (!text) return;

  var noMatch = text.match(/(?:Nomor|No\.?|SPK|Keputusan|SK)[\s:.]*([A-Za-z0-9\/\-\.]+)/i);
  var extractedNo = noMatch ? noMatch[1].replace(/^[^\w]+|[^\w]+$/g, '') : '';

  var dateMatches = text.match(/\b(\d{1,2}[\s\-\/](?:Jan(?:uari)?|Feb(?:ruari)?|Mar(?:et)?|Apr(?:il)?|Mei|Jun(?:i)?|Jul(?:i)?|Agu(?:stus)?|Sep(?:tember)?|Okt(?:ober)?|Nov(?:ember)?|Des(?:ember)|\d{1,2})[\s\-\/]\d{4})\b/gi) || [];

  var infoList = [];
  if (extractedNo) infoList.push('No: ' + extractedNo);
  if (dateMatches.length > 0) infoList.push('Tgl: ' + dateMatches[0] + (dateMatches.length > 1 ? ' s.d ' + dateMatches[1] : ''));

  if (type === 'P3K') {
    var skInput = document.getElementById('tu-m-sk-p3k');
    if (skInput && extractedNo) skInput.value = extractedNo;
  } else if (type === 'P3K_PW') {
    var skpwInput = document.getElementById('tu-m-sk-p3kpw');
    if (skpwInput && extractedNo) skpwInput.value = extractedNo;
  } else if (type === 'PJLP') {
    var spkInput = document.getElementById('tu-m-spk-pjlp');
    if (spkInput && extractedNo) spkInput.value = extractedNo;
  } else if (type === 'MAGANG') {
    var docnoInput = document.getElementById('tu-m-docno-magang');
    if (docnoInput && extractedNo) docnoInput.value = extractedNo;
  }

  if (subEl) subEl.textContent = 'Sistem berhasil membaca isi dokumen.';
  if (resEl) {
    resEl.innerHTML = '<div style="background:#ECFDF5; border:1px solid #A7F3D0; border-radius:6px; padding:6px 10px; font-size:.75rem; color:#065F46; display:flex; align-items:center; gap:6px;">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
      '<span>Dokumen terbaca sistem: <strong>' + _esc(infoList.join(' · ') || 'Teks terdeteksi') + '</strong></span>' +
    '</div>';
  }
}

    nip = ((document.getElementById('tu-m-nip-pns') || {}).value || '').trim();
    tingkat = (document.getElementById('tu-m-golongan-pns') || {}).value || tingkat;
    if (!nip) {
      _msg(msgElId, 'error', 'NIP wajib diisi untuk pegawai PNS.');
      return;
    }
  } else if (statusPeg === 'P3K') {
    nip = ((document.getElementById('tu-m-nip-p3k') || {}).value || '').trim();
    noIdentitas = ((document.getElementById('tu-m-sk-p3k') || {}).value || '').trim();
    tingkat = (document.getElementById('tu-m-gol-p3k') || {}).value || tingkat;
    tglMulai = (document.getElementById('tu-m-mulai-p3k') || {}).value || '';
    tglSelesai = (document.getElementById('tu-m-selesai-p3k') || {}).value || '';
  } else if (statusPeg === 'P3K_PARUH_WAKTU') {
    noIdentitas = ((document.getElementById('tu-m-nik-p3k-pw') || {}).value || '').trim();
    var alokasiJam = ((document.getElementById('tu-m-jam-p3k-pw') || {}).value || '').trim();
    if (alokasiJam) catatan = (catatan ? catatan + ' | ' : '') + 'Alokasi: ' + alokasiJam;
    tglMulai = (document.getElementById('tu-m-mulai-p3k-pw') || {}).value || '';
    tglSelesai = (document.getElementById('tu-m-selesai-p3k-pw') || {}).value || '';
  } else if (statusPeg === 'PJLP') {
    noIdentitas = ((document.getElementById('tu-m-nik-pjlp') || {}).value || '').trim();
    subJenis = (document.getElementById('tu-m-bidang-pjlp') || {}).value || '';
    var noSpk = ((document.getElementById('tu-m-spk-pjlp') || {}).value || '').trim();
    if (noSpk) catatan = (catatan ? catatan + ' | ' : '') + 'No SPK: ' + noSpk;
    tglMulai = (document.getElementById('tu-m-mulai-pjlp') || {}).value || '';
    tglSelesai = (document.getElementById('tu-m-selesai-pjlp') || {}).value || '';
    if (!noIdentitas) {
      _msg(msgElId, 'error', 'NIK KTP wajib diisi untuk PJLP.');
      return;
    }
    kelompok = 'PJLP';
    tingkat = 'NON_JENJANG';
    if (!jabatan) jabatan = 'PJLP - ' + subJenis;
  } else if (statusPeg === 'MAGANG') {
    subJenis = (document.getElementById('tu-m-jenis-magang') || {}).value || 'Magang Mandiri (Mahasiswa)';
    noIdentitas = ((document.getElementById('tu-m-nim-magang') || {}).value || '').trim();
    asalKampus = ((document.getElementById('tu-m-institusi-magang') || {}).value || '').trim();
    var prodi = ((document.getElementById('tu-m-jurusan-magang') || {}).value || '').trim();
    mentor = ((document.getElementById('tu-m-mentor-magang') || {}).value || '').trim();
    tglMulai = (document.getElementById('tu-m-mulai-magang') || {}).value || '';
    tglSelesai = (document.getElementById('tu-m-selesai-magang') || {}).value || '';

    if (!asalKampus || !tglMulai || !tglSelesai) {
      _msg(msgElId, 'error', 'Asal Universitas/SMK, Tanggal Mulai, dan Tanggal Selesai Magang wajib diisi.');
      return;
    }
    kelompok = 'Non-Kompetensi';
    tingkat = 'NON_JENJANG';
    if (!jabatan) jabatan = 'Peserta ' + subJenis + ' (' + asalKampus + (prodi ? ' - ' + prodi : '') + ')';
  }

  if (!nama || !unit) {
    _msg(msgElId, 'error', 'Nama dan Unit Kerja wajib diisi.');
    return;
  }
  if (!kelompok && statusPeg !== 'MAGANG' && statusPeg !== 'PJLP') {
    _msg(msgElId, 'error', 'Kelompok Jabatan wajib dipilih.');
    return;
  }

  var payload = {
    pegawaiId: pid,
    nama: nama,
    nip: nip || '-',
    unitKerja: unit,
    statusKepegawaian: statusPeg,
    lingkupData: lingkup,
    kelompokJabatan: kelompok || (statusPeg === 'MAGANG' ? 'Non-Kompetensi' : 'PJLP'),
    tingkatKelas: tingkat || 'NON_JENJANG',
    jabatanLengkap: jabatan || kelompok,
    subJenisSDM: subJenis,
    nomorIdentitas: noIdentitas,
    institusiAsal: asalKampus,
    tanggalMulai: tglMulai,
    tanggalSelesai: tglSelesai,
    mentorPembimbing: mentor,
    catatanTambahan: catatan
  };

  if (_TU && _TU.pendingDoc && _TU.pendingDoc.base64) {
    payload.docFile = {
      fileName: _TU.pendingDoc.fileName,
      mimeType: _TU.pendingDoc.mimeType,
      base64: _TU.pendingDoc.base64
    };
  }

  _setLoading(btn, true);

  google.script.run
    .withSuccessHandler(function (res) {
      _setLoading(btn, false);
      if (!res || !res.success) {
        _msg(msgElId, 'error', (res && res.error) || 'Gagal menyimpan profil personel.');
        return;
      }
      closeModal('modal-tu-pegawai-master');
      _msg('tu-peg-dir-msg', 'success', res.message || 'Profil personel berhasil disimpan.');
      if (!_TU.pegawaiFilter) _TU.pegawaiFilter = {};
      if (payload && payload.nama) {
        var inpSearch = document.getElementById('tu-peg-search-input');
        if (inpSearch) inpSearch.value = payload.nama;
        _TU.pegawaiFilter.search = payload.nama.toLowerCase();
        _TU.pegawaiFilter.page = 1;
      }
      _tuLoadKompetensi(true);
      _tuLoadPegawai(true);
    })
    .withFailureHandler(function (err) {
      _setLoading(btn, false);
      _msg(msgElId, 'error', 'Terjadi kesalahan sistem.');
    })
    .tataUsaha_savePegawaiMaster(APP.token, payload);
}

function _formatRupiah(n) {
  return typeof _rupiah === 'function' ? _rupiah(n) : 'Rp ' + (n || 0);
}

function _tuLoadPaket(force) {
  var msg = document.getElementById('tu-paket-msg');
  if (msg) msg.innerHTML = '';
  var wrap = document.getElementById('tu-paket-table-wrap');
  if (wrap && (force || !_TU.paketData)) {
    wrap.innerHTML = _tableSkeleton(5, 6);
  }
  if (force || !_TU.paketData) {
    ['tu-paket-kpi-total', 'tu-paket-kpi-kontrak', 'tu-paket-kpi-progres', 'tu-paket-kpi-realisasi'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = '<span class="sk-bar sk-bar-md sk-w-50" style="display:inline-block; vertical-align:middle;"></span>';
    });
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.success) {
        if (wrap) wrap.innerHTML = '<div style="padding:24px; color:var(--n-crit); font-size:.875rem;">' +
          _esc((res && res.error) || 'Gagal memuat data paket pekerjaan.') + '</div>';
        return;
      }
      _TU.paketData = res.data;
      _tuRenderPaketKPI(res.data);
      _tuFilterPaket();
    })
    .withFailureHandler(function (err) {
      if (wrap) wrap.innerHTML = '<div style="padding:24px; color:var(--n-crit); font-size:.875rem;">' +
        'Koneksi gagal saat memuat data paket pekerjaan.</div>';
    })
    .tataUsaha_getPaket(APP.token, APP.filter);
}

function _tuRenderPaketKPI(d) {
  d = d || {};
  var elTotal = document.getElementById('tu-paket-kpi-total');
  var elKontrak = document.getElementById('tu-paket-kpi-kontrak');
  var elProgres = document.getElementById('tu-paket-kpi-progres');
  var elRealisasi = document.getElementById('tu-paket-kpi-realisasi');
  var elBadge = document.getElementById('tu-paket-badge-total');

  if (elTotal) elTotal.textContent = (d.totalPaket || 0) + ' paket';
  if (elKontrak) elKontrak.textContent = _formatRupiah(d.totalNilaiKontrak || 0);
  if (elProgres) elProgres.textContent = (d.avgProgresFisik || 0) + '%';
  if (elRealisasi) elRealisasi.textContent = _formatRupiah(d.totalRealisasiKeu || 0);
  if (elBadge) elBadge.textContent = (d.totalPaket || 0) + ' paket';

  // Kalkulasi & perbarui live counter di tiap kartu tahapan workflow pipeline (Opsi 2)
  var counts = {
    ALL: 0,
    PERSIAPAN: 0,
    PEMILIHAN: 0,
    KONTRAK: 0,
    PELAKSANAAN: 0,
    BAST: 0,
    SELESAI: 0
  };
  var items = (d && d.items) || (_TU.paketData && _TU.paketData.items) || [];
  items.forEach(function (it) {
    if (it.status === 'VOID') return;
    counts.ALL++;
    if (counts[it.tahap] !== undefined) {
      counts[it.tahap]++;
    }
  });

  Object.keys(counts).forEach(function (key) {
    var el = document.getElementById('tu-pkt-count-' + key);
    if (el) {
      el.textContent = counts[key] + ' paket';
    }
  });
}

function _tuSelectPaketTahap(tahap) {
  tahap = tahap || 'ALL';
  var selTahap = document.getElementById('tu-paket-filter-tahap');
  if (selTahap) {
    selTahap.value = tahap;
  }
  _tuUpdatePipelineActive(tahap);
  _tuFilterPaket();
}

function _tuUpdatePipelineActive(tahap) {
  tahap = tahap || 'ALL';
  var steps = document.querySelectorAll('#tu-paket-pipeline-stepper .pipeline-step');
  steps.forEach(function (step) {
    if (step.getAttribute('data-tahap') === tahap) {
      step.classList.add('active');
    } else {
      step.classList.remove('active');
    }
  });

  var resetBtn = document.getElementById('tu-pkt-reset-filter');
  if (resetBtn) {
    if (tahap === 'ALL') {
      resetBtn.style.opacity = '0.5';
      resetBtn.style.pointerEvents = 'none';
    } else {
      resetBtn.style.opacity = '1';
      resetBtn.style.pointerEvents = 'auto';
    }
  }
}

function _tuSetPaketSeg(status) {
  _TU.paketSeg = status || 'ALL';
  var btns = document.querySelectorAll('.tu-paket-seg-btn');
  btns.forEach(function (b) {
    if (b.getAttribute('data-paket-status') === _TU.paketSeg) {
      b.classList.add('active');
    } else {
      b.classList.remove('active');
    }
  });
  _tuFilterPaket();
}

function _tuFilterPaket() {
  if (!_TU.paketData || !_TU.paketData.items) return;
  var selTahap = document.getElementById('tu-paket-filter-tahap');
  var searchInput = document.getElementById('tu-paket-search');
  var tahap = selTahap ? selTahap.value : 'ALL';
  var statusSeg = _TU.paketSeg || 'ALL';
  var q = searchInput ? searchInput.value.toLowerCase().trim() : '';

  _tuUpdatePipelineActive(tahap);

  var items = _TU.paketData.items.filter(function (it) {
    if (statusSeg === 'AKTIF' && it.tahap === 'SELESAI') return false;
    if (statusSeg === 'SELESAI' && it.tahap !== 'SELESAI') return false;
    if (tahap !== 'ALL' && it.tahap !== tahap) return false;
    if (q) {
      var match = (it.namaPaket && it.namaPaket.toLowerCase().indexOf(q) !== -1) ||
                  (it.rekanan && it.rekanan.toLowerCase().indexOf(q) !== -1) ||
                  (it.noKontrak && it.noKontrak.toLowerCase().indexOf(q) !== -1) ||
                  (it.divisiId && it.divisiId.toLowerCase().indexOf(q) !== -1);
      if (!match) return false;
    }
    return true;
  });

  _tuRenderPaketTable(items);
}

function _tuRenderPaketTable(items) {
  var wrap = document.getElementById('tu-paket-table-wrap');
  if (!wrap) return;

  if (!items || items.length === 0) {
    wrap.innerHTML = '<div style="padding:32px; text-align:center; color:var(--n-text-muted); font-size:.875rem;">' +
      'Tidak ada data paket pekerjaan yang sesuai filter.</div>';
    return;
  }

  var stageBadges = {
    'PERSIAPAN':    '<span class="badge" style="background:rgba(100,116,139,0.12); color:#475569;">1. Persiapan</span>',
    'PEMILIHAN':    '<span class="badge" style="background:rgba(245,158,11,0.12); color:#d97706;">2. Pemilihan</span>',
    'KONTRAK':      '<span class="badge" style="background:rgba(4,120,87,0.12); color:#047857;">3. Kontrak</span>',
    'PELAKSANAAN':  '<span class="badge" style="background:rgba(99,102,241,0.12); color:#4f46e5;">4. Pelaksanaan</span>',
    'BAST':         '<span class="badge" style="background:rgba(13,148,136,0.12); color:#0d9488;">5. BAST</span>',
    'SELESAI':      '<span class="badge" style="background:rgba(16,185,129,0.12); color:#059669;">6. Selesai</span>'
  };

  var divisiLabels = {
    'DIV-TU': 'Subbag TU',
    'DIV-OPS': 'Operasi',
    'DIV-RAWAT': 'Perawatan',
    'DIV-LOG': 'Logistik',
    'DIV-PANTAU': 'Pemantauan',
    'DIV-INTEL': 'Intelijen',
    'DIV-AWAK': 'Pengawakan'
  };

  var canVoid = APP.user && (APP.user.role === 'ADMIN_POA' || (APP.user.role === 'PENGINPUT' && APP.user.divisiId === 'DIV-TU'));

  var h = '<table class="n-table" style="width:100%;">' +
    '<thead>' +
      '<tr>' +
        '<th>Paket &amp; Divisi</th>' +
        '<th>Tahap</th>' +
        '<th>Rekanan &amp; No. Kontrak</th>' +
        '<th style="text-align:right;">Nilai Kontrak</th>' +
        '<th style="width:130px;">Progres Fisik</th>' +
        '<th style="text-align:right;">Realisasi Keu</th>' +
        '<th>Evidence</th>' +
        '<th style="text-align:center;">Aksi</th>' +
      '</tr>' +
    '</thead>' +
    '<tbody>';

  items.forEach(function (it) {
    var isVoid = it.status === 'VOID';
    var badgeTahap = stageBadges[it.tahap] || ('<span class="badge">' + _esc(it.tahap) + '</span>');
    var divLabel = divisiLabels[it.divisiId] || it.divisiId;
    var pct = Math.min(Math.max(Number(it.progresFisik) || 0, 0), 100);

    var evBtn = it.evidenceUrl
      ? '<a href="' + _esc(it.evidenceUrl) + '" target="_blank" rel="noopener noreferrer" class="btn-ghost" style="padding:4px 8px; font-size:.75rem;" title="Buka Dokumen">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>' +
            '<polyline points="15 3 21 3 21 9"></polyline>' +
            '<line x1="10" y1="14" x2="21" y2="3"></line>' +
          '</svg> Link' +
        '</a>'
      : '<span style="color:var(--n-text-muted); font-size:.75rem;">—</span>';

    var rowStyle = isVoid ? 'opacity:0.5; text-decoration:line-through;' : '';

    h += '<tr style="' + rowStyle + '">' +
      '<td>' +
        '<div style="font-weight:600; color:var(--n-text-primary);">' + _esc(it.namaPaket) + '</div>' +
        '<div style="font-size:.75rem; color:var(--n-text-muted);">' + _esc(divLabel) + (it.periode ? ' &bull; ' + _esc(it.periode) : '') + '</div>' +
      '</td>' +
      '<td>' + badgeTahap + (isVoid ? ' <span class="badge" style="background:#fee2e2; color:#b91c1c;">VOID</span>' : '') + '</td>' +
      '<td>' +
        '<div style="font-size:.8125rem; font-weight:500;">' + _esc(it.rekanan || '—') + '</div>' +
        '<div style="font-size:.75rem; color:var(--n-text-muted); font-family:monospace;">' + _esc(it.noKontrak || '—') + '</div>' +
      '</td>' +
      '<td style="text-align:right;" class="tnum font-medium">' + _formatRupiah(it.nilaiKontrak) + '</td>' +
      '<td>' +
        '<div style="display:flex; justify-content:space-between; font-size:.75rem; margin-bottom:2px;" class="tnum">' +
          '<span>' + pct + '%</span>' +
