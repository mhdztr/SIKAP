  function _bmnHandlePhotoFile(e) {
    var file = (e && e.target && e.target.files && e.target.files[0]) || (e instanceof File ? e : null);
    if (!file) return;

    _msg('bmn-form-msg', null);
    // Reset data geotagging lama agar foto yang baru dipilih selalu dipindai ulang
    _bmnResetGeotag();

    // Kompresi kanvas (max-width 1600px, JPEG 0.8) untuk payload & pratinjau thumbnail
    _compressImageCanvas(file, 1600, 0.8, function (res) {
      if (res && res.b64) {
        _BMN.currentPhoto = {
          dataBase64: res.b64,
          fileName: res.name,
          mimeType: res.mime
        };
        var img = document.getElementById('bmn-photo-preview-img');
        var ph = document.getElementById('bmn-photo-placeholder');
        var clr = document.getElementById('bmn-photo-clear-btn');
        if (img) {
          img.src = 'data:' + res.mime + ';base64,' + res.b64;
          img.style.display = 'block';
        }
        if (ph) ph.style.display = 'none';
        if (clr) clr.style.display = 'block';
      }
    });

    // TAHAP 1: Ekstraksi koordinat GPS murni native dari raw file (Zero-Dependency)
    if (window.FileReader) {
      var rawReader = new FileReader();
      rawReader.onload = function (ev) {
        var buffer = ev.target.result;
        var nativeGps = _bmnParseExifGpsFromArrayBuffer(buffer);
        if (nativeGps && typeof nativeGps.latitude === 'number' && typeof nativeGps.longitude === 'number') {
          _bmnApplyCoordinates(nativeGps.latitude, nativeGps.longitude, 'EXIF_FOTO');
          _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + nativeGps.latitude.toFixed(5) + ', ' + nativeGps.longitude.toFixed(5) + ') dan Lokasi UPT berhasil diekstraksi dari metadata EXIF foto.');
          return;
        }

        // TAHAP 2: Jika native belum menemukan, coba library exifr
        _loadExifr(function () {
          if (window.exifr && typeof window.exifr.gps === 'function') {
            window.exifr.gps(file)
              .then(function (gps) {
                if (gps && typeof gps.latitude === 'number' && typeof gps.longitude === 'number' && !isNaN(gps.latitude) && !isNaN(gps.longitude)) {
                  _bmnApplyCoordinates(gps.latitude, gps.longitude, 'EXIF_FOTO');
                  _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + gps.latitude.toFixed(5) + ', ' + gps.longitude.toFixed(5) + ') dan Lokasi UPT berhasil diekstraksi dari metadata EXIF foto.');
                } else {
                  _bmnHandleNoExifGps(file);
                }
              })
              .catch(function (err) {
                console.warn('[exifr.gps] Gagal membaca EXIF:', err);
                _bmnHandleNoExifGps(file);
              });
          } else {
            _bmnHandleNoExifGps(file);
          }
        });
      };
      rawReader.onerror = function () {
        _bmnHandleNoExifGps(file);
      };
      rawReader.readAsArrayBuffer(file);
    } else {
      _bmnHandleNoExifGps(file);
    }
  }

  function _bmnHandleNoExifGps(file) {
    // Fallback pemindaian visual stempel koordinat / alamat / UPT pada foto (OCR Multi-Region Otomatis)
    if (file) {
      _msg('bmn-form-msg', 'info', 'Metadata EXIF tidak ditemukan. Memindai visual stempel geotagging pada foto (OCR)...');
      _bmnScanWatermarkOcr(file, function (coords) {
        var uptList = (_BMN.masters && _BMN.masters.uptList && _BMN.masters.uptList.length) ? _BMN.masters.uptList : _BMN_DEFAULT_UPTS;

        if (coords && typeof coords.latitude === 'number' && typeof coords.longitude === 'number' && !isNaN(coords.latitude) && !isNaN(coords.longitude)) {
          _bmnApplyCoordinates(coords.latitude, coords.longitude, 'OCR_STEMPEL', false, coords.locationHint, coords.addressDetail);
          _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + coords.latitude.toFixed(5) + ', ' + coords.longitude.toFixed(5) + ') dan Lokasi UPT berhasil diekstraksi dari foto (OCR).');
        } else if (coords && (coords.locationHint || coords.uptId)) {
          // Lokasi terdeteksi dari nama/alias kota/UPT pada teks foto
          var matchedUpt = null;
          for (var i = 0; i < uptList.length; i++) {
            if ((coords.uptId && uptList[i].lokasiId === coords.uptId) ||
              (coords.locationHint && uptList[i].namaLokasi.indexOf(coords.locationHint) !== -1) ||
              (coords.locationHint && coords.locationHint.indexOf(uptList[i].namaLokasi) !== -1)) {
              matchedUpt = uptList[i];
              break;
            }
          }
          if (!matchedUpt) matchedUpt = uptList[0];

          _bmnApplyCoordinates(matchedUpt.latitude, matchedUpt.longitude, 'OCR_STEMPEL', false, coords.locationHint || matchedUpt.namaLokasi, coords.addressDetail);
          _msg('bmn-form-msg', 'success', 'Lokasi ' + (coords.locationHint || matchedUpt.namaLokasi) + ' berhasil dideteksi dari foto (OCR) dan otomatis diset.');
        } else {
          _msg('bmn-form-msg', 'warning', 'Teks lokasi/koordinat tidak terdeteksi pada foto. Mengambil lokasi perangkat...');
          _bmnTriggerDeviceGeolocation(true);
        }
      });
    } else {
      _msg('bmn-form-msg', 'warning', 'Foto tidak mengandung metadata GPS EXIF. Mengambil lokasi perangkat...');
      _bmnTriggerDeviceGeolocation(true);
    }
  }

  function _bmnTriggerDeviceGeolocation(isAutoFallback) {
    var btn = document.getElementById('bmn-btn-device-gps');
    if (btn) btn.disabled = true;

    if (!navigator.geolocation) {
      if (btn) btn.disabled = false;
      _bmnApplyHomebaseFallback('Browser tidak mendukung geolokasi');
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        if (btn) btn.disabled = false;
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        _bmnApplyCoordinates(lat, lon, 'GPS_PERANGKAT');
        _msg('bmn-form-msg', 'success', 'Koordinat GPS (' + lat.toFixed(5) + ', ' + lon.toFixed(5) + ') berhasil diambil dari perangkat pengunggah.');
      },
      function (err) {
        if (btn) btn.disabled = false;
        var reason = 'Sinyal GPS perangkat tidak terdeteksi';
        if (err.code === 1) reason = 'Izin akses GPS perangkat ditolak';
        else if (err.code === 2) reason = 'Posisi perangkat tidak tersedia';
        else if (err.code === 3) reason = 'Waktu permintaan lokasi habis (timeout)';

        _bmnApplyHomebaseFallback(reason);
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  }

  function _bmnApplyHomebaseFallback(reason) {
    var uptList = (_BMN.masters && _BMN.masters.uptList) || [];
    if (!uptList.length) return;

    var selUptId = (document.getElementById('bmn-form-upt') || {}).value;
    var targetUpt = null;

    if (selUptId) {
      for (var i = 0; i < uptList.length; i++) {
        if (uptList[i].lokasiId === selUptId && uptList[i].latitude !== null && uptList[i].longitude !== null) {
          targetUpt = uptList[i];
          break;
        }
      }
    }

    if (!targetUpt) {
      for (var j = 0; j < uptList.length; j++) {
        if (uptList[j].lokasiId === 'UPT-PUSAT-POA') {
          targetUpt = uptList[j];
          break;
        }
      }
    }
    if (!targetUpt) targetUpt = uptList[0];

    if (targetUpt && targetUpt.latitude !== null && targetUpt.longitude !== null) {
      _bmnApplyCoordinates(targetUpt.latitude, targetUpt.longitude, 'PROFIL_AKUN');
      _msg('bmn-form-msg', 'warning', 'Fallback Lokasi: ' + reason + '. Menggunakan koordinat referensi homebase ' + targetUpt.namaLokasi + '.');
    }
  }

  function _bmnIsVehicleAsset(kodeBarang, kodeKategori, namaBarang) {
    kodeBarang = String(kodeBarang || '').replace(/\./g, '').trim();
    kodeKategori = String(kodeKategori || '').toUpperCase().trim();
    namaBarang = String(namaBarang || '').toLowerCase();

    if (kodeKategori === 'KAT-KENDARAAN') return true;
    if (kodeBarang.indexOf('30101') === 0 || kodeBarang.indexOf('30201') === 0) return true;
    if (namaBarang.indexOf('mobil') !== -1 ||
      namaBarang.indexOf('motor') !== -1 ||
      namaBarang.indexOf('kendaraan') !== -1 ||
      namaBarang.indexOf('truk') !== -1 ||
      namaBarang.indexOf('avanza') !== -1 ||
      namaBarang.indexOf('innova') !== -1 ||
      namaBarang.indexOf('hilux') !== -1 ||
      namaBarang.indexOf('fortuner') !== -1 ||
      namaBarang.indexOf('pajero') !== -1) {
      return true;
    }
    return false;
  }

  function _bmnTodayIso() {
    var d = new Date();
    var yyyy = d.getFullYear();
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return yyyy + '-' + mm + '-' + dd;
  }

  function _bmnValidateSaneDate(isoStr, minYear, maxYear) {
    var s = String(isoStr || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var parts = s.split('-').map(Number);
    var y = parts[0], m = parts[1], day = parts[2];
    if (y < minYear || y > maxYear || m < 1 || m > 12 || day < 1 || day > 31) return false;
    var dt = new Date(y, m - 1, day);
    return dt.getFullYear() === y && dt.getMonth() === (m - 1) && dt.getDate() === day;
  }

  function _bmnSubmitForm() {
    var btn = document.getElementById('bmn-btn-save');
    var msgElId = 'bmn-form-msg';
    _msg(msgElId, null);

    var asetId = (document.getElementById('bmn-form-aset-id') || {}).value || null;
    var kode = ((document.getElementById('bmn-form-kode') || {}).value || '').trim();
    var nup = ((document.getElementById('bmn-form-nup') || {}).value || '').trim();
    var penc = (document.getElementById('bmn-form-pencatatan') || {}).value || 'BUKU';
    var nama = ((document.getElementById('bmn-form-nama') || {}).value || '').trim();
    var kat = (document.getElementById('bmn-form-kategori') || {}).value || '';
    var merek = ((document.getElementById('bmn-form-merek') || {}).value || '').trim();
    var tgl = (document.getElementById('bmn-form-tgl') || {}).value || '';
    var kond = (document.getElementById('bmn-form-kondisi') || {}).value || 'BAIK';
    var np = Number((document.getElementById('bmn-form-np') || {}).value) || 0;
    var nb = Number((document.getElementById('bmn-form-nb') || {}).value) || 0;
    var upt = (document.getElementById('bmn-form-upt') || {}).value || '';
    var ruang = ((document.getElementById('bmn-form-ruangan') || {}).value || '').trim();
    var kapal = (document.getElementById('bmn-form-kapal') || {}).value || '';
    var ket = ((document.getElementById('bmn-form-ket') || {}).value || '').trim();

    // Field Kendaraan & STNK
    var seksiKnd = document.getElementById('bmn-form-seksi-kendaraan');
    var isKend = seksiKnd && seksiKnd.style.display !== 'none';
    var noPol = ((document.getElementById('bmn-form-nopol') || {}).value || '').trim().toUpperCase();
    var tglPajak = (document.getElementById('bmn-form-tgl-pajak') || {}).value || '';
    var tglStnk = (document.getElementById('bmn-form-tgl-stnk') || {}).value || '';
    var stnkVer = (document.getElementById('bmn-form-stnk-verified') || {}).checked ? 'YA' : 'TIDAK';
    var fotoStnkEvId = (document.getElementById('bmn-form-foto-stnk-evidence-id') || {}).value || '';

    // Field Geotagging & Bukti Foto
    var latRaw = (document.getElementById('bmn-form-lat') || {}).value;
    var lonRaw = (document.getElementById('bmn-form-lon') || {}).value;
    var lat = (latRaw !== '' && latRaw !== undefined && latRaw !== null) ? parseFloat(latRaw) : null;
    var lon = (lonRaw !== '' && lonRaw !== undefined && lonRaw !== null) ? parseFloat(lonRaw) : null;
    var sumberLok = (document.getElementById('bmn-form-sumber-lokasi') || {}).value || 'MANUAL';
    var jarakKm = parseFloat((document.getElementById('bmn-form-jarak-upt') || {}).value) || null;
    var fotoEvId = (document.getElementById('bmn-form-foto-evidence-id') || {}).value || '';

    var kodeClean = kode.replace(/\./g, '').trim();
    var todayIso = _bmnTodayIso();
    var curYr = new Date().getFullYear();

    if (!kode || !nup || !nama) {
      _msg(msgElId, 'error', 'Kode Barang, NUP, dan Nama Barang wajib diisi.');
      return;
    }
    if (!/^\d{10}$/.test(kodeClean)) {
      _msg(msgElId, 'error', 'Kode Barang BMN wajib terdiri dari 10 digit angka (mis. 3050104001).');
      return;
    }
    if (!/^\d+$/.test(nup) || parseInt(nup, 10) < 1) {
      _msg(msgElId, 'error', 'NUP wajib berupa angka bulat positif minimal 1.');
      return;
    }
    if (!tgl || !_bmnValidateSaneDate(tgl, 1945, curYr) || tgl > todayIso) {
      _msg(msgElId, 'error', 'Tanggal Perolehan tidak valid atau berada di masa depan.');
      return;
    }
    if (!isFinite(np) || np <= 0) {
      _msg(msgElId, 'error', 'Nilai Perolehan wajib lebih besar dari Rp 0.');
      return;
    }
    if (!isFinite(nb) || nb < 0) {
      _msg(msgElId, 'error', 'Nilai Buku tidak boleh bernilai negatif.');
      return;
    }
    if (nb > np) {
      _msg(msgElId, 'error', 'Nilai Buku tidak masuk akal karena melebihi Nilai Perolehan.');
      return;
    }
    if (!upt) {
      _msg(msgElId, 'error', 'Lokasi UPT penempatan wajib dipilih.');
      return;
    }
    if (lat !== null && (isNaN(lat) || lat < -90 || lat > 90 || lon === null || isNaN(lon) || lon < -180 || lon > 180)) {
      _msg(msgElId, 'error', 'Koordinat GPS tidak berada dalam rentang Latitude/Longitude yang sah.');
      return;
    }
    if (isKend && noPol) {
      if (!/^[A-Z]{1,2}\s?\d{1,4}\s?[A-Z]{0,3}$/.test(noPol) || !/\d/.test(noPol)) {
        _msg(msgElId, 'error', 'Format Nomor Polisi tidak valid (contoh yang benar: B 1042 PQA).');
        return;
      }
      if (!tglPajak || !_bmnValidateSaneDate(tglPajak, 2000, curYr + 6)) {
        _msg(msgElId, 'error', 'Tanggal Jatuh Tempo Pajak Tahunan wajib diisi dengan tahun wajar (2000 s/d ' + (curYr + 6) + ').');
        return;
      }
      if (tglStnk && !_bmnValidateSaneDate(tglStnk, 2000, curYr + 10)) {
        _msg(msgElId, 'error', 'Tanggal Jatuh Tempo STNK 5 Tahunan tidak berada pada rentang tahun wajar.');
        return;
      }
    }

    _setLoading(btn, true);

    google.script.run
      .withSuccessHandler(function (res) {
        _setLoading(btn, false);
        if (!res.success) {
          _msg(msgElId, 'error', res.error || 'Gagal menyimpan aset.');
          return;
        }
        _bmnSwitchView('list');
        _tuLoadBMN(true);
        _msg('bmn-table-msg', 'success', res.message || 'Data aset BMN berhasil disimpan.');
      })
      .withFailureHandler(function (err) {
        _setLoading(btn, false);
        _msg(msgElId, 'error', 'Terjadi kesalahan sistem saat menyimpan.');
      })
      .bmn_submitAset(APP.token, {
        asetId: asetId,
        kodeBarang: kode,
        nup: nup,
        kategoriPencatatan: penc,
        namaBarang: nama,
        kodeKategori: kat,
        merekTipe: merek,
        tanggalPerolehan: tgl,
        kondisi: kond,
        nilaiPerolehan: np,
        nilaiBuku: nb,
        lokasiId: upt,
        lokasiDetailRuangan: ruang,
        kapalId: kapal,
        keterangan: ket,
        latitude: lat,
        longitude: lon,
        sumberLokasi: sumberLok,
        jarakKm: jarakKm,
        fotoEvidenceId: fotoEvId,
        photoPayload: _BMN.currentPhoto || null,
        noPolisi: noPol,
        tglPajakTahunan: tglPajak,
        tglStnkLimaTahunan: tglStnk,
        stnkVerified: stnkVer,
        fotoStnkEvidenceId: fotoStnkEvId,
        stnkPayload: _BMN.currentStnkPhoto || null
      });
  }

  var _SHEETJS_LOADED = false;
  var _sheetjsQueue = [];

  function _loadSheetJS(cb) {
    if (typeof XLSX !== 'undefined' || _SHEETJS_LOADED) {
      if (cb) { try { cb(); } catch (e) { console.error(e); } }
      return;
    }
    if (cb) _sheetjsQueue.push(cb);
    if (document.getElementById('sheetjs-cdn')) return;

    var script = document.createElement('script');
    script.id = 'sheetjs-cdn';
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    script.onload = function () {
      _SHEETJS_LOADED = true;
      var q = _sheetjsQueue.slice();
      _sheetjsQueue = [];
      q.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
    };
    script.onerror = function () {
      console.warn('Gagal memuat SheetJS dari cdn.sheetjs.com, mencoba fallback unpkg...');
      var fallback = document.createElement('script');
      fallback.id = 'sheetjs-cdn-fallback';
      fallback.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
      fallback.onload = function () {
        _SHEETJS_LOADED = true;
        var q = _sheetjsQueue.slice();
        _sheetjsQueue = [];
        q.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
      };
      fallback.onerror = function () {
        console.error('Gagal memuat SheetJS dari seluruh CDN.');
        _sheetjsQueue = [];
      };
      document.head.appendChild(fallback);
    };
    document.head.appendChild(script);
  }

    tahap = String(tahap || '').toUpperCase();
    if (tahap === 'DRAFT_USULAN') {

    } else if (tahap === 'SURAT_USULAN') {
      return '<span class="n-badge n-badge-subtle n-badge-primary">Surat Usulan</span>';
    } else if (tahap === 'PERSETUJUAN_KEMENKEU') {
      return '<span class="n-badge n-badge-subtle n-badge-warn">Persetujuan DJKN</span>';
    } else if (tahap === 'SK_PENGHAPUSAN') {
      return '<span class="n-badge n-badge-subtle n-badge-primary">SK Penghapusan</span>';
    } else if (tahap === 'BAST_SELESAI') {
      return '<span class="n-badge n-badge-subtle n-badge-ok">BAST Selesai (Dihapus)</span>';
    } else if (tahap === 'DITOLAK') {
      return '<span class="n-badge n-badge-subtle n-badge-crit">Ditolak</span>';
    } else if (tahap === 'VOID') {
      return '<span class="n-badge n-badge-subtle n-badge-crit">Dianulir (Batal)</span>';

    return '<span class="n-badge n-badge-subtle">' + _esc(tahap) + '</span>';

  function _bmnRenderPenghapusanList(list) {
    var totalCount = list.length;
    var prosesCount = 0;
    var skCount = 0;
    var selesaiCount = 0;
    var selesaiUnit = 0;
    var totalBukuSelesai = 0;

    list.forEach(function (h) {
      var th = String(h.tahap || '');
      if (th === 'BAST_SELESAI') {
        selesaiCount++;
        selesaiUnit += (Number(h.totalUnit) || 0);
        totalBukuSelesai += (Number(h.totalNilaiBuku) || 0);
      } else if (th === 'SK_PENGHAPUSAN') {
        skCount++;
      } else if (th !== 'DITOLAK' && th !== 'VOID') {
        prosesCount++;
      }
    });

    var elKpiTotal = document.getElementById('bmn-hps-kpi-total');
    var elKpiProses = document.getElementById('bmn-hps-kpi-proses');
    var elKpiSk = document.getElementById('bmn-hps-kpi-sk');
    var elKpiSelesai = document.getElementById('bmn-hps-kpi-selesai');
    var elKpiSelesaiSub = document.getElementById('bmn-hps-kpi-selesai-sub');
    var elKpiBuku = document.getElementById('bmn-hps-kpi-buku');
    var elBadgeTotal = document.getElementById('bmn-hps-badge-total');

    if (elKpiTotal) elKpiTotal.textContent = totalCount + ' berkas';
    if (elKpiProses) elKpiProses.textContent = prosesCount + ' berkas';
    if (elKpiSk) elKpiSk.textContent = skCount + ' berkas';
    if (elKpiSelesai) elKpiSelesai.textContent = selesaiUnit + ' unit';
    if (elKpiSelesaiSub) elKpiSelesaiSub.textContent = _rupiah(totalBukuSelesai) + ' (Nilai Buku)';
    if (elKpiBuku) elKpiBuku.textContent = _rupiah(totalBukuSelesai);
    if (elBadgeTotal) elBadgeTotal.textContent = totalCount + ' berkas';

    _BMN_HPS.allItems = list;
    _simanpoaRenderDocDisposalHist(list);

    var wrap = document.getElementById('bmn-hps-table-wrap');
    if (!wrap) return;

    if (list.length === 0) {
      wrap.innerHTML = '<div style="padding:48px 24px; text-align:center; color:var(--n-text-muted); font-size:.875rem;">' +
        'Tidak ada berkas usulan penghapusan yang sesuai dengan filter.' +
        '</div>';
      return;

    var isAuthorizedAnulir = APP.user && (
      APP.user.role === 'SUPERADMIN' ||

      (APP.user.role === 'KADIV' && APP.user.divisiId === 'DIV-TU')
    );

    var html = '<table class="n-table" style="width:100%;">';

      '<th style="width:130px;">Alasan</th>' +

      '<th style="width:140px; text-align:right;">Nilai Buku</th>' +
      '<th style="width:140px; text-align:center;">Aksi</th>' +
      '</tr></thead><tbody>';

    list.forEach(function (h) {
      var docInfo = [];
      if (h.nomorSuratUsulan) docInfo.push('Surat: ' + _esc(h.nomorSuratUsulan));
      if (h.nomorSuratPersetujuan) docInfo.push('Persetujuan: ' + _esc(h.nomorSuratPersetujuan));
      if (h.nomorSK) docInfo.push('SK: ' + _esc(h.nomorSK));
      var docSummary = docInfo.length > 0 ? docInfo.join('<br>') : '<span style="color:var(--n-text-muted); font-size:.75rem;">Belum ada surat</span>';

      var canVoid = isAuthorizedAnulir && h.tahap !== 'BAST_SELESAI' && h.tahap !== 'VOID';

      var hpsEsc = _esc(h.penghapusanId).replace(/'/g, "\\'");
      html += '<tr class="n-row-clickable" tabindex="0" onclick="_rowSafeClick(event, function(){ _bmnOpenDetailHapusModal(\'' + hpsEsc + '\'); })">' +
        '<td>' +

        '<div style="font-size:.72rem; color:var(--n-text-muted);">' + _esc(h.timestamp ? String(h.timestamp).substring(0, 10) : '') + '</div>' +
        '</td>' +
        '<td>' +
        '<div style="font-weight:600;">' + _bmnGetAlasanLabel(h.alasanPenghapusan) + '</div>' +

  function _simanpoaRenderDocDisposalHist(sourceList) {
    var docTbody = document.getElementById('simanpoa-tbody-docdisposal-hist');
    if (!docTbody) return;
    var list = sourceList || [];
    var q = ((document.getElementById('simanpoa-docdisposal-search') || {}).value || '').toLowerCase().trim();
    if (q) {
      list = list.filter(function (h) {
        return String(h.nomorSK || '').toLowerCase().indexOf(q) !== -1 ||
          String(h.nomorSuratPersetujuan || '').toLowerCase().indexOf(q) !== -1 ||
          String(h.nomorSuratUsulan || '').toLowerCase().indexOf(q) !== -1 ||
          String(h.penghapusanId || '').toLowerCase().indexOf(q) !== -1 ||
          String(h.keterangan || '').toLowerCase().indexOf(q) !== -1 ||
          String(_bmnGetAlasanLabel(h.alasanPenghapusan) || '').toLowerCase().indexOf(q) !== -1 ||
          String(h.tahap || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    if (list.length === 0) {
      docTbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:24px; color:var(--n-text-muted);">' +
        (q ? 'Tidak ada dokumen penghapusan yang cocok dengan pencarian.' : 'Belum ada riwayat eksekusi dokumen SK Penghapusan atau BAST.') +
        '</td></tr>';
      return;
    }
    var docHtml = '';
    list.forEach(function (h) {
      var noDok = h.nomorSK || h.nomorSuratPersetujuan || h.nomorSuratUsulan || h.penghapusanId;
      var tglDok = h.tanggalSK || h.tanggalPersetujuan || h.tanggalSuratUsulan || (h.timestamp ? String(h.timestamp).substring(0, 10) : '-');
      var ketDok = h.keterangan || h.alasanPenghapusan || '-';
      var hpsEsc = _esc(h.penghapusanId).replace(/'/g, "\\'");
      docHtml += '<tr class="n-row-clickable" tabindex="0" onclick="_rowSafeClick(event, function(){ _bmnOpenDetailHapusModal(\'' + hpsEsc + '\'); })">' +
        '<td><strong class="tnum">' + _esc(noDok) + '</strong><div style="font-size:0.7rem; color:var(--n-text-muted);">' + _esc(h.penghapusanId) + '</div></td>' +
        '<td>' + _esc(_bmnGetAlasanLabel(h.alasanPenghapusan)) + '</td>' +
        '<td class="tnum">' + _esc(tglDok) + '</td>' +
        '<td>' + _esc(ketDok) + '</td>' +
        '<td class="tnum" style="text-align:right; font-weight:600;">' + _formatNumber(h.totalUnit || 0) + ' unit</td>' +
        '<td class="tnum" style="text-align:right; font-weight:600;">' + _formatRupiah(h.totalNilaiBuku || 0) + '</td>' +
        '<td>' + _bmnGetTahapBadge(h.tahap) + '</td>' +
        '</tr>';
    });
    docTbody.innerHTML = docHtml;
  }

  function _bmnRenderEligibleTable(asets) {
    var tbody = document.getElementById('bmn-hps-eligible-tbody');
    if (!tbody) return;

    if (asets.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--n-text-muted);">' +
        'Tidak ada aset yang eligible (seluruh aset dalam status non-aktif atau telah diusulkan).' +
        '</td></tr>';
      return;
    }

    var html = '';
    asets.forEach(function (a) {
      var isChecked = !!_BMN_HPS.selectedAsetIds[a.asetId];
      var kBadge = '';
      if (a.kondisi === 'RUSAK_BERAT') {
        kBadge = '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Rusak Berat</span>';
      } else if (a.kondisi === 'RUSAK_RINGAN') {
        kBadge = '<span class="badge" style="background:#FEF08A;color:#854D0E;">Rusak Ringan</span>';
      } else {
        kBadge = '<span class="badge" style="background:#DEF7EC;color:#03543F;">Baik</span>';
      }

      html += '<tr>' +
        '<td style="text-align:center;">' +
        '<input type="checkbox" class="bmn-hps-item-cb" data-id="' + _esc(a.asetId) + '" ' + (isChecked ? 'checked' : '') + ' onchange="_bmnToggleItemSelect(\'' + _esc(a.asetId) + '\', this.checked)">' +
        '</td>' +
        '<td>' +
        '<strong class="tnum">' + _esc(a.kodeBarang) + '</strong>' +
        '<div style="font-size:.72rem; color:var(--n-text-muted);">NUP: ' + _esc(a.nup) + '</div>' +
        '</td>' +
        '<td>' +
        '<div style="font-weight:600;">' + _esc(a.namaBarang) + '</div>' +
        (a.merekTipe ? '<div style="font-size:.72rem; color:var(--n-text-muted);">' + _esc(a.merekTipe) + '</div>' : '') +
        '</td>' +
        '<td>' + kBadge + '</td>' +
        '<td>' + _esc(a.lokasiId) + '</td>' +
        '<td style="text-align:right;" class="tnum">' +
        '<div style="font-weight:600;">' + _rupiah(a.nilaiBuku) + '</div>' +
        '<div style="font-size:.72rem; color:var(--n-text-muted);">Beli: ' + _rupiah(a.nilaiPerolehan) + '</div>' +
        '</td>' +
        '</tr>';
    });

    tbody.innerHTML = html;
  }

  function _bmnFilterEligibleAsets() {
    var input = document.getElementById('bmn-hps-eligible-search');
    var q = input ? input.value.trim().toLowerCase() : '';
    if (!q) {
      _bmnRenderEligibleTable(_BMN_HPS.eligibleAsets);
      return;
    }
    var filtered = _BMN_HPS.eligibleAsets.filter(function (a) {
      return (a.kodeBarang && a.kodeBarang.toLowerCase().indexOf(q) !== -1) ||
        (a.nup && String(a.nup).toLowerCase().indexOf(q) !== -1) ||
        (a.namaBarang && a.namaBarang.toLowerCase().indexOf(q) !== -1) ||
        (a.lokasiId && a.lokasiId.toLowerCase().indexOf(q) !== -1);
    });
    _bmnRenderEligibleTable(filtered);
  }

  function _bmnToggleItemSelect(asetId, checked) {
    if (checked) {
      _BMN_HPS.selectedAsetIds[asetId] = true;
    } else {
      delete _BMN_HPS.selectedAsetIds[asetId];
    }
    _bmnUpdateHpsSelectionTotals();
  }

  function _bmnToggleAllEligibleCheckboxes(toggleEl) {
    var checked = toggleEl ? toggleEl.checked : false;
    var cbs = document.querySelectorAll('.bmn-hps-item-cb');
    cbs.forEach(function (cb) {
      cb.checked = checked;
      var id = cb.getAttribute('data-id');
      if (checked) {
        _BMN_HPS.selectedAsetIds[id] = true;
      } else {
        delete _BMN_HPS.selectedAsetIds[id];
      }
    });
    _bmnUpdateHpsSelectionTotals();
  }

  function _bmnSelectAllEligible(selectAll) {
    if (selectAll) {
      _BMN_HPS.eligibleAsets.forEach(function (a) {
        _BMN_HPS.selectedAsetIds[a.asetId] = true;
      });
    } else {
      _BMN_HPS.selectedAsetIds = {};
    }
    _bmnFilterEligibleAsets();
    _bmnUpdateHpsSelectionTotals();
  }

  function _bmnUpdateHpsSelectionTotals() {
    var selectedKeys = Object.keys(_BMN_HPS.selectedAsetIds);
    var count = selectedKeys.length;
    var totalPerolehan = 0;
    var totalBuku = 0;

    _BMN_HPS.eligibleAsets.forEach(function (a) {
      if (_BMN_HPS.selectedAsetIds[a.asetId]) {
        totalPerolehan += (Number(a.nilaiPerolehan) || 0);
        totalBuku += (Number(a.nilaiBuku) || 0);
      }
    });

    var elCount = document.getElementById('bmn-hps-sel-count');
    var elPerolehan = document.getElementById('bmn-hps-sel-perolehan');
    var elBuku = document.getElementById('bmn-hps-sel-buku');

    if (elCount) elCount.textContent = count;
    if (elPerolehan) elPerolehan.textContent = _rupiah(totalPerolehan);
    if (elBuku) elBuku.textContent = _rupiah(totalBuku);
  }

  function _bmnSubmitCreateHapus() {
    var elAlasan = document.getElementById('bmn-hps-alasan');
    var elNoSurat = document.getElementById('bmn-hps-no-surat');
    var elTglSurat = document.getElementById('bmn-hps-tgl-surat');
    var elLinkSurat = document.getElementById('bmn-hps-link-surat');
    var elKet = document.getElementById('bmn-hps-keterangan');
    var btn = document.getElementById('btn-submit-create-hapus');

    var alasan = elAlasan ? elAlasan.value : '';
    var keterangan = elKet ? elKet.value.trim() : '';
    var noSurat = elNoSurat ? elNoSurat.value.trim() : '';
    var tglSurat = elTglSurat ? elTglSurat.value : '';
    var linkSurat = elLinkSurat ? elLinkSurat.value.trim() : '';

    if (!alasan) {
      _msg('bmn-create-hps-msg', 'error', 'Pilih alasan penghapusan.');
      return;
    }
    if (!keterangan) {
      _msg('bmn-create-hps-msg', 'error', 'Keterangan / pertimbangan usulan wajib diisi.');
      return;
    }
    if (tglSurat && (!_bmnValidateSaneDate(tglSurat, 1990, new Date().getFullYear()) || tglSurat > _bmnTodayIso())) {
      _msg('bmn-create-hps-msg', 'error', 'Tanggal surat usulan tidak valid atau berada di masa depan.');
      return;
    }
    if (linkSurat && !/^https?:\/\/\S+/i.test(linkSurat)) {
      _msg('bmn-create-hps-msg', 'error', 'Tautan surat usulan harus berupa URL yang valid (http:// atau https://).');
      return;
    }

    var asetIds = Object.keys(_BMN_HPS.selectedAsetIds);
    if (asetIds.length === 0) {
      _msg('bmn-create-hps-msg', 'error', 'Pilih minimal satu aset yang akan diusulkan untuk dihapus.');
      return;
    }

    if (btn) btn.disabled = true;
    _msg('bmn-create-hps-msg', 'info', 'Menyimpan berkas usulan penghapusan dan mengkarantina aset...');

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) btn.disabled = false;
        if (!res.success) {
          _msg('bmn-create-hps-msg', 'error', res.error || 'Gagal membuat usulan.');
          return;
        }
        closeModal('modal-bmn-create-hapus');
        _msg('bmn-table-msg', 'success', 'Berkas usulan penghapusan ' + res.penghapusanId + ' berhasil dibuat dengan ' + asetIds.length + ' aset dikarantina.');
        _bmnLoadPenghapusanList(true);
        _bmnLoadAsetList(true);
        _bmnLoadSummary(true);
      })
      .withFailureHandler(function (err) {
        if (btn) btn.disabled = false;
        _msg('bmn-create-hps-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
      })
      .bmn_createPenghapusan(APP.token, {
        alasanPenghapusan: alasan,
        keteranganAlasan: keterangan,
        nomorSuratUsulan: noSurat,
        tanggalSuratUsulan: tglSurat,
        evidenceSuratUsulan: linkSurat,
        asetIds: asetIds
      });
  }

  function _bmnRenderDetailHapus(detail) {
    var master = detail.master || {};
    var items = detail.items || [];
    var currentTahap = String(master.tahap || 'DRAFT_USULAN').toUpperCase();

    var elBadge = document.getElementById('bmn-detail-hps-badge');
    if (elBadge) elBadge.innerHTML = _bmnGetTahapBadge(currentTahap);

    var stepOrder = ['DRAFT_USULAN', 'SURAT_USULAN', 'PERSETUJUAN_KEMENKEU', 'SK_PENGHAPUSAN', 'BAST_SELESAI'];
    var currentIdx = stepOrder.indexOf(currentTahap);

    var elStepper = document.getElementById('bmn-detail-hps-stepper');
    if (elStepper) {
      elStepper.querySelectorAll('.n-step-item').forEach(function (stepEl) {
        var stepName = stepEl.getAttribute('data-step');
        var stepIdx = stepOrder.indexOf(stepName);
        stepEl.classList.remove('active', 'completed', 'rejected');

        if (currentTahap === 'DITOLAK') {
          if (stepIdx <= 2) stepEl.classList.add('completed');
          if (stepIdx === 2) stepEl.classList.add('rejected');
        } else if (currentTahap === 'VOID') {
          stepEl.classList.add('rejected');
        } else {
          if (stepIdx < currentIdx) {
            stepEl.classList.add('completed');
          } else if (stepIdx === currentIdx) {
            stepEl.classList.add('active');
          }
        }
      });
    }

    var elAlert = document.getElementById('bmn-detail-hps-alert');
    if (elAlert) {
      if (currentTahap === 'DITOLAK') {
        elAlert.className = 'n-msg n-msg-error';
        elAlert.classList.remove('n-hidden');
        elAlert.innerHTML = '<strong>Usulan Ditolak</strong><br>' + _esc(master.keteranganAlasan || '');
      } else if (currentTahap === 'VOID') {
        elAlert.className = 'n-msg n-msg-error';
        elAlert.classList.remove('n-hidden');
        elAlert.innerHTML = '<strong>Berkas Usulan Telah Dianulir</strong><br>' + _esc(master.voidReason || 'Usulan dibatalkan internal.');
      } else {
        elAlert.classList.add('n-hidden');
      }
    }

    var elAlasan = document.getElementById('bmn-detail-hps-alasan');
    var elKet = document.getElementById('bmn-detail-hps-keterangan');
    var elUnit = document.getElementById('bmn-detail-hps-total-unit');
    var elPerolehan = document.getElementById('bmn-detail-hps-total-perolehan');
    var elBuku = document.getElementById('bmn-detail-hps-total-buku');

    var elNomor = document.getElementById('bmn-detail-hps-nomor');
    var elTgl = document.getElementById('bmn-detail-hps-tanggal');
    var elPeruntukan = document.getElementById('bmn-detail-hps-peruntukan');
    var elSubmitter = document.getElementById('bmn-detail-hps-submitter');

    if (elNomor) elNomor.textContent = master.penghapusanId || master.nomorSuratUsulan || '—';
    if (elTgl) elTgl.textContent = _formatDate(master.tanggalUsulan || master.timestamp);
    if (elPeruntukan) elPeruntukan.textContent = _bmnGetAlasanLabel(master.alasanPenghapusan);
    if (elSubmitter) elSubmitter.textContent = master.submittedBy || '—';

    if (elAlasan) elAlasan.textContent = _bmnGetAlasanLabel(master.alasanPenghapusan);
    if (elKet) elKet.textContent = master.keteranganAlasan || '-';
    if (elUnit) elUnit.textContent = (master.totalUnit || items.length) + ' Unit';
    if (elPerolehan) elPerolehan.textContent = _rupiah(master.totalNilaiPerolehan);
    if (elBuku) elBuku.textContent = _rupiah(master.totalNilaiBuku);

    var elDocs = document.getElementById('bmn-detail-docs-summary');
    if (elDocs) {
      var docHtml = '';
      if (master.nomorSuratUsulan) {
        docHtml += '<div style="margin-bottom:4px;"><strong>Surat Usulan:</strong> ' + _esc(master.nomorSuratUsulan);
        if (master.evidenceSuratUsulan) {
          docHtml += ' <a href="' + _esc(master.evidenceSuratUsulan) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
        }
        docHtml += '</div>';
      } else {
        docHtml += '<div style="color:var(--n-text-muted); margin-bottom:4px;">Surat Usulan: Belum diterbitkan</div>';
      }

      if (master.nomorSuratPersetujuan) {
        docHtml += '<div style="margin-bottom:4px;"><strong>Persetujuan DJKN:</strong> ' + _esc(master.nomorSuratPersetujuan) + ' (' + _esc(master.instansiKemenkeu || 'DJKN') + ')';
        if (master.evidenceSuratPersetujuan) {
          docHtml += ' <a href="' + _esc(master.evidenceSuratPersetujuan) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
        }
        docHtml += '</div>';
      } else {
        docHtml += '<div style="color:var(--n-text-muted); margin-bottom:4px;">Persetujuan DJKN: Belum ada</div>';
      }

      if (master.nomorSK) {
        docHtml += '<div style="margin-bottom:4px;"><strong>SK Penghapusan:</strong> ' + _esc(master.nomorSK);
        if (master.evidenceSK) {
          docHtml += ' <a href="' + _esc(master.evidenceSK) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas]</a>';
        }
        docHtml += '</div>';
      }

      if (master.evidenceBAST) {
        docHtml += '<div style="margin-bottom:4px;"><strong>BAST Selesai:</strong> <a href="' + _esc(master.evidenceBAST) + '" target="_blank" rel="noopener" style="color:var(--n-primary); text-decoration:underline;">[Lihat Berkas BAST]</a></div>';
      }

      elDocs.innerHTML = docHtml;
    }

    var elCount = document.getElementById('bmn-detail-hps-items-count');
    if (elCount) elCount.textContent = items.length + ' item';

    var tbody = document.getElementById('bmn-detail-hps-items-tbody');
    if (tbody) {
      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:16px; color:var(--n-text-muted);">Tidak ada daftar aset dalam usulan ini.</td></tr>';
      } else {
        var itemHtml = '';
        items.forEach(function (it) {
          var stBadge = '';
          var st = String(it.statusAset || '').toUpperCase();
          if (st === 'DALAM_PENGHAPUSAN') {
            stBadge = '<span class="badge" style="background:#FEF08A;color:#854D0E;">Karantina Usulan</span>';
          } else if (st === 'DIHAPUS') {
            stBadge = '<span class="badge" style="background:#FEE2E2;color:#DC2626;">Dihapus (Final)</span>';
          } else {
            stBadge = '<span class="badge" style="background:#DEF7EC;color:#03543F;">' + _esc(st) + '</span>';
          }

    var nextBadge = document.getElementById('bmn-detail-next-step-badge');

      if (advanceTitle) advanceTitle.textContent = 'Tolak Berkas Usulan';

  function _bmnSubmitAdvanceStage() {
    if (!_BMN_HPS.activeDetail || !_BMN_HPS.activeDetail.master) return;
    var master = _BMN_HPS.activeDetail.master;
    var currentTahap = String(master.tahap || 'DRAFT_USULAN').toUpperCase();
    var hpsId = master.penghapusanId;

    var payload = {
      penghapusanId: hpsId
    };

    if (_BMN_HPS.isRejectMode) {
      var elAlasanTolak = document.getElementById('bmn-adv-alasan-tolak');
      var alasanTolak = elAlasanTolak ? elAlasanTolak.value.trim() : '';
      if (!alasanTolak) {
        _msg('bmn-detail-advance-msg', 'error', 'Alasan penolakan wajib diisi.');
        return;
      }
      payload.tahapTarget = 'DITOLAK';
      payload.alasanTolak = alasanTolak;
    } else if (currentTahap === 'DRAFT_USULAN') {
      var elNo = document.getElementById('bmn-adv-no-surat');
      var elTgl = document.getElementById('bmn-adv-tgl-surat');
      var elLink = document.getElementById('bmn-adv-link-surat');

      var noSurat = elNo ? elNo.value.trim() : '';
      var tglSurat = elTgl ? elTgl.value : '';
      var linkSurat = elLink ? elLink.value.trim() : '';

      if (!noSurat) { _msg('bmn-detail-advance-msg', 'error', 'Nomor Surat Usulan wajib diisi.'); return; }
      if (!tglSurat) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal Surat Usulan wajib diisi.'); return; }
      if (!linkSurat) { _msg('bmn-detail-advance-msg', 'error', 'Link berkas bukti Surat Usulan wajib dilampirkan.'); return; }

      payload.tahapTarget = 'SURAT_USULAN';
      payload.nomorSuratUsulan = noSurat;
      payload.tanggalSuratUsulan = tglSurat;
      payload.evidenceSuratUsulan = linkSurat;

    } else if (currentTahap === 'SURAT_USULAN') {
      var elNoP = document.getElementById('bmn-adv-no-persetujuan');
      var elTglP = document.getElementById('bmn-adv-tgl-persetujuan');
      var elInst = document.getElementById('bmn-adv-instansi-kemenkeu');
      var elLinkP = document.getElementById('bmn-adv-link-persetujuan');

      var noP = elNoP ? elNoP.value.trim() : '';
      var tglP = elTglP ? elTglP.value : '';
      var inst = elInst ? elInst.value.trim() : '';
      var linkP = elLinkP ? elLinkP.value.trim() : '';

      if (!noP) { _msg('bmn-detail-advance-msg', 'error', 'Nomor Surat Persetujuan DJKN wajib diisi.'); return; }
      if (!tglP) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal Surat Persetujuan DJKN wajib diisi.'); return; }
      if (!inst) { _msg('bmn-detail-advance-msg', 'error', 'Instansi DJKN/KPKNL penerbit persetujuan wajib diisi.'); return; }
      if (!linkP) { _msg('bmn-detail-advance-msg', 'error', 'Link bukti berkas persetujuan wajib dilampirkan.'); return; }

      payload.tahapTarget = 'PERSETUJUAN_KEMENKEU';
      payload.nomorSuratPersetujuan = noP;
      payload.tanggalSuratPersetujuan = tglP;
      payload.instansiKemenkeu = inst;
      payload.evidenceSuratPersetujuan = linkP;

    } else if (currentTahap === 'PERSETUJUAN_KEMENKEU') {
      var elNoSK = document.getElementById('bmn-adv-no-sk');
      var elTglSK = document.getElementById('bmn-adv-tgl-sk');
      var elLinkSK = document.getElementById('bmn-adv-link-sk');

      var noSK = elNoSK ? elNoSK.value.trim() : '';
      var tglSK = elTglSK ? elTglSK.value : '';
      var linkSK = elLinkSK ? elLinkSK.value.trim() : '';

      if (!noSK) { _msg('bmn-detail-advance-msg', 'error', 'Nomor SK Penghapusan KKP wajib diisi.'); return; }
      if (!tglSK) { _msg('bmn-detail-advance-msg', 'error', 'Tanggal SK Penghapusan wajib diisi.'); return; }
      if (!linkSK) { _msg('bmn-detail-advance-msg', 'error', 'Link bukti berkas SK Penghapusan wajib dilampirkan.'); return; }

      payload.tahapTarget = 'SK_PENGHAPUSAN';
      payload.nomorSK = noSK;
      payload.tanggalSK = tglSK;
      payload.evidenceSK = linkSK;

    } else if (currentTahap === 'SK_PENGHAPUSAN') {
      var elLinkBAST = document.getElementById('bmn-adv-link-bast');
      var linkBAST = elLinkBAST ? elLinkBAST.value.trim() : '';

      if (!linkBAST) { _msg('bmn-detail-advance-msg', 'error', 'Link berkas BAST / Risalah Lelang wajib dilampirkan.'); return; }

      payload.tahapTarget = 'BAST_SELESAI';
      payload.evidenceBAST = linkBAST;
    }

    var btnAdvance = document.getElementById('btn-confirm-advance');
    if (btnAdvance) btnAdvance.disabled = true;
    _msg('bmn-detail-advance-msg', 'info', 'Menyimpan proses tahapan siklus...');

    google.script.run
      .withSuccessHandler(function (res) {
        if (btnAdvance) btnAdvance.disabled = false;
        if (!res.success) {
          _msg('bmn-detail-advance-msg', 'error', res.error || 'Gagal memproses tahapan.');
          return;
        }
        _msg('bmn-detail-advance-msg', 'success', 'Tahapan berkas berhasil dimutakhirkan ke: ' + payload.tahapTarget);
        _bmnLoadPenghapusanList(true);
        _bmnLoadAsetList(true);
        _bmnLoadSummary(true);
        setTimeout(function () {
          _bmnOpenDetailHapusModal(hpsId);
        }, 700);
      })
      .withFailureHandler(function (err) {
        if (btnAdvance) btnAdvance.disabled = false;
        _msg('bmn-detail-advance-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
      })
      .bmn_advancePenghapusan(APP.token, payload);
  }

  function _bmnPromptVoidHapus(penghapusanId) {
    _BMN_HPS.pendingVoidId = penghapusanId;
    var elTarget = document.getElementById('bmn-void-hps-target-id');
    var elReason = document.getElementById('bmn-void-hps-reason');
    var elMsg = document.getElementById('bmn-void-hps-msg');

    if (elTarget) elTarget.textContent = penghapusanId;
    if (elReason) elReason.value = '';
    if (elMsg) elMsg.innerHTML = '';

    openModal('modal-bmn-void-hapus');
  }

  function _bmnOpenVoidModal() {
    if (!_BMN_HPS.activeDetail || !_BMN_HPS.activeDetail.master) return;
    _bmnPromptVoidHapus(_BMN_HPS.activeDetail.master.penghapusanId);
  }

  function _bmnExecuteVoidHapus() {
    var penghapusanId = _BMN_HPS.pendingVoidId;
    var elReason = document.getElementById('bmn-void-hps-reason');
    var reason = elReason ? elReason.value.trim() : '';
    var btn = document.getElementById('btn-confirm-void-hapus');

    if (!reason) {
      _msg('bmn-void-hps-msg', 'error', 'Alasan pembatalan/anulir usulan wajib diisi.');
      return;
    }

    if (btn) btn.disabled = true;
    _msg('bmn-void-hps-msg', 'info', 'Membatalkan berkas usulan dan memulihkan status aset...');

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) btn.disabled = false;
        if (!res.success) {
          _msg('bmn-void-hps-msg', 'error', res.error || 'Gagal menganulir usulan.');
          return;
        }
        closeModal('modal-bmn-void-hapus');
        closeModal('modal-bmn-detail-hapus');
        _msg('bmn-table-msg', 'success', 'Berkas usulan ' + penghapusanId + ' berhasil dianulir dan seluruh aset dipulihkan ke status AKTIF.');
        _bmnLoadPenghapusanList(true);
        _bmnLoadAsetList(true);
        _bmnLoadSummary(true);
      })
      .withFailureHandler(function (err) {
        if (btn) btn.disabled = false;
        _msg('bmn-void-hps-msg', 'error', 'Terjadi kesalahan sistem: ' + (err.message || 'Koneksi gagal.'));
      })
      .bmn_voidPenghapusan(APP.token, {
        penghapusanId: penghapusanId,
        alasan: reason
      });
  }

    var npEl = document.getElementById('bmn-form-np');

      hintEl.innerHTML = '<span style="color:#D97706; font-weight:600;">Ekstrakomptabel / BMN Reguler (Di bawah batas kapitalisasi Rp 2.000.000 — Akun 52)</span>';
      if (selPenc) selPenc.value = 'REGULER';
    }
  }

  function _stnkClearFieldFlag(el, flagId) {
    if (el) el.classList.remove('stnk-field-unverified');
    if (flagId) {
      var fl = document.getElementById(flagId);
      if (fl) fl.innerHTML = '';
    }
  }

  function _stnkSetFieldFlag(inputId, flagId, mode) {
    var inp = document.getElementById(inputId);
    var fl = document.getElementById(flagId);
    if (inp) {
      if (mode === 'miss') {
        inp.classList.add('stnk-field-unverified');
      } else {
        inp.classList.remove('stnk-field-unverified');
      }
    }
    if (fl) {
      if (mode === 'ok') {
        fl.innerHTML = '<span class="stnk-field-flag is-ok">Terbaca OCR</span>';
      } else if (mode === 'miss') {
        fl.innerHTML = '<span class="stnk-field-flag is-miss">Tidak terbaca — isi manual</span>';
      } else {
        fl.innerHTML = '';
      }
    }
  }

  function _stnkResetOcrUi(ctx) {
    var cfg = _stnkGetCtxConfig(ctx);
    var pImg = document.getElementById(cfg.previewImgId);
    var ph = document.getElementById(cfg.placeholderId);
    var st = document.getElementById(cfg.statusId);
    var bg = document.getElementById(cfg.badgeId);
    var mb = document.getElementById(cfg.missingBoxId);
    var db = document.getElementById(cfg.detailBoxId);

  function _simanpoaPreprocessCanvas(srcCanvas, mode, radOverride, biasOverride) {
    var maxDim = Math.max(srcCanvas.width || 1, srcCanvas.height || 1);
    var targetLong = mode === 'bradley' ? 1350 : 1200;
    var scale = maxDim < targetLong ? Math.min(2.2, targetLong / maxDim) : (maxDim > 1500 ? (targetLong / maxDim) : 1.0);

    var upCanvas = document.createElement('canvas');
    upCanvas.width = Math.max(1, Math.round(srcCanvas.width * scale));
    upCanvas.height = Math.max(1, Math.round(srcCanvas.height * scale));
    var ctx = upCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    if (mode === 'fastgray') {
      ctx.filter = 'grayscale(100%) contrast(142%) brightness(106%)';
      ctx.drawImage(srcCanvas, 0, 0, upCanvas.width, upCanvas.height);
      ctx.filter = 'none';
      return upCanvas;
    }

    ctx.drawImage(srcCanvas, 0, 0, upCanvas.width, upCanvas.height);
    var w = upCanvas.width;
    var h = upCanvas.height;
    var imgData = ctx.getImageData(0, 0, w, h);
    var d = imgData.data;
    var totalPx = w * h;

    if (mode === 'bradley' || mode === 'otsu' || mode === 'binarize') {
      // Penekanan latar biru/merah kertas STNK agar tinta dot-matrix lebih kontras
      var lum = new Float32Array(totalPx);
      for (var i = 0, p = 0; i < d.length; i += 4, p++) {
        lum[p] = 0.35 * d[i] + 0.50 * d[i + 1] + 0.15 * d[i + 2];
      }

      // Bradley Local Adaptive Thresholding via Integral Image (cepat < 40ms)
      var rad = radOverride || 15;
      var bias = biasOverride || 0.89;
      var stride = w + 1;
      var integ = new Float64Array((w + 1) * (h + 1));
      for (var yy = 0; yy < h; yy++) {
        var rowSum = 0;
        var rowBase = yy * w;
        var iRowCurr = (yy + 1) * stride;
        var iRowPrev = yy * stride;
        for (var xx = 0; xx < w; xx++) {
          rowSum += lum[rowBase + xx];
          integ[iRowCurr + xx + 1] = integ[iRowPrev + xx + 1] + rowSum;
        }
      }

      for (var y = 0; y < h; y++) {
        var y0 = y - rad; if (y0 < 0) y0 = 0;
        var y1 = y + rad; if (y1 >= h) y1 = h - 1;
        var offY1 = (y1 + 1) * stride;
        var offY0 = y0 * stride;
        var yBase = y * w;
        for (var x = 0; x < w; x++) {
          var x0 = x - rad; if (x0 < 0) x0 = 0;
          var x1 = x + rad; if (x1 >= w) x1 = w - 1;
          var cnt = (x1 - x0 + 1) * (y1 - y0 + 1);
          var sum = integ[offY1 + x1 + 1] - integ[offY0 + x1 + 1] - integ[offY1 + x0] + integ[offY0 + x0];
          var val = (lum[yBase + x] < (sum / cnt) * bias) ? 0 : 255;
          var oIdx = (yBase + x) * 4;
          d[oIdx] = d[oIdx + 1] = d[oIdx + 2] = val;
          d[oIdx + 3] = 255;
        }

      ctx.putImageData(imgData, 0, 0);
      return upCanvas;
    }

    ctx.filter = 'grayscale(100%) contrast(140%) brightness(105%)';
    ctx.drawImage(srcCanvas, 0, 0, w, h);

  }

  function _stnkRotateCanvas(srcCanvas, deg) {

    out.height = swap ? srcCanvas.width : srcCanvas.height;

    ctx.rotate(rad);
    ctx.drawImage(srcCanvas, -srcCanvas.width / 2, -srcCanvas.height / 2);
    return out;
  }

  function _stnkCropCanvas(srcCanvas, xFrac, yFrac, wFrac, hFrac) {

    var y = Math.max(0, Math.floor(srcCanvas.height * yFrac));
    var w = Math.max(20, Math.min(srcCanvas.width - x, Math.floor(srcCanvas.width * wFrac)));
    var h = Math.max(20, Math.min(srcCanvas.height - y, Math.floor(srcCanvas.height * hFrac)));

    out.width = w;
    out.height = h;
    out.getContext('2d').drawImage(srcCanvas, x, y, w, h, 0, 0, w, h);

  function _stnkRebuildRowsFromWords(words) {
    if (!words || !words.length) return [];
    var items = words.filter(function (w) {
      return w && w.bbox && w.text && String(w.text).trim().length > 0;
    });
    if (!items.length) return [];

    // Hitung tinggi huruf median untuk toleransi pengelompokan baris
    var heights = items.map(function (w) { return Math.max(6, (w.bbox.y1 - w.bbox.y0)); }).sort(function (a, b) { return a - b; });
    var medH = heights[Math.floor(heights.length * 0.5)] || 14;
    var rowTol = Math.max(6, medH * 0.65);

    var sorted = items.slice().sort(function (a, b) {
      var ay = (a.bbox.y0 + a.bbox.y1) * 0.5;
      var by = (b.bbox.y0 + b.bbox.y1) * 0.5;
      return ay - by;
    });

    var rows = [];
    sorted.forEach(function (w) {
      var cy = (w.bbox.y0 + w.bbox.y1) * 0.5;
      var placed = false;
      for (var i = rows.length - 1; i >= Math.max(0, rows.length - 4); i--) {
        if (Math.abs(cy - rows[i].cy) <= rowTol) {
          rows[i].words.push(w);
          rows[i].cy = (rows[i].cy * (rows[i].words.length - 1) + cy) / rows[i].words.length;
          placed = true;
          break;
        }
      }
      if (!placed) {
        rows.push({ cy: cy, words: [w] });
      }
    });

    var outLines = [];
    rows.forEach(function (r) {
      r.words.sort(function (a, b) { return a.bbox.x0 - b.bbox.x0; });
      var segments = [];
      var curSeg = [r.words[0].text.trim()];
      for (var j = 1; j < r.words.length; j++) {
        var gap = r.words[j].bbox.x0 - r.words[j - 1].bbox.x1;
        if (gap > medH * 3.2) {
          segments.push(curSeg.join(' '));
          curSeg = [r.words[j].text.trim()];
        } else {
          curSeg.push(r.words[j].text.trim());
        }
      }
      segments.push(curSeg.join(' '));
      outLines.push(segments.join(' | '));
      if (segments.length > 1) {
        segments.forEach(function (sg) { outLines.push(sg); });
      }
    });
    return outLines;
  }

  function _stnkFileToCanvas(file, b64Data, cb) {
    var isPdf = (file.type === 'application/pdf') || /\.pdf$/i.test(file.name || '');
    if (isPdf) {
      if (!window.pdfjsLib) {
        cb(new Error('Library PDF.js belum siap di browser untuk merender STNK PDF.'), null);
        return;
      }
      var rawB64 = String(b64Data || '').replace(/^data:[^;]+;base64,/, '');
      var binStr = atob(rawB64);
      var bytes = new Uint8Array(binStr.length);
      for (var i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

      window.pdfjsLib.getDocument({ data: bytes }).promise
        .then(function (pdf) {
          return pdf.getPage(1);
        })
        .then(function (page) {
          var viewport = page.getViewport({ scale: 2.0 });
          var cvs = document.createElement('canvas');
          cvs.width = Math.round(viewport.width);
          cvs.height = Math.round(viewport.height);
          var ctx = cvs.getContext('2d');
          return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
            cb(null, cvs, cvs.toDataURL('image/png'));
          });
        })
        .catch(function (err) {
          cb(err || new Error('Gagal merender halaman pertama PDF STNK.'), null);
        });
      return;
    }

    var img = new Image();
    img.onload = function () {
      var cvs = document.createElement('canvas');
      cvs.width = img.naturalWidth || img.width;
      cvs.height = img.naturalHeight || img.height;
      var ctx = cvs.getContext('2d');
      ctx.drawImage(img, 0, 0);
      cb(null, cvs, b64Data);
    };
    img.onerror = function () {
      cb(new Error('Berkas gambar STNK tidak dapat didekode.'), null);
    };
    img.src = b64Data;
  }

  function _stnkNormalizeDigits(s) {
    return String(s || '')
      .replace(/[OQ]/g, '0')
      .replace(/[Il|]/g, '1')
      .replace(/Z/g, '2')
      .replace(/S/g, '5')
      .replace(/B/g, '8')
      .replace(/G/g, '6');
  }

  function _stnkNormalizeLetters(s) {
    return String(s || '')
      .replace(/0/g, 'O')
      .replace(/1/g, 'I')
      .replace(/8/g, 'B')
      .replace(/5/g, 'S');
  }

  function _stnkNormalizePlateCandidate(rawPrefix, rawNum, rawSuffix, strictPrefix) {

    var suf = _stnkNormalizeLetters(String(rawSuffix || '').toUpperCase().replace(/[^A-Z0-9]/g, ''));

  }

  }

  function _stnkExtractDatesWithContext(lines) {
    var monthMap = {
      JAN: 1, JANUARI: 1, JANUARY: 1,
      FEB: 2, PEB: 2, FEBRUARI: 2, PEBRUARI: 2, FEBRUARY: 2,
      MAR: 3, MRT: 3, MARET: 3, MARCH: 3,
      APR: 4, APRIL: 4,
      MEI: 5, MAY: 5,
      JUN: 6, JUNI: 6, JUNE: 6,
      JUL: 7, JULI: 7, JULY: 7,
      AGU: 8, AGS: 8, AGT: 8, AGUSTUS: 8, AUG: 8, AUGUST: 8,
      SEP: 9, SEPT: 9, SEPTEMBER: 9,
      OKT: 10, OCT: 10, OKTOBER: 10, OCTOBER: 10,
      NOV: 11, NOP: 11, NOVEMBER: 11, NOPEMBER: 11,
      DES: 12, DEC: 12, DESEMBER: 12, DECEMBER: 12

    var candidates = [];

      var iso = y + '-' + (m < 10 ? '0' + m : m) + '-' + (d < 10 ? '0' + d : d);

      var prevLine = lineIdx > 0 ? lines[lineIdx - 1] : '';

        iso: iso,
        year: y,
        lineIdx: lineIdx,
        isIssue: isIssue,
        isPajakHint: isPajakHint,

      var up = ln.toUpperCase();
      var numRe = /\b([0-3OIl]?[0-9OIlS])\s*[\/\-\.\+]\s*([01OIl]?[0-9OIlS])\s*[\/\-\.\+]\s*([12OIl]{1}[0-9OIlSZBG]{1,3}|[0-9OIl]{2})\b/g;

      while ((m = numRe.exec(up)) !== null) {

    if (stnkTagged.length > 0) {
      stnkTagged.sort(function (a, b) { return b.iso.localeCompare(a.iso); });

        tglStnk = stnkAsc[stnkAsc.length - 1];
      }

    var nonIssue = candidates
      .filter(function (c) { return !c.isIssue && c.year >= (curYr - 6) && c.year <= (curYr + 7); })
      .map(function (c) { return c.iso; });

    var uniq = [];
    nonIssue.forEach(function (iso) {
      if (uniq.indexOf(iso) === -1) uniq.push(iso);

      tglPajak = uniq[0];
      tglStnk = uniq[uniq.length - 1];

      tglStnk = uniq[0];
    }

    return {
      tglPajakTahunan: tglPajak,
      tglStnkLimaTahunan: tglStnk,

  function _stnkExtractLabelValue(lines, labelRegex, nextStopRegex) {

    return '';

  function _stnkParseIndonesianText(rawText, tesseractData) {

    var upperLines = combinedLines.map(function (l) { return l.toUpperCase(); });
    var fullUpper = upperLines.join('\n');

        var matches = lk.match(/\b([A-Z]{1,2})\s+([0-9]{2,4})\s+([A-Z]{1,3})(?!\s*[-][A-Z0-9])/g) || [];
        for (var g = 0; g < matches.length; g++) {

    var merk = _stnkExtractLabelValue(upperLines, /\b(?:MEREK|MERK)\s*[:\-]?\s+(.+)/i, /\b(?:TYPE|TIPE|JENIS|MODEL|WARNA|TAHUN)\b/i);

    var tipe = _stnkExtractLabelValue(upperLines, /\b(?:TYPE|TIPE)\s*[:\-]?\s+(.+)/i, /\b(?:JENIS|MODEL|TAHUN|ISI|WARNA|BAHAN)\b/i);

    var model = _stnkExtractLabelValue(upperLines, /\bMODEL\s*[:\-]?\s+(.+)/i, /\b(?:TAHUN|ISI|SILINDER|WARNA|NO)\b/i);
    if (!model) {
      var mdM = fullUpper.match(/\b(MINIBUS|DOUBLE\s*CABIN|PICK\s*UP|JEEP|SEDAN|STATION\s*WAGON|TRUCK|SOLO)\b/);
      if (mdM) model = mdM[1];
    }

    var warna = _stnkExtractLabelValue(upperLines, /\bWARNA(?!\s*TNKB)\s*[:\-]?\s+(.+)/i, /\b(?:BAHAN|BBM|WARNA\s*TNKB|TAHUN|NO)\b/i);
    var bahanBakar = _stnkExtractLabelValue(upperLines, /\b(?:BAHAN\s*BAKAR|BBM)\s*[:\-]?\s+(.+)/i, /\b(?:WARNA|TAHUN|KODE|NOMOR)\b/i);
    if (!bahanBakar) {
      var bbmM = fullUpper.match(/\b(PREMIUM|PERTALITE|PERTAMAX|SOLAR|DEXLITE|BENSIN|LISTRIK)\b/);
      if (bbmM) bahanBakar = bbmM[1];
    }
    var warnaTnkb = _stnkExtractLabelValue(upperLines, /\bWARNA\s*TNKB\s*[:\-]?\s+(.+)/i, /\b(?:TAHUN|NOMOR|BERLAKU)\b/i);
    var namaPemilik = _stnkExtractLabelValue(upperLines, /\b(?:NAMA\s*PEMILIK)\s*[:\-]?\s+(.+)/i, /\bALAMAT\b/i);

    var tahunPembuatan = '';
    var thnMatch = fullUpper.match(/(?:TAHUN\s*(?:PEMBUATAN|BUAT|RAKITAN)|THN\.?\s*(?:BUAT|PEMBUATAN))\s*[:\-]?\s*([12][09][0-9OIl]{2})/);
    if (thnMatch) {
      var yrNum = parseInt(_stnkNormalizeDigits(thnMatch[1]), 10);
      if (yrNum >= 1980 && yrNum <= new Date().getFullYear() + 1) tahunPembuatan = String(yrNum);
    }

    var isiSilinder = '';
    var ccMatch = fullUpper.match(/(?:ISI\s*SILINDER|SILINDER|DAYA\s*LISTRIK)\s*[:\-]?\s*([0-9OIl]{3,5}(?:\s*(?:CC|KW|WH))?)/);
    if (ccMatch) {
      isiSilinder = _stnkNormalizeDigits(ccMatch[1].replace(/\s+/g, ' ').trim());
    }

    var noRangka = '';
    var rnkMatch = fullUpper.match(/(?:NO(?:MOR)?\.?\s*RANGKA(?:\/NIK(?:\/VIN)?)?|NIK\/VIN)[ \t]*[:\-]?[ \t]*([A-Z0-9\- ]{10,22})/);
    if (rnkMatch) {
      noRangka = rnkMatch[1].replace(/[\s\-]+/g, '').trim().substring(0, 17);
    } else {
      var vinCand = fullUpper.match(/\b((?:MH|MR|NM|JF|KN|KM|LN)[A-HJ-NPR-Z0-9 ]{13,18})\b/);
      if (vinCand) noRangka = vinCand[1].replace(/\s+/g, '').substring(0, 17);
    }

    var noMesin = '';
    var msnMatch = fullUpper.match(/(?:NO(?:MOR)?\.?\s*MESIN)\s*[:\-]?\s*([A-Z0-9\-]{6,20})/);
    if (msnMatch) {
      noMesin = msnMatch[1].trim();
    } else {
      var msnLine = fullUpper.match(/\b([A-Z]{1,4}\d{5,8})\b/);
      if (msnLine && (!noPolisi || msnLine[1] !== noPolisi.replace(/\s+/g, ''))) noMesin = msnLine[1];
    }

    var totalPajakRp = '';
    var pkbMatch = fullUpper.match(/(?:JUMLAH|TOTAL)\s*(?:PEMBAYARAN|PKB|TAGIHAN)?\s*[:\-]?\s*(?:RP\.?\s*|\*{2,3}\s*)?([0-9]{1,3}(?:[.,][0-9]{3})+)/);
    if (pkbMatch) {
      totalPajakRp = 'Rp ' + pkbMatch[1];
    }

    var score = 0;
    if (noPolisi) score += 40;
    if (dates.tglPajakTahunan) score += 35;
    if (dates.tglStnkLimaTahunan) score += 25;

    var detailCount = [merk, tipe, tahunPembuatan, isiSilinder, noRangka, noMesin, warna, bahanBakar, warnaTnkb, namaPemilik, totalPajakRp]
      .filter(function (v) { return !!v; }).length;

    return {
      noPolisi: noPolisi,
      tglPajakTahunan: dates.tglPajakTahunan,
      tglStnkLimaTahunan: dates.tglStnkLimaTahunan,
      allDetectedDates: dates.allDetectedDates,
      merk: merk,
      tipe: tipe,
      jenis: jenis,
      model: model,
      tahunPembuatan: tahunPembuatan,
      isiSilinder: isiSilinder,
      noRangka: noRangka,
      noMesin: noMesin,
      warna: warna,
      bahanBakar: bahanBakar,
      warnaTnkb: warnaTnkb,
      namaPemilik: namaPemilik,
      totalPajakRp: totalPajakRp,
      detailCount: detailCount,
      score: score,
      rawText: cleanText
    };
  }

  function _stnkMergeParsed(a, b) {
    if (!a) return b;
    if (!b) return a;
    var merged = {
      noPolisi: a.noPolisi || b.noPolisi || '',
      tglPajakTahunan: a.tglPajakTahunan || b.tglPajakTahunan || '',
      tglStnkLimaTahunan: a.tglStnkLimaTahunan || b.tglStnkLimaTahunan || '',
      allDetectedDates: (a.allDetectedDates && a.allDetectedDates.length >= (b.allDetectedDates || []).length) ? a.allDetectedDates : b.allDetectedDates,
      merk: a.merk || b.merk || '',
      tipe: a.tipe || b.tipe || '',
      jenis: a.jenis || b.jenis || '',
      model: a.model || b.model || '',
      tahunPembuatan: a.tahunPembuatan || b.tahunPembuatan || '',
      isiSilinder: a.isiSilinder || b.isiSilinder || '',
      noRangka: (a.noRangka && a.noRangka.length >= (b.noRangka || '').length) ? a.noRangka : (b.noRangka || ''),
      noMesin: (a.noMesin && a.noMesin.length >= (b.noMesin || '').length) ? a.noMesin : (b.noMesin || ''),
      warna: a.warna || b.warna || '',
      bahanBakar: a.bahanBakar || b.bahanBakar || '',
      warnaTnkb: a.warnaTnkb || b.warnaTnkb || '',
      namaPemilik: a.namaPemilik || b.namaPemilik || '',
      totalPajakRp: a.totalPajakRp || b.totalPajakRp || '',
      rawText: ((a.rawText || '').length >= (b.rawText || '').length) ? a.rawText : b.rawText
    };
    var score = 0;
    if (merged.noPolisi) score += 40;
    if (merged.tglPajakTahunan) score += 35;
    if (merged.tglStnkLimaTahunan) score += 25;
    merged.score = score;
    merged.detailCount = [merged.merk, merged.tipe, merged.tahunPembuatan, merged.isiSilinder, merged.noRangka, merged.noMesin, merged.warna, merged.bahanBakar, merged.warnaTnkb, merged.namaPemilik, merged.totalPajakRp]
      .filter(function (v) { return !!v; }).length;
    return merged;
  }

  function _stnkRunOcrPasses(srcCanvas, onProgress, cb) {
    if (onProgress) onProgress('Menyiapkan engine OCR...');
    _stnkWarmWorker().then(function (worker) {
      if (!worker) {
        cb(new Error('Engine Tesseract OCR gagal dimuat dari CDN. Periksa koneksi internet.'), null);
        return;
      }

      if (onProgress) onProgress('Memindai STNK (Adaptive Threshold Tajam)...');
      var best = null;

      worker.recognize(_simanpoaPreprocessCanvas(srcCanvas, 'bradley', 15, 0.89))
        .then(function (r1) {
          var txt1 = (r1 && r1.data && r1.data.text) || '';
          best = _stnkParseIndonesianText(txt1, r1 && r1.data);

          // Jika orientasi foto potret miring & nyaris tidak ada huruf terbaca, coba rotasi 90° sekali
          var isPortrait = srcCanvas.height > srcCanvas.width * 1.15;
          var alnumLen = txt1.replace(/[^A-Z0-9]/gi, '').length;
          if (isPortrait && alnumLen < 35) {
            if (onProgress) onProgress('Mendeteksi orientasi foto potret, memutar 90 derajat...');
            return worker.recognize(_simanpoaPreprocessCanvas(_stnkRotateCanvas(srcCanvas, 90), 'bradley', 15, 0.89))
              .then(function (rRot) {
                var pRot = _stnkParseIndonesianText((rRot && rRot.data && rRot.data.text) || '', rRot && rRot.data);
                best = _stnkMergeParsed(best, pRot);
              });
          }
        })
        .then(function () {
          // ROI Fallback ultra-cepat (< 1.5s) HANYA jika nomor polisi masih kosong pada area atas STNK
          if (best && best.noPolisi) return null;
          if (onProgress) onProgress('Memfokuskan pembacaan ulang area Plat Nomor...');
          var topCrop = _stnkCropCanvas(srcCanvas, 0.0, 0.05, 0.65, 0.36);
          return worker.recognize(_simanpoaPreprocessCanvas(topCrop, 'fastgray'))
            .then(function (rRoi) {
              var pRoi = _stnkParseIndonesianText((rRoi && rRoi.data && rRoi.data.text) || '', rRoi && rRoi.data);
              best = _stnkMergeParsed(best, pRoi);
            });
        })
        .then(function () {
          // ROI Fallback (< 1.5s) untuk area Berlaku Sampai jika kedua tanggal jatuh tempo belum terbaca
          if (best && (best.tglStnkLimaTahunan || best.tglPajakTahunan)) return null;
          if (onProgress) onProgress('Memfokuskan pembacaan ulang area Masa Berlaku...');
          var botCrop = _stnkCropCanvas(srcCanvas, 0.25, 0.32, 0.60, 0.42);
          return worker.recognize(_simanpoaPreprocessCanvas(botCrop, 'bradley', 13, 0.87))
            .then(function (rDate) {
              var pDate = _stnkParseIndonesianText((rDate && rDate.data && rDate.data.text) || '', rDate && rDate.data);
              best = _stnkMergeParsed(best, pDate);
            });
        })
        .then(function () {
          cb(null, best);
        })
        .catch(function (err) {
          cb(err || new Error('Proses OCR gagal dijalankan.'), best);
        });
    });
  }

  function _stnkApplyResultToUi(ctx, parsed, errMsg) {
    var cfg = _stnkGetCtxConfig(ctx);
    var statusEl = document.getElementById(cfg.statusId);
    var badgeEl = document.getElementById(cfg.badgeId);
    var missingBox = document.getElementById(cfg.missingBoxId);
    var detailBox = document.getElementById(cfg.detailBoxId);
    var checkEl = cfg.verifiedCheckId ? document.getElementById(cfg.verifiedCheckId) : null;

    if (errMsg || !parsed) {
      if (badgeEl) {
        badgeEl.style.display = 'inline-flex';
        badgeEl.className = 'stnk-ocr-confidence-badge is-fail';
        badgeEl.textContent = 'OCR Gagal — Input Manual';
      }
      if (statusEl) statusEl.textContent = errMsg || 'STNK gagal dipindai oleh OCR.';
      _stnkSetFieldFlag(cfg.nopolId, cfg.flagNopolId, 'miss');
      _stnkSetFieldFlag(cfg.tglPajakId, cfg.flagPajakId, 'miss');
      _stnkSetFieldFlag(cfg.tglStnkId, cfg.flagStnkId, 'miss');
      if (missingBox) {
        missingBox.classList.remove('n-hidden');
        missingBox.innerHTML = '<strong>OCR tidak dapat membaca berkas STNK:</strong> ' + _esc(errMsg || 'Gambar terlalu buram atau format tidak didukung.') +
          '<br>Bagian yang perlu diisi manual: <strong>Nomor Polisi</strong>, <strong>Jatuh Tempo Pajak Tahunan</strong>, dan <strong>Jatuh Tempo STNK 5 Tahunan</strong>.';
      }
      if (checkEl) checkEl.checked = false;
      return;
    }

    var nopolEl = document.getElementById(cfg.nopolId);
    var pajakEl = document.getElementById(cfg.tglPajakId);
    var stnkEl = document.getElementById(cfg.tglStnkId);
    var missingFields = [];
    var firstMissingEl = null;

    if (parsed.noPolisi) {
      if (nopolEl) nopolEl.value = parsed.noPolisi;
      _stnkSetFieldFlag(cfg.nopolId, cfg.flagNopolId, 'ok');
    } else {
      _stnkSetFieldFlag(cfg.nopolId, cfg.flagNopolId, 'miss');
      missingFields.push('Nomor Polisi (Plat Nomor)');
      if (!firstMissingEl && nopolEl) firstMissingEl = nopolEl;
    }

    if (parsed.tglPajakTahunan) {
      if (pajakEl) pajakEl.value = parsed.tglPajakTahunan;
      _stnkSetFieldFlag(cfg.tglPajakId, cfg.flagPajakId, 'ok');
    } else {
      _stnkSetFieldFlag(cfg.tglPajakId, cfg.flagPajakId, 'miss');
      missingFields.push('Jatuh Tempo Pajak Tahunan');
      if (!firstMissingEl && pajakEl) firstMissingEl = pajakEl;
    }

    if (parsed.tglStnkLimaTahunan) {
      if (stnkEl) stnkEl.value = parsed.tglStnkLimaTahunan;
      _stnkSetFieldFlag(cfg.tglStnkId, cfg.flagStnkId, 'ok');
    } else {
      _stnkSetFieldFlag(cfg.tglStnkId, cfg.flagStnkId, 'miss');
      missingFields.push('Jatuh Tempo STNK 5 Tahunan');
      if (!firstMissingEl && stnkEl) firstMissingEl = stnkEl;
    }

    // Isi merek/tipe jika field form kendaraan masih kosong
    if (cfg.merekId && (parsed.merk || parsed.tipe)) {
      var mrkEl = document.getElementById(cfg.merekId);
      if (mrkEl && !mrkEl.value.trim()) {
        mrkEl.value = [parsed.merk, parsed.tipe].filter(Boolean).join(' ');
      }
    }

    // Confidence & Alert banner bagian tidak terbaca
    if (badgeEl) {
      badgeEl.style.display = 'inline-flex';
      if (missingFields.length === 0) {
        badgeEl.className = 'stnk-ocr-confidence-badge is-high';
        badgeEl.textContent = 'Terbaca Lengkap (' + (parsed.score || 100) + '%)';
        if (checkEl) checkEl.checked = true;
      } else if (missingFields.length < 3) {
        badgeEl.className = 'stnk-ocr-confidence-badge is-blur';
        badgeEl.textContent = 'Sebagian Terbaca — Lengkapi ' + missingFields.length + ' Bagian';
        if (checkEl) checkEl.checked = false;
      } else {
        badgeEl.className = 'stnk-ocr-confidence-badge is-fail';
        badgeEl.textContent = 'Tidak Terbaca (0%) — Isi Manual';
        if (checkEl) checkEl.checked = false;
      }
    }

    if (missingFields.length > 0 && missingBox) {
      missingBox.classList.remove('n-hidden');
      var listHtml = missingFields.map(function (f) { return '<li>' + _esc(f) + '</li>'; }).join('');
      missingBox.innerHTML =
        '<strong>Bagian STNK yang gagal terbaca OCR — mohon isi manual pada kolom bertanda kuning:</strong>' +
        '<ul style="margin:4px 0 0 18px; padding:0;">' + listHtml + '</ul>';
    } else if (missingBox) {
      missingBox.classList.add('n-hidden');
      missingBox.innerHTML = '';
    }

    if (statusEl) {
      statusEl.textContent = missingFields.length === 0
        ? 'OCR selesai: seluruh data utama STNK terbaca dan terisi otomatis.'
        : 'OCR selesai dengan ' + (3 - missingFields.length) + ' dari 3 data utama terbaca. Silakan lengkapi sisanya di bawah.';
    }

    // Render detail identitas kendaraan yang berhasil dibaca OCR
    if (detailBox) {
      var detailPairs = [
        ['Nomor Polisi', parsed.noPolisi],
        ['Jatuh Tempo Pajak', parsed.tglPajakTahunan],
        ['Jatuh Tempo STNK', parsed.tglStnkLimaTahunan],
        ['Merek / Tipe', [parsed.merk, parsed.tipe].filter(Boolean).join(' ')],
        ['Jenis / Model', [parsed.jenis, parsed.model].filter(Boolean).join(' · ')],
        ['Tahun Pembuatan', parsed.tahunPembuatan],
        ['Isi Silinder / BBM', [parsed.isiSilinder, parsed.bahanBakar].filter(Boolean).join(' · ')],
        ['Warna / TNKB', [parsed.warna, parsed.warnaTnkb ? ('TNKB ' + parsed.warnaTnkb) : ''].filter(Boolean).join(' · ')],
        ['Nomor Rangka (VIN)', parsed.noRangka],
        ['Nomor Mesin', parsed.noMesin],
        ['Nama Pemilik', parsed.namaPemilik],
        ['Total PKB Terdeteksi', parsed.totalPajakRp]
      ].filter(function (pair) { return !!pair[1]; });

      if (detailPairs.length > 0 || parsed.rawText) {
        var gridHtml = detailPairs.map(function (pair) {
          return '<div class="stnk-ocr-detail-item">' +
            '<span class="stnk-ocr-detail-k">' + _esc(pair[0]) + '</span>' +
            '<span class="stnk-ocr-detail-v">' + _esc(pair[1]) + '</span>' +
            '</div>';
        }).join('');

        var rawToggle = parsed.rawText
          ? '<details style="margin-top:8px;"><summary style="font-size:0.72rem; cursor:pointer; color:var(--n-text-secondary); font-weight:600;">Lihat Teks Mentah Hasil OCR</summary>' +
            '<pre style="margin:6px 0 0; padding:8px; background:#FFFFFF; border:1px solid var(--n-border-hairline); border-radius:6px; font-size:0.7rem; max-height:110px; overflow:auto; white-space:pre-wrap;">' + _esc(parsed.rawText) + '</pre></details>'
          : '';

        detailBox.classList.remove('n-hidden');
        detailBox.innerHTML =
          '<div style="font-weight:700; font-size:0.74rem; color:var(--n-text-primary);">Rincian Identitas STNK Terbaca OCR</div>' +
          (gridHtml ? ('<div class="stnk-ocr-detail-grid">' + gridHtml + '</div>') : '<div style="margin-top:4px; color:var(--n-text-muted);">Belum ada atribut rinci yang terbaca jelas.</div>') +
          rawToggle;
      } else {
        detailBox.classList.add('n-hidden');
        detailBox.innerHTML = '';
      }
    }

    if (firstMissingEl && typeof firstMissingEl.focus === 'function') {
      firstMissingEl.focus();
    }
  }

  function _stnkHandleUploadAndOcr(ctx, file) {
    if (!file) return;
    var cfg = _stnkGetCtxConfig(ctx);
    var pImg = document.getElementById(cfg.previewImgId);
    var ph = document.getElementById(cfg.placeholderId);
    var statusEl = document.getElementById(cfg.statusId);
    var badgeEl = document.getElementById(cfg.badgeId);
    var missingBox = document.getElementById(cfg.missingBoxId);
    var detailBox = document.getElementById(cfg.detailBoxId);

    if (badgeEl) badgeEl.style.display = 'none';
    if (missingBox) { missingBox.classList.add('n-hidden'); missingBox.innerHTML = ''; }
    if (detailBox) { detailBox.classList.add('n-hidden'); detailBox.innerHTML = ''; }
    if (statusEl) statusEl.textContent = 'Memuat berkas dan menyiapkan pemindaian OCR...';

    var reader = new FileReader();
    reader.onload = function (ev) {
      var b64 = ev.target.result;
      var payload = {
        dataBase64: b64,
        mimeType: file.type || 'image/jpeg',
        fileName: file.name
      };

      if (ctx === 'quick') {
        _SIMANPOA.pendingQuickStnkPhoto = payload;
        _SIMANPOA.pendingQuickStnkFile = file;
      } else {
        _BMN.currentStnkPhoto = payload;
        _BMN.currentStnkFile = file;
      }

      _stnkFileToCanvas(file, b64, function (convErr, cvs, previewDataUrl) {
        if (convErr || !cvs) {
          if (pImg) pImg.style.display = 'none';
          if (ph) { ph.style.display = 'block'; ph.textContent = file.name || 'Berkas gagal dipratinjau'; }
          _stnkApplyResultToUi(ctx, null, convErr ? convErr.message : 'Gagal membaca berkas STNK.');
          return;
        }

        if (pImg && previewDataUrl) {
          pImg.src = previewDataUrl;
          pImg.style.display = 'block';
        }
        if (ph) ph.style.display = 'none';

        _stnkRunOcrPasses(
          cvs,
          function (progText) {
            if (statusEl) statusEl.textContent = progText;
          },
          function (ocrErr, parsed) {
            if (ocrErr && (!parsed || parsed.score === 0)) {
              _stnkApplyResultToUi(ctx, null, ocrErr.message);
              return;
            }
            _stnkApplyResultToUi(ctx, parsed, null);
          }
        );
      });
    };
    reader.readAsDataURL(file);
  }

  function _bmnHandleStnkFile(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    _stnkHandleUploadAndOcr('form', file);
  }

  function _bmnTriggerStnkOcr() {
    var fileInput = document.getElementById('bmn-form-foto-stnk');
    var file = (fileInput && fileInput.files && fileInput.files[0]) || _BMN.currentStnkFile;
    var statusEl = document.getElementById('bmn-stnk-ocr-status');
    if (!file) {
      if (statusEl) statusEl.textContent = 'Pilih foto atau PDF STNK terlebih dahulu.';
      return;
    }
    _stnkHandleUploadAndOcr('form', file);
  }

  // ── SIMANPOA PILLAR & SUBWORKSPACE SWITCHER ───────────────

  function _simanpoaSwitchPillar(pillar) {
    _SIMANPOA.currentPillar = pillar || 'penatausahaan';

    var p1Card = document.getElementById('simanpoa-pillar-penatausahaan');
    var p2Card = document.getElementById('simanpoa-pillar-pengelolaan');
    var p1Ws = document.getElementById('simanpoa-workspace-penatausahaan');
    var p2Ws = document.getElementById('simanpoa-workspace-pengelolaan');

    if (p1Card) p1Card.classList.toggle('active', _SIMANPOA.currentPillar === 'penatausahaan');
    if (p2Card) p2Card.classList.toggle('active', _SIMANPOA.currentPillar === 'pengelolaan');

    if (p1Ws) p1Ws.classList.toggle('n-hidden', _SIMANPOA.currentPillar !== 'penatausahaan');
    if (p2Ws) p2Ws.classList.toggle('n-hidden', _SIMANPOA.currentPillar !== 'pengelolaan');

    if (_SIMANPOA.currentPillar === 'penatausahaan') {
      _simanpoaSelectPenatausahaanSub(_SIMANPOA.penatausahaanSub || 'register');
    } else {
      _simanpoaSelectPengelolaanSub(_SIMANPOA.pengelolaanSub || 'docdisposal');
    }
  }

  function _simanpoaSelectPenatausahaanSub(sub) {
    _SIMANPOA.penatausahaanSub = sub || 'register';

    var subTabs = ['neraca', 'sakti11', 'register', 'kendaraan'];
    subTabs.forEach(function (t) {
      var btn = document.getElementById('simanpoa-subtab-' + t);
      var pane = document.getElementById('simanpoa-pane-' + t);
      if (btn) btn.classList.toggle('active', t === _SIMANPOA.penatausahaanSub);
      if (pane) pane.classList.toggle('n-hidden', t !== _SIMANPOA.penatausahaanSub);
    });

    if (_SIMANPOA.penatausahaanSub === 'register') {
      var asetSubview = document.getElementById('bmn-subview-aset');
      if (asetSubview) asetSubview.classList.remove('n-hidden');
    }
  }

  function _simanpoaSelectPengelolaanSub(sub) {
    _SIMANPOA.pengelolaanSub = sub || 'docdisposal';

    var subTabs = ['docdisposal', 'usulan'];
    subTabs.forEach(function (t) {
      var btn = document.getElementById('simanpoa-subtab-' + t);
      var pane = document.getElementById('simanpoa-pane-' + t);
      if (btn) btn.classList.toggle('active', t === _SIMANPOA.pengelolaanSub);
      if (pane) pane.classList.toggle('n-hidden', t !== _SIMANPOA.pengelolaanSub);
    });

    if (_SIMANPOA.pengelolaanSub === 'usulan') {
      var hpsSubview = document.getElementById('bmn-subview-penghapusan');
      if (hpsSubview) hpsSubview.classList.remove('n-hidden');
    }
    _bmnLoadPenghapusanList();
  }

  function _simanpoaSet11ColMode(mode) {
    _SIMANPOA.sakti11Mode = mode || 'INTRA';
    var btns = document.querySelectorAll('.simanpoa-11col-seg-btn');
    btns.forEach(function (b) {

        _simanpoaRender11ColTable(res.data.rekapSakti);
        _simanpoaRenderKendaraan(res.data.kendaraan);
        _bmnCheckAndShowStnkPopup(res.data.kendaraan ? res.data.kendaraan.dueAlerts : []);

      var matchNama = String(it.uraianBarang || '').toLowerCase().indexOf(search) !== -1;

  function _simanpoaBindDropzone(dropzoneId, inputId, handlerFn) {
